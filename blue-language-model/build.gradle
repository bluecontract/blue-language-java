plugins {
    id 'blue.java8-library-conventions'
    id 'blue.reproducible-archives'
    id 'blue.api-baseline'
    id 'blue.jreleaser-publishing'
}

description = 'Stable Blue Language data, annotation, and wire value types.'

sourceSets {
    main {
        java {
            srcDirs = [rootProject.file('src/main/java')]
            include 'blue/language/model/**'
        }
        resources.srcDirs = []
    }
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
}
