// Verification workflows opt in to same-run remote transition receipts.
// Production evidence rules remain unchanged; publication is never allowed in
// this invocation. Every delegated test requires an exact-source receipt.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def script = new File(root.projectDir, '.github/scripts/ci-timing-experiment.js')
    if (!script.isFile()) return // Included build-logic build has no such script.
    def distributed = System.getenv('BLUE_CI_DISTRIBUTED') == 'verified-source'
    if (distributed) {
        def check = ['node', new File(root.projectDir, '.github/scripts/ci-verification-source.js').absolutePath, 'check'].execute(null, root.projectDir)
        if (check.waitFor() != 0) throw new GradleException('Prepared CI source identity is invalid: ' + check.err.text)
    }
    if (!distributed && (System.getenv('GITHUB_REF') != 'refs/heads/codex/ci/language-parallel-experiment'
            || System.getenv('EXPERIMENT_GROUP') != 'core'
            || !System.getenv('CI_TRANSITION_RECEIPTS'))) {
        throw new GradleException('Remote test receipts are restricted to the isolated CI experiment')
    }
    if (!gradle.startParameter.excludedTaskNames.empty) {
        throw new GradleException('Distributed verification cannot exclude Gradle tasks')
    }
    def command = ['node', script.absolutePath, 'assignments'].execute(null, root.projectDir)
    def json = command.text
    if (command.waitFor() != 0) throw new GradleException('Cannot load transition assignments')
    def assignments = new groovy.json.JsonSlurper().parseText(json)
    assignments.each { group, taskPaths ->
        taskPaths.each { taskPath ->
            def task = root.tasks.getByPath(taskPath)
            if (!(task instanceof org.gradle.api.tasks.Exec)) {
                throw new GradleException("Expected an Exec transition task: ${taskPath}")
            }
            task.workingDir(root.projectDir)
            task.commandLine('node', script.absolutePath, 'receipt', group, taskPath)
            // Revalidate even on the second invocation (rcVerify); no Python rerun.
            task.outputs.upToDateWhen { false }
        }
    }
    gradle.taskGraph.whenReady { graph ->
        graph.allTasks.each { task ->
            def name = task.name.toLowerCase(java.util.Locale.ROOT)
            if (name.contains('jreleaser') || ((name == 'publish' || task.name ==~ /publish[A-Z].*/)
                    && !name.endsWith('tostagingrepository'))) {
                throw new GradleException("Publication is forbidden in the CI timing experiment: ${task.path}")
            }
        }
    }
}
