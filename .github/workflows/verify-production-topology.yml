name: Verify distributed production topology (Java 25, no publication)
on:
  workflow_dispatch:
  push:
    branches: ['codex/ci/language-parallel-experiment']
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-production-topology-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare-rc25:
    if: github.ref == 'refs/heads/codex/ci/language-parallel-experiment'
    uses: ./.github/workflows/prepare-verification-source.yml
    with:
      mode: fixture
      scope: rc25
  transitions-rc25:
    needs: prepare-rc25
    uses: ./.github/workflows/transition-verification.yml
    with:
      cache-disabled: true
      scope: rc25
      commit: ${{ needs.prepare-rc25.outputs.commit }}
      tree: ${{ needs.prepare-rc25.outputs.tree }}
      prepared: ${{ needs.prepare-rc25.outputs.prepared }}
  core-rc25:
    needs: prepare-rc25
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: true
      BLUE_RELEASE_CHANNEL: rc
      BLUE_CI_DISTRIBUTED: verified-source
      BLUE_CI_SCOPE: rc25
      BLUE_CI_COMMIT: ${{ needs.prepare-rc25.outputs.commit }}
      BLUE_CI_TREE: ${{ needs.prepare-rc25.outputs.tree }}
      BLUE_CI_PREPARED: ${{ needs.prepare-rc25.outputs.prepared }}
      BLUE_CI_SOURCE: ${{ github.workspace }}/../verification-source
      CI_TRANSITION_RECEIPTS: ${{ github.workspace }}/../transition-receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verification-setup
        with:
          cache-disabled: 'true'
      - name: Start verification timing
        run: echo "VERIFY_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/verify-core
        with:
          release: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record successful verification time
        run: node .github/scripts/ci-timing-experiment.js record-core "$RUNNER_TEMP/verification-timing"
      - uses: actions/upload-artifact@v4
        with:
          name: java25-timing-rc25
          path: ${{ runner.temp }}/verification-timing/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-reports-rc25
          path: |
            build/reports
            build/test-results
            blue-*/build/reports
            blue-*/build/test-results
            examples/build/reports
            examples/build/test-results
            build-logic/build/reports
            smoke-tests/published/build/reports
  prepare-build25:
    if: github.ref == 'refs/heads/codex/ci/language-parallel-experiment'
    uses: ./.github/workflows/prepare-verification-source.yml
    with:
      mode: existing
      scope: build25
  transitions-build25:
    needs: prepare-build25
    uses: ./.github/workflows/transition-verification.yml
    with:
      cache-disabled: true
      scope: build25
      commit: ${{ needs.prepare-build25.outputs.commit }}
      tree: ${{ needs.prepare-build25.outputs.tree }}
      prepared: ${{ needs.prepare-build25.outputs.prepared }}
  core-build25:
    needs: prepare-build25
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: true
      BLUE_RELEASE_CHANNEL: rc
      BLUE_CI_DISTRIBUTED: verified-source
      BLUE_CI_SCOPE: build25
      BLUE_CI_COMMIT: ${{ needs.prepare-build25.outputs.commit }}
      BLUE_CI_TREE: ${{ needs.prepare-build25.outputs.tree }}
      BLUE_CI_PREPARED: ${{ needs.prepare-build25.outputs.prepared }}
      BLUE_CI_SOURCE: ${{ github.workspace }}/../verification-source
      CI_TRANSITION_RECEIPTS: ${{ github.workspace }}/../transition-receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verification-setup
        with:
          cache-disabled: 'true'
      - name: Start verification timing
        run: echo "VERIFY_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/verify-core
        with:
          release: 'false'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record successful verification time
        run: node .github/scripts/ci-timing-experiment.js record-core "$RUNNER_TEMP/verification-timing"
      - uses: actions/upload-artifact@v4
        with:
          name: java25-timing-build25
          path: ${{ runner.temp }}/verification-timing/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-reports-build25
          path: |
            build/reports
            build/test-results
            blue-*/build/reports
            blue-*/build/test-results
            examples/build/reports
            examples/build/test-results
            build-logic/build/reports
            smoke-tests/published/build/reports
  prepare-stable25:
    if: github.ref == 'refs/heads/codex/ci/language-parallel-experiment'
    uses: ./.github/workflows/prepare-verification-source.yml
    with:
      mode: stable-fixture
      scope: stable25
  transitions-stable25:
    needs: prepare-stable25
    uses: ./.github/workflows/transition-verification.yml
    with:
      cache-disabled: true
      scope: stable25
      commit: ${{ needs.prepare-stable25.outputs.commit }}
      tree: ${{ needs.prepare-stable25.outputs.tree }}
      prepared: ${{ needs.prepare-stable25.outputs.prepared }}
  core-stable25:
    needs: prepare-stable25
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: true
      BLUE_RELEASE_CHANNEL: stable
      BLUE_CI_DISTRIBUTED: verified-source
      BLUE_CI_SCOPE: stable25
      BLUE_CI_COMMIT: ${{ needs.prepare-stable25.outputs.commit }}
      BLUE_CI_TREE: ${{ needs.prepare-stable25.outputs.tree }}
      BLUE_CI_PREPARED: ${{ needs.prepare-stable25.outputs.prepared }}
      BLUE_CI_SOURCE: ${{ github.workspace }}/../verification-source
      CI_TRANSITION_RECEIPTS: ${{ github.workspace }}/../transition-receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verification-setup
        with:
          cache-disabled: 'true'
      - name: Start verification timing
        run: echo "VERIFY_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/verify-core
        with:
          release: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record successful verification time
        run: node .github/scripts/ci-timing-experiment.js record-core "$RUNNER_TEMP/verification-timing"
      - uses: actions/upload-artifact@v4
        with:
          name: java25-timing-stable25
          path: ${{ runner.temp }}/verification-timing/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-reports-stable25
          path: |
            build/reports
            build/test-results
            blue-*/build/reports
            blue-*/build/test-results
            examples/build/reports
            examples/build/test-results
            build-logic/build/reports
            smoke-tests/published/build/reports
  serial-baseline:
    name: Serial RC baseline on Java 25
    needs: prepare-rc25
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CI: true
      BLUE_RELEASE_CHANNEL: rc
      BLUE_CI_DISTRIBUTED: verified-source
      BLUE_CI_SCOPE: rc25
      BLUE_CI_COMMIT: ${{ needs.prepare-rc25.outputs.commit }}
      BLUE_CI_TREE: ${{ needs.prepare-rc25.outputs.tree }}
      BLUE_CI_PREPARED: ${{ needs.prepare-rc25.outputs.prepared }}
      BLUE_CI_SOURCE: ${{ github.workspace }}/../verification-source
      CI_TRANSITION_RECEIPTS: ${{ github.workspace }}/../transition-receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verification-setup
        with:
          cache-disabled: 'true'
      - name: Run original serial verification on the same prepared source
        run: node .github/scripts/ci-timing-experiment.js run baseline "$RUNNER_TEMP/verification-timing"
      - uses: actions/upload-artifact@v4
        with:
          name: java25-timing-baseline
          path: ${{ runner.temp }}/verification-timing/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-reports-baseline25
          path: |
            build/reports
            build/test-results
            blue-*/build/reports
            blue-*/build/test-results
            examples/build/reports
            examples/build/test-results
  build-tooling:
    needs: prepare-build25
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      BLUE_RELEASE_CHANNEL: rc
      BLUE_CI_DISTRIBUTED: verified-source
      BLUE_CI_SCOPE: build25
      BLUE_CI_COMMIT: ${{ needs.prepare-build25.outputs.commit }}
      BLUE_CI_TREE: ${{ needs.prepare-build25.outputs.tree }}
      BLUE_CI_PREPARED: ${{ needs.prepare-build25.outputs.prepared }}
      BLUE_CI_SOURCE: ${{ github.workspace }}/../verification-source
      CI_TRANSITION_RECEIPTS: ${{ github.workspace }}/../transition-receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verification-setup
        with:
          cache-disabled: 'true'
      - name: Verify Gradle tooling contracts on Java 25
        run: ./gradlew -p build-logic test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-tooling-reports
          path: build-logic/build/reports
  compare:
    needs: [core-rc25, core-build25, core-stable25, transitions-rc25, transitions-build25, transitions-stable25, serial-baseline, build-tooling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: java25-timing-*
          merge-multiple: true
          path: ${{ runner.temp }}/timings
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-rc25-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/timings
      - name: Compare complete same-source Java 25 RC verification
        run: node .github/scripts/ci-timing-experiment.js compare-production "$RUNNER_TEMP/timings"
