name: CI timing experiment (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-timing-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.ref == 'refs/heads/codex/ci/language-parallel-experiment'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete, disjoint test assignment
        run: node --test .github/scripts/*.test.js
      - id: matrix
        run: echo "matrix=$(node .github/scripts/ci-timing-experiment.js matrix)" >> "$GITHUB_OUTPUT"

  measure:
    name: Measure ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: true
      EXPERIMENT_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set reproducible timestamp from the shared commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Set up Java 8 test runtime
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: corretto
      - name: Set up JDK 17, matching Release RC
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: corretto
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Both variants start cold; Gradle still reuses outputs within a job.
          cache-disabled: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Prepare Gradle distribution before timing
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - name: Run verification only and record timings
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TRANSITION_RECEIPTS: ${{ runner.temp }}/transition-receipts
        run: node .github/scripts/ci-timing-experiment.js run "$EXPERIMENT_GROUP" "$RUNNER_TEMP/ci-timing"
      - name: Save timings, including failed commands
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-timing/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.group }}
          path: |
            build/reports/**
            build/test-results/**
            blue-*/build/reports/**
            blue-*/build/test-results/**
            examples/build/test-results/**
            build-logic/build/reports/**
            smoke-tests/published/build/reports/**
            ${{ runner.temp }}/transition-receipts/**
          if-no-files-found: ignore
          retention-days: 7

  test-forks:
    name: Full clean build with ${{ matrix.forks }} test process(es)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        forks: [1, 4]
    env:
      CI: true
      TEST_FORKS: ${{ matrix.forks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Set up Java 8 test runtime
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: corretto
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: corretto
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Prepare Gradle distribution before timing
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - name: Measure full clean build without test exclusions
        shell: bash
        run: |
          SECONDS=0
          set +e
          ./gradlew --no-daemon --no-build-cache --max-workers=4 \
            -PblueTestMaxParallelForks="$TEST_FORKS" clean build
          result=$?
          echo "Full clean build: forks=$TEST_FORKS, seconds=$SECONDS, exit=$result" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Save full-build test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-forks-${{ matrix.forks }}
          path: |
            build/test-results/**
            blue-*/build/test-results/**
            examples/build/test-results/**
            build/reports/**
            blue-*/build/reports/**
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Compare timings and require every test group
    needs: [plan, measure]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: timing-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/ci-timing
      - name: Require all jobs to succeed
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: test "$MEASURE_RESULT" = success
      - name: Compare complete results from the same commit
        run: node .github/scripts/ci-timing-experiment.js summary "$RUNNER_TEMP/ci-timing"
