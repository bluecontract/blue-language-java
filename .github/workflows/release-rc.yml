name: Release RC

on:
  workflow_dispatch:
  push:
    branches:
      - next
    paths:
      - '.cz.toml'
      - '.github/**'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - 'README*'
      - 'api/**'
      - 'blue-*/**'
      - 'build.gradle'
      - 'build-logic/**'
      - 'examples/**'
      - 'settings.gradle*'
      - 'smoke-tests/**'
      - 'docs/**'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'src/**'
      - 'tools/**'

permissions:
  contents: read

env:
  CI: true
  BLUE_RELEASE_CHANNEL: rc

concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ReleaseRC:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ') == false }}"
    runs-on: ubuntu-latest
    environment: rc-release
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch master and tags
        run: git fetch origin master:refs/remotes/origin/master --tags

      - name: Set up Java 8 test runtime
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'corretto'

      # Immutable RC repository provenance requires the build to run on Java 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RC verification dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Test release tooling
        run: node --test .github/scripts/*.test.js

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Prepare RC version
        id: version
        run: node .github/scripts/prepare-rc-release.js

      - name: Verify prepared RC metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/verify-release-readiness.js

      - name: Commit RC version
        run: |
          git add .cz.toml
          git commit -m "chore: release ${{ steps.version.outputs.version }}"

      - name: Configure reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Execute clean Gradle build
        run: ./gradlew clean build

      - name: Execute RC verification
        run: ./gradlew rcVerify

      - name: Verify reproducible source release
        run: |
          mapfile -t source_archives < <(find build/release -maxdepth 1 -type f -name '*-source-release.zip')
          test "${#source_archives[@]}" -eq 1
          first_sha="$(sha256sum "${source_archives[0]}" | awk '{print $1}')"
          ./gradlew sourceReleaseArchive --rerun-tasks
          second_sha="$(sha256sum "${source_archives[0]}" | awk '{print $1}')"
          test "$first_sha" = "$second_sha"

      - name: Verify final Language 1.0 and Contracts kernel 1.0 API baseline
        run: ./gradlew verifyFinalApiBaseline

      - name: Tag verified RC version
        run: git tag -a "v${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"

      # Publish the unique version reservation before any remote artifact upload.
      # A failed release can then advance to a new RC instead of reusing a
      # coordinate that a previous attempt may already have uploaded.
      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh auth setup-git
          git push origin HEAD:next --follow-tags

      - name: Verify immutable release tag provenance
        run: |
          release_commit="$(git rev-parse HEAD)"
          local_tag_commit="$(git rev-parse 'v${{ steps.version.outputs.version }}^{}')"
          remote_tag_commit="$(git ls-remote origin 'refs/tags/v${{ steps.version.outputs.version }}^{}' | awk '{print $1}')"
          test -n "$remote_tag_commit"
          test "$release_commit" = "$local_tag_commit"
          test "$release_commit" = "$remote_tag_commit"

      - name: Execute Gradle publish
        run: ./gradlew publish

      - name: Execute Gradle release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: ./gradlew jreleaserFullRelease

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-artifacts
          path: |
            blue-*/build/libs
            blue-*/build/publications
            build/staging-deploy
            build/release
            build/reports
            build/jreleaser
