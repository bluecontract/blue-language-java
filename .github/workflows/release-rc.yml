name: Release RC

on:
  workflow_dispatch:
  push:
    branches:
      - next
    paths:
      - '.cz.toml'
      - '.github/**'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - 'README*'
      - 'api/**'
      - 'blue-*/**'
      - 'build.gradle'
      - 'build-logic/**'
      - 'examples/**'
      - 'settings.gradle*'
      - 'smoke-tests/**'
      - 'docs/**'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'src/**'
      - 'tools/**'

permissions:
  contents: read
  actions: read

env:
  CI: true
  BLUE_RELEASE_CHANNEL: rc

concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require next release branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = 'refs/heads/next'
  prepare:
    needs: guard
    if: "github.ref == 'refs/heads/next' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release '))"
    uses: ./.github/workflows/prepare-verification-source.yml
    with:
      mode: rc
      scope: rc
  transitions:
    needs: prepare
    uses: ./.github/workflows/transition-verification.yml
    with:
      scope: rc
      commit: ${{ needs.prepare.outputs.commit }}
      tree: ${{ needs.prepare.outputs.tree }}
      prepared: ${{ needs.prepare.outputs.prepared }}
      source-attempt: ${{ needs.prepare.outputs.attempt }}

  ReleaseRC:
    name: Verify and release RC
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: rc-release
    env:
      BLUE_CI_DISTRIBUTED: verified-source
      BLUE_CI_SCOPE: rc
      BLUE_CI_COMMIT: ${{ needs.prepare.outputs.commit }}
      BLUE_CI_TREE: ${{ needs.prepare.outputs.tree }}
      BLUE_CI_SOURCE_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
      BLUE_CI_PREPARED: ${{ needs.prepare.outputs.prepared }}
      BLUE_CI_SOURCE: ${{ github.workspace }}/../verification-source
      CI_TRANSITION_RECEIPTS: ${{ github.workspace }}/../transition-receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verification-setup
      - name: Build and run local checks
        uses: ./.github/actions/verify-core
        with:
          phase: build

      - name: Wait for transition verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/ci-verification-source.js check
          node .github/scripts/ci-verification-gate.js

      - name: Verify release after all transition checks
        uses: ./.github/actions/verify-core
        with:
          phase: release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure Git for verified RC reservation
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
      - name: Tag verified RC version
        run: git tag -a "v${{ needs.prepare.outputs.version }}" -m "Release ${{ needs.prepare.outputs.version }}"

      # Publish the unique version reservation before any remote artifact upload.
      # A failed release can then advance to a new RC instead of reusing a
      # coordinate that a previous attempt may already have uploaded.
      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh auth setup-git
          git push origin HEAD:next --follow-tags

      - name: Verify immutable release tag provenance
        run: |
          release_commit="$(git rev-parse HEAD)"
          local_tag_commit="$(git rev-parse 'v${{ needs.prepare.outputs.version }}^{}')"
          remote_tag_commit="$(git ls-remote origin 'refs/tags/v${{ needs.prepare.outputs.version }}^{}' | awk '{print $1}')"
          test -n "$remote_tag_commit"
          test "$release_commit" = "$local_tag_commit"
          test "$release_commit" = "$remote_tag_commit"

      - name: Execute Gradle publish
        run: ./gradlew publish

      - name: Sign, upload and submit Maven Central deployment
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: |
          rm -f build/jreleaser/output.properties build/jreleaser/maven-central-published.json build/jreleaser/maven-central-submitted.properties
          ./gradlew jreleaserDeploy -PblueMavenCentralSkipPublicationCheck=true
          cp build/jreleaser/output.properties build/jreleaser/maven-central-submitted.properties

      - name: Wait for Maven Central publication
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: >-
          python .github/scripts/wait-maven-central.py build/jreleaser/maven-central-submitted.properties
          --receipt build/jreleaser/maven-central-published.json

      - name: Complete GitHub release after Maven Central publication
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: ./gradlew jreleaserFullRelease --exclude-deployer-name=sonatype

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-artifacts-${{ github.run_attempt }}
          path: |
            blue-*/build/libs
            blue-*/build/publications
            build/staging-deploy
            build/release
            build/reports
            examples/build/test-results
            build/jreleaser
