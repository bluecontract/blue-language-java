name: Build and validate

on:
  push:
    branches: [codex/ci/language-four-jvms]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    uses: ./.github/workflows/prepare-verification-source.yml
    with:
      mode: existing
      scope: build
  transitions:
    needs: prepare
    uses: ./.github/workflows/transition-verification.yml
    with:
      scope: build
      commit: ${{ needs.prepare.outputs.commit }}
      tree: ${{ needs.prepare.outputs.tree }}
      prepared: ${{ needs.prepare.outputs.prepared }}
      source-attempt: ${{ needs.prepare.outputs.attempt }}

  Build:
    name: Full build / ${{ matrix.forks }} JVMs
    strategy:
      fail-fast: false
      matrix:
        forks: [1, 4]
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
      BLUE_EXPERIMENT_FORKS: ${{ matrix.forks }}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4
      PYTHONHASHSEED: 0
      BLUE_CI_DISTRIBUTED: verified-source
      BLUE_CI_SCOPE: build
      BLUE_CI_COMMIT: ${{ needs.prepare.outputs.commit }}
      BLUE_CI_TREE: ${{ needs.prepare.outputs.tree }}
      BLUE_CI_SOURCE_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
      BLUE_CI_PREPARED: ${{ needs.prepare.outputs.prepared }}
      BLUE_CI_SOURCE: ${{ github.workspace }}/../verification-source
      CI_TRANSITION_RECEIPTS: ${{ github.workspace }}/../transition-receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verification-setup
      - name: Install process monitor
        run: python -m pip install psutil==7.0.0
      - name: Record runner capacity
        run: |
          test "$(nproc)" -eq 4
          lscpu
          free -b
          java -version
      - uses: ./.github/actions/verify-core
        with:
          release: 'false'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.forks }}-${{ github.run_attempt }}
          path: |
            build/reports
            build/test-results
            blue-*/build/reports
            blue-*/build/test-results
            examples/build/reports
            examples/build/test-results
            build-logic/build/reports
            smoke-tests/published/build/reports
      - name: Archive libs
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.forks }}-${{ github.run_attempt }}
          path: blue-*/build/libs

      - name: Archive fork experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-experiment-${{ matrix.forks }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-experiment
          if-no-files-found: error
