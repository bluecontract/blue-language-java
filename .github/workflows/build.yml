name: Check existing RC28 Maven Central status

on:
  push:
    branches:
      - codex/language-rc28-status-check

permissions:
  contents: read

jobs:
  status:
    name: Read existing RC28 deployment status
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: rc-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm existing deployment publication (status API only)
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: |
          printf '%s\n' 'deployMavenCentralSonatypeDeploymentId=4b5b2451-c22f-4f8e-841f-1e08b1b714ec' > "$RUNNER_TEMP/rc28-submitted.properties"
          timeout 120s python3 .github/scripts/wait-maven-central.py "$RUNNER_TEMP/rc28-submitted.properties" --receipt "$RUNNER_TEMP/rc28-published.json"
