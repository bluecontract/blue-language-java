name: Build and validate

on:
  push:
    branches:
      - master
      - next
      - 'codex/*'
      - 'feature/*'
      - 'fix/*'
      - 'hotfix/*'
      - 'release/*'
  pull_request:
    branches:
      - master
      - next

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8 test runtime
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test release tooling
        run: node --test .github/scripts/*.test.js

      - name: Execute Gradle build
        run: ./gradlew clean build

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always() # run even if build failed
        with:
          name: test-results
          path: |
            build/reports
            blue-*/build/reports
            examples/build/reports
            build-logic/build/reports
            smoke-tests/published/build/reports

      - name: Archive libs
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: blue-*/build/libs
