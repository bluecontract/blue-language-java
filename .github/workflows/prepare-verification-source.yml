name: Prepare verification source
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      scope:
        type: string
        required: true
    outputs:
      commit:
        value: ${{ jobs.prepare.outputs.commit }}
      tree:
        value: ${{ jobs.prepare.outputs.tree }}
      prepared:
        value: ${{ jobs.prepare.outputs.prepared }}
      version:
        value: ${{ jobs.prepare.outputs.version }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
      prepared: ${{ steps.source.outputs.prepared }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release tooling
        run: node --test .github/scripts/*.test.js
      - name: Fetch master and tags
        if: inputs.mode == 'rc'
        run: git fetch origin master:refs/remotes/origin/master --tags
      - name: Prepare one immutable source bundle
        id: source
        env:
          SOURCE_MODE: ${{ inputs.mode }}
          BLUE_CI_SCOPE: ${{ inputs.scope }}
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          node .github/scripts/ci-verification-source.js prepare "$RUNNER_TEMP/verification-source" "$SOURCE_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ inputs.scope }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-source
          if-no-files-found: error
          retention-days: 7
