    properties:
      sequence: {$ref: '#/$defs/nonNegativeSafeInteger'}
      namespace: {enum: [processor, semantic, runtime]}
      counter: {type: string}
      quantity: {$ref: '#/$defs/nonNegativeSafeInteger'}
      weight: {$ref: '#/$defs/nonNegativeSafeInteger'}
      subtotal: {$ref: '#/$defs/nonNegativeSafeInteger'}
      documentId: {$ref: '#/$defs/documentId'}
      scopePath: {type: string}
      activationGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      componentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      contractKey: {type: string}
      logicalPath: {type: string}
      workOccurrenceId: {$ref: '#/$defs/sha256Identity'}
