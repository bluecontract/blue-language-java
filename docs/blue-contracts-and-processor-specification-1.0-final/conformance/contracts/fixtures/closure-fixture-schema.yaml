    - if:
        properties:
          operation: {const: REMOVE}
        required: [operation]
      then:
        properties:
          beforeSubscriptionIdentity: {$ref: '#/$defs/sha256Identity'}
          beforeDocumentBlueId: {$ref: '#/$defs/blueId'}
          beforeGraphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
          beforeComponentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
          beforeSubscription: {$ref: '#/$defs/subscriptionState'}
          afterSubscriptionIdentity: {type: 'null'}
          afterDocumentBlueId: {type: 'null'}
          afterGraphGeneration: {type: 'null'}
          afterComponentGeneration: {type: 'null'}
          afterSubscription: {type: 'null'}
    - if:
        properties:
          operation: {const: REPLACE}
        required: [operation]
      then:
        properties:
          beforeSubscriptionIdentity: {$ref: '#/$defs/sha256Identity'}
          beforeDocumentBlueId: {$ref: '#/$defs/blueId'}
          beforeGraphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
          beforeComponentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
          beforeSubscription: {$ref: '#/$defs/subscriptionState'}
          afterSubscriptionIdentity: {$ref: '#/$defs/sha256Identity'}
          afterDocumentBlueId: {$ref: '#/$defs/blueId'}
          afterGraphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
          afterComponentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
          afterSubscription: {$ref: '#/$defs/subscriptionState'}
  publicEvent:
    type: object
    additionalProperties: false
    required: [publicEventOrdinal, publicRootDocumentId, eventOccurrenceIdentity, eventBlueId, event]
    properties:
