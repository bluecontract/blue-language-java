    - type: object
      additionalProperties: false
      required: [kind, finalizationOrdinal, componentIdentity, componentGeneration]
      properties:
        kind: {const: FINALIZATION}
        finalizationOrdinal: {$ref: '#/$defs/nonNegativeSafeInteger'}
        componentIdentity: {$ref: '#/$defs/sha256Identity'}
        componentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
  rejectedCharge:
    type: object
    additionalProperties: false
    required: [rejectedChargeIdentity, namespace, counter, quantity, weight, subtotal, applicableCap, remainingBeforeCharge, owner]
    properties:
      rejectedChargeIdentity: {$ref: '#/$defs/sha256Identity'}
      namespace: {enum: [processor, semantic, runtime]}
      counter: {type: string, minLength: 1}
      quantity: {$ref: '#/$defs/positiveSafeInteger'}
      weight: {$ref: '#/$defs/nonNegativeSafeInteger'}
      subtotal: {$ref: '#/$defs/nonNegativeSafeInteger'}
      applicableCap: {$ref: '#/$defs/applicableCap'}
      remainingBeforeCharge: {$ref: '#/$defs/nonNegativeSafeInteger'}
      owner: {$ref: '#/$defs/rejectedChargeOwner'}
  limitGenerator:
    type: object
    additionalProperties: false
    required: [kind, parameters]
    properties:
      kind:
        enum: [managed-documents, embedded-edges, cyclic-members, cyclic-edges, cyclic-canonical-bytes, graph-changes, closure-expansions, work-occurrences, tentative-finalizations]
      parameters:
        type: object
        additionalProperties: {$ref: '#/$defs/nonNegativeSafeInteger'}
  limitInput:
    type: object
    additionalProperties: false
    required: [limit, configured, observed, generator]
    properties:
      limit:
        enum: [managedDocumentsPerClosure, processEmbeddedEdgesPerClosure, cyclicMembersPerComponent, cyclicEdgesPerComponent, cyclicCanonicalBytesPerComponent, closureGraphChangesPerInvocation, closureExpansionsPerInvocation, closureWorkOccurrencesPerInvocation, closureTentativeFinalizationsPerInvocation]
      configured: {$ref: '#/$defs/nonNegativeSafeInteger'}
      observed: {$ref: '#/$defs/nonNegativeSafeInteger'}
      generator: {$ref: '#/$defs/limitGenerator'}
  limitExpected:
    type: object
    additionalProperties: false
    required: [limitDecision, rejectedStepAdmitted, subsequentOutcome]
    properties:
      limitDecision: {enum: [ACCEPT, REJECT]}
      diagnostic: {type: string}
      rejectedStep: {type: string}
      rejectedStepAdmitted: {type: boolean}
      subsequentOutcome: {enum: [NOT_EXECUTED_BY_MICROFIXTURE]}
  resultingDocument:
    type: object
    additionalProperties: false
    required: [documentId, beforeBlueId, afterBlueId, document, initialized, terminated, publicRoot, epoch, componentGeneration, componentIdentity, componentStateIdentity, memberIndex]
    properties:
      documentId: {$ref: '#/$defs/documentId'}
      beforeBlueId: {$ref: '#/$defs/blueId'}
      afterBlueId: {$ref: '#/$defs/blueId'}
      document: {$ref: '#/$defs/blueValue'}
      initialized: {type: boolean}
      terminated: {type: boolean}
      publicRoot: {type: boolean}
      epoch: {$ref: '#/$defs/nonNegativeSafeInteger'}
      componentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      componentIdentity: {$ref: '#/$defs/sha256Identity'}
      componentStateIdentity: {$ref: '#/$defs/sha256Identity'}
      memberIndex:
        description: Exact numeric #n suffix of afterBlueId for CYCLIC; null for ACYCLIC.
        $ref: '#/$defs/nullableNonNegativeSafeInteger'
  commitInputDocument:
    type: object
    additionalProperties: false
    required: [documentId, blueId]
    properties:
      documentId: {$ref: '#/$defs/documentId'}
      blueId: {$ref: '#/$defs/blueId'}
  commitInputComponent:
    type: object
    additionalProperties: false
    required: [componentIdentity, componentStateIdentity, componentGeneration, masterBlueId]
    properties:
      componentIdentity: {$ref: '#/$defs/sha256Identity'}
      componentStateIdentity: {$ref: '#/$defs/sha256Identity'}
      componentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      masterBlueId: {$ref: '#/$defs/nullableBlueId'}
  commitDocumentDelta:
    type: object
    additionalProperties: false
    required: [documentId, beforeBlueId, afterBlueId]
    properties:
      documentId: {$ref: '#/$defs/documentId'}
      beforeBlueId: {$ref: '#/$defs/blueId'}
      afterBlueId: {$ref: '#/$defs/blueId'}
  commitResultComponent:
    type: object
    additionalProperties: false
    required: [componentIdentity, componentStateIdentity, cyclicProofIdentity]
    properties:
      componentIdentity: {$ref: '#/$defs/sha256Identity'}
      componentStateIdentity: {$ref: '#/$defs/sha256Identity'}
      cyclicProofIdentity: {$ref: '#/$defs/nullableSha256Identity'}
  platformCommitCompanion:
    type: object
    additionalProperties: false
    required: [companionIdentity, invocationIdentity, inputClosureIdentity, outputClosureIdentity, expectedInputGraphGeneration, expectedInputDocuments, expectedInputComponents, inputOccurrenceBindingSetIdentity, outputGraphGeneration, resultingDocuments, resultingComponents, occurrenceBindingSetIdentity, graphChangesIdentity, checkpointWritesIdentity, subscriptionDeltasIdentity, publicEventsIdentity, gasTraceIdentity, blueLanguageSpecificationIdentity, contractsSpecificationIdentity, managedDocumentIdentityPolicyIdentity, managedBindingPolicyIdentity, exactNodeProviderDomainIdentity, externalOrderPolicyIdentity, runtimeRegistryIdentity, gasManifestIdentity, portableLimitPolicyIdentity, cyclicFinalizerIdentity, cyclicProofVerifierIdentity]
    properties:
      companionIdentity: {$ref: '#/$defs/sha256Identity'}
      invocationIdentity: {$ref: '#/$defs/sha256Identity'}
      inputClosureIdentity: {$ref: '#/$defs/sha256Identity'}
      outputClosureIdentity: {$ref: '#/$defs/sha256Identity'}
      expectedInputGraphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      expectedInputDocuments:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/commitInputDocument'}
      expectedInputComponents:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/commitInputComponent'}
      inputOccurrenceBindingSetIdentity: {$ref: '#/$defs/sha256Identity'}
      outputGraphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      resultingDocuments:
        type: array
        items: {$ref: '#/$defs/commitDocumentDelta'}
      resultingComponents:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/commitResultComponent'}
      occurrenceBindingSetIdentity: {$ref: '#/$defs/sha256Identity'}
      graphChangesIdentity: {$ref: '#/$defs/sha256Identity'}
      checkpointWritesIdentity: {$ref: '#/$defs/sha256Identity'}
      subscriptionDeltasIdentity: {$ref: '#/$defs/sha256Identity'}
      publicEventsIdentity: {$ref: '#/$defs/sha256Identity'}
      gasTraceIdentity: {$ref: '#/$defs/sha256Identity'}
      blueLanguageSpecificationIdentity: {$ref: '#/$defs/sha256Identity'}
      contractsSpecificationIdentity: {$ref: '#/$defs/sha256Identity'}
      managedDocumentIdentityPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      managedBindingPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      exactNodeProviderDomainIdentity: {$ref: '#/$defs/sha256Identity'}
      externalOrderPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      runtimeRegistryIdentity: {$ref: '#/$defs/sha256Identity'}
      gasManifestIdentity: {$ref: '#/$defs/sha256Identity'}
      portableLimitPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      cyclicFinalizerIdentity: {$ref: '#/$defs/sha256Identity'}
      cyclicProofVerifierIdentity: {$ref: '#/$defs/sha256Identity'}
  completeExpected:
    type: object
    additionalProperties: false
    required: [attemptOutcome, status, invocationIdentity, inputClosureIdentity, outputClosureIdentity, atomic, workTrace, tentativeFinalizations, graphGeneration, resultingDocuments, resultingComponents, occurrenceBindings, occurrenceBindingSetIdentity, graphChanges, graphChangesIdentity, subscriptionDeltas, subscriptionDeltasIdentity, checkpointWrites, checkpointWritesIdentity, publicEvents, publicEventsIdentity, rollbackToInput, totalGas, gasTraceIdentity]
    properties:
      attemptOutcome: {const: Complete}
      status: {enum: [success, no-match, stale, terminated, invalid-processing-document, capability-failure, runtime-fatal, gas-limit-exceeded, portable-limit-exceeded, subscription-surface-invalid]}
      invocationIdentity: {$ref: '#/$defs/sha256Identity'}
      inputClosureIdentity: {$ref: '#/$defs/sha256Identity'}
      outputClosureIdentity: {$ref: '#/$defs/sha256Identity'}
      diagnostic: {type: string}
      atomic: {const: true}
      workTrace: {type: array, items: {$ref: '#/$defs/work'}}
      rejectedWorkOccurrence: {$ref: '#/$defs/work'}
      rejectedCharge: {$ref: '#/$defs/rejectedCharge'}
      tentativeFinalizations: {type: array, items: {$ref: '#/$defs/finalization'}}
      graphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      resultingDocuments: {type: array, items: {$ref: '#/$defs/resultingDocument'}}
      resultingComponents: {type: array, minItems: 1, items: {$ref: '#/$defs/resultComponent'}}
      occurrenceBindings: {type: array, items: {$ref: '#/$defs/occurrence'}}
      occurrenceBindingSetIdentity: {$ref: '#/$defs/sha256Identity'}
      graphChanges: {type: array, items: {$ref: '#/$defs/graphChange'}}
      graphChangesIdentity: {$ref: '#/$defs/sha256Identity'}
      subscriptionDeltas: {type: array, items: {$ref: '#/$defs/subscriptionDelta'}}
      subscriptionDeltasIdentity: {$ref: '#/$defs/sha256Identity'}
      checkpointWrites: {type: array, items: {$ref: '#/$defs/checkpointWrite'}}
      checkpointWritesIdentity: {$ref: '#/$defs/sha256Identity'}
      publicEvents: {type: array, items: {$ref: '#/$defs/publicEvent'}}
      publicEventsIdentity: {$ref: '#/$defs/sha256Identity'}
      rollbackToInput: {type: boolean}
      totalGas: {$ref: '#/$defs/nonNegativeSafeInteger'}
      gasTrace: {type: array, items: {$ref: '#/$defs/gasTraceEntry'}}
      gasTraceFile: {type: string, pattern: '^traces/[a-z0-9][a-z0-9-]*-gas\.yaml$'}
      gasTraceIdentity: {$ref: '#/$defs/sha256Identity'}
      platformCommitCompanion: {$ref: '#/$defs/platformCommitCompanion'}
      observations: {type: array, items: {$ref: '#/$defs/observation'}}
      providerLoads: {type: array, items: {$ref: '#/$defs/blueId'}}
      unrelatedDocumentsOpened: {$ref: '#/$defs/nonNegativeSafeInteger'}
    allOf:
    - oneOf:
      - required: [gasTrace]
        not: {required: [gasTraceFile]}
      - required: [gasTraceFile]
        not: {required: [gasTrace]}
    - if:
        properties:
          status: {const: success}
        required: [status]
      then:
        required: [platformCommitCompanion]
      else:
        not: {required: [platformCommitCompanion]}
    - if:
        properties:
          status: {const: gas-limit-exceeded}
        required: [status]
      then:
        required: [rejectedCharge]
      else:
        not:
          anyOf:
          - required: [rejectedCharge]
          - required: [rejectedWorkOccurrence]
    - if:
        required: [rejectedCharge]
        properties:
          rejectedCharge:
            properties:
              owner:
                properties:
                  kind: {const: WORK}
                required: [kind]
            required: [owner]
      then:
        required: [rejectedWorkOccurrence]
      else:
        not: {required: [rejectedWorkOccurrence]}
  needsResourcesExpected:
    type: object
    additionalProperties: false
    required: [attemptOutcome, requiredBlueIds]
    properties:
      attemptOutcome: {const: NeedsResources}
      requiredBlueIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/blueId'}
  expected:
    oneOf:
    - {$ref: '#/$defs/completeExpected'}
    - {$ref: '#/$defs/needsResourcesExpected'}
