manifestType: blue-contracts-identity-constructors
specification: Blue Contracts and Processor
specificationVersion: '1.0'
status: normative
algorithm:
  digest: SHA-256
  encoding: RFC 8785 canonical JSON encoded as UTF-8
  envelope:
    domain: <constructor domain>
    value: <constructor value object or array>
  representation: 'sha256:<64 lowercase hexadecimal digits>'
  absentValues: Fields listed by a constructor are always present. A nullable field is encoded as JSON null; it is never omitted.
  integers: Non-negative JSON integers in the inclusive range 0..9007199254740991, with no alternate text representation. This range is the exact interoperable integer domain for every numeric constructor field.
  text:
    normalization: NFC before construction
    comparison: Unicode scalar-value sequence
  paths: Normalized absolute RFC 6901 JSON Pointers; the Root scope is represented by '/'.
  blueIds: Exact canonical BlueId text; no reference expansion is performed by these platform constructors.
  maps: Dynamic maps are converted to the ordered entry arrays specified below; authored insertion order is never hashed.
constructors:
  managedDocumentIdentityPolicyIdentity:
    domain: blue-contracts-managed-document-identity-policy/1.0
    value:
      type: object
      fields: [label]
  managedBindingPolicyIdentity:
    domain: blue-contracts-managed-binding-policy/1.0
    value:
      type: object
      fields: [label]
  managedOccurrenceIdentity:
    domain: blue-contracts-managed-occurrence-lineage/1.0
    stability: Stable while one source path activation denotes the same target document lineage.
    value:
      type: object
      fields:
      - sourceDocumentId
      - sourcePath
      - activationGeneration
      - targetDocumentId
      - bindingPolicyIdentity
  managedOccurrenceBindingIdentity:
    domain: blue-contracts-managed-occurrence/1.0
    stability: Changes whenever the exact expected target state changes.
    value:
      type: object
      fields:
      - sourceDocumentId
      - sourcePath
      - activationGeneration
      - targetDocumentId
      - expectedTargetBlueId
      - bindingPolicyIdentity
  managedScopeKeyIdentity:
    domain: blue-contracts-managed-scope-key/1.0
    value:
      type: object
      fields:
      - documentId
      - scopePath
      - activationGeneration
  componentIdentity:
    domain: blue-contracts-component/1.0
    stability: Stable for one component kind, generation and ordered membership. Exact member state is bound separately by componentStateIdentity.
    value:
      type: object
      fields:
      - kind
      - generation
      - members
      fieldRules:
        members: DocumentIds sorted by Unicode scalar-value sequence.
  cyclicProofIdentity:
    domain: blue-contracts-cyclic-proof-evidence/1.0
    value:
      type: object
      fields:
      - componentIdentity
      - masterBlueId
      - memberStates
      - declaredPlaceholderSet
      fieldRules:
        memberStates: Array of objects with fields documentId and blueId, in the component's canonical member order.
        declaredPlaceholderSet: Complete canonical Blue Language section 15 proof/member-order value after canonical this#n remapping; never a host implementation serialization.
  componentStateIdentity:
    domain: blue-contracts-component-state/1.0
    stability: Exact component-state identity; a changed member BlueId, cyclic MASTER or complete proof changes this identity while componentIdentity can remain continuous.
    value:
      type: object
      fields:
      - componentIdentity
      - memberStates
      - masterBlueId
      - cyclicProofIdentity
      fieldRules:
        memberStates: Array of objects with fields documentId and blueId, sorted by DocumentId.
        masterBlueId: Exact MASTER BlueId for CYCLIC; JSON null for ACYCLIC.
        cyclicProofIdentity: Exact cyclicProofIdentity for CYCLIC; JSON null for ACYCLIC.
  admissionPolicyIdentity:
    domain: blue-contracts-admission-policy/1.0
    value:
      type: object
      fields: [label]
  exactNodeProviderDomainIdentity:
    domain: blue-contracts-exact-node-provider-domain/1.0
    value:
      type: object
      fields: [label]
  externalOrderPolicyIdentity:
    domain: blue-contracts-external-order-policy/1.0
    value:
      type: object
      fields: [label]
  portableLimitPolicyIdentity:
    domain: blue-contracts-portable-limit-policy/1.0
    value:
      type: object
      fields: [label, limits]
      fieldRules:
        limits: Array of objects with fields name and value, sorted by name. Every value is a non-negative safe integer.
  admissionCauseIdentity:
    domain: blue-contracts-admission-cause/1.0
    value:
      type: object
      fields: [admissionKind, label, triggeringEventBlueId, parentTransitionIdentity, policyIdentity]
      fieldRules:
        admissionKind: One of TOP_LEVEL_ADMISSION, EMBEDDED_ACTIVATION or IMPORTED_STATE_ADMISSION.
        triggeringEventBlueId: Exact triggering event BlueId when present; otherwise JSON null.
        parentTransitionIdentity: Exact parent transition identity when present; otherwise JSON null.
  admissionCandidateIdentity:
    domain: blue-contracts-admission-candidate/1.0
    value:
      type: object
      fields: [kind, evidence]
      fieldRules:
        kind: One of BAD_CYCLIC_PROOF, AMBIGUOUS_PRELIMINARY_MEMBERS or INVALID_OCCURRENCE_BINDING.
        evidence: 'Closed union selected by kind: {candidateCyclicProof}; {candidateCyclicMembers}; or {candidateOccurrenceBindings}. A branch contains no field belonging to another branch.'
        candidateCyclicProof: The complete exact candidate cyclic-proof Blue value supplied to admission verification.
        candidateCyclicMembers: Array of objects with fields documentId and document, sorted by documentId.
        candidateOccurrenceBindings: Array of strict verifier-probe objects with exactly occurrenceIdentity, bindingIdentity, sourceDocumentId, sourcePath, targetDocumentId, expectedTargetBlueId, activationGeneration, active and bindingPolicyIdentity, sorted by occurrenceIdentity and then bindingIdentity. pendingHistoricalEpoch and every other authoritative-row-only field are prohibited.
  externalCauseIdentity:
    domain: blue-contracts-external-cause/1.0
    value:
      type: object
      fields: [eventBlueId, sourceOrder, externalOrderPolicyIdentity]
      fieldRules:
        sourceOrder: The already-normalized canonical external-order tuple; tuple order is preserved.
  executionPolicyIdentity:
    domain: blue-contracts-execution-policy/1.0
    value:
      type: object
      fields: [sharedLimit, localLimits, label]
      fieldRules:
        localLimits: Array of objects with fields documentId and limit, sorted by documentId; never a dynamic JSON object.
  directDeliveryIdentity:
    domain: blue-contracts-direct-delivery/1.0
    value:
      type: object
      fields: [targetDocumentId, scopePath, activationGeneration, channelKey, logicalDeliveryKey, rawOccurrenceOrder]
  directDeliverySnapshotIdentity:
    domain: blue-contracts-direct-delivery-snapshot/1.0
    value:
      type: array
      items: Exact directDeliveryIdentity strings, not repeated delivery objects.
      order: rawOccurrenceOrder, targetDocumentId, scopePath, activationGeneration, channelKey, logicalDeliveryKey
  occurrenceBindingSetIdentity:
    domain: blue-contracts-occurrence-binding-set/1.0
    value:
      type: array
      items:
        fields: [occurrenceIdentity, bindingIdentity, active, pendingHistoricalEpoch]
        fieldRules:
          pendingHistoricalEpoch: Exact admitted historical epoch still being caught up when applicable; otherwise JSON null.
      order: occurrenceIdentity, bindingIdentity
  closureIdentity:
    domain: blue-contracts-affected-closure/1.0
    stability: Identity of authoritative closure state only. Cause and direct-delivery evidence are invocation inputs and are bound by invocationIdentity.
    value:
      type: object
      fields:
      - graphGeneration
      - documents
      - occurrenceBindingSetIdentity
      - components
      - publicRootDocumentIds
      fieldRules:
        documents: Array of objects with fields documentId, blueId, initialized, terminated, publicRoot, epoch, componentGeneration; sorted by documentId.
        components: Component state identities sorted lexicographically as lowercase identity text.
        publicRootDocumentIds: DocumentIds sorted by Unicode scalar-value sequence.
  invocationIdentity:
    domain: blue-contracts-invocation/1.0
    value:
      type: object
      fields:
      - operation
      - causeIdentity
      - admissionCandidateIdentity
      - inputGraphGeneration
      - inputClosureIdentity
      - documents
      - directDeliverySnapshotIdentity
      - occurrenceBindingSetIdentity
      - runtimeRegistryIdentity
      - gasPolicyIdentity
      - cyclicFinalizerIdentity
      - cyclicProofVerifierIdentity
      - blueLanguageSpecificationIdentity
      - contractsSpecificationIdentity
      - managedDocumentIdentityPolicyIdentity
      - managedBindingPolicyIdentity
      - exactNodeProviderDomainIdentity
      - externalOrderPolicyIdentity
      - gasManifestIdentity
      - portableLimitPolicyIdentity
      fieldRules:
        operation: Exact literal process-closure or admit-closure.
        admissionCandidateIdentity: Exact admissionCandidateIdentity when admission-candidate evidence is present; otherwise JSON null. The field is always encoded.
        documents: Array of objects with fields documentId, blueId, initialized, terminated, publicRoot, epoch and componentGeneration, sorted by DocumentId.
        blueLanguageSpecificationIdentity: SHA-256 of the exact Blue Language specification bytes, represented as sha256:<64 lowercase hexadecimal digits>.
        contractsSpecificationIdentity: SHA-256 of the exact Blue Contracts specification bytes, represented as sha256:<64 lowercase hexadecimal digits>.
        gasManifestIdentity: SHA-256 of the exact normative gas-manifest bytes, represented as sha256:<64 lowercase hexadecimal digits>.
  transitionOccurrenceIdentity:
    domain: blue-contracts-transition-occurrence/1.0
    value:
      type: object
      fields: [invocationIdentity, transitionOrdinal, targetDocumentId, beforeBlueId, causingWorkOccurrenceIdentity]
  eventOccurrenceIdentity:
    domain: blue-contracts-event-occurrence/1.0
    value:
      type: object
      fields: [invocationIdentity, eventOccurrenceOrdinal, eventBlueId]
      fieldRules:
        eventOccurrenceOrdinal: Zero-based invocation-global ordinal allocated in canonical Handler-result emission order; all deliveries of one emitted event reuse it.
  workOccurrenceIdentity:
    domain: blue-contracts-work-occurrence/1.0
    value:
      type: object
      fields:
      - invocationIdentity
      - workOrdinal
      - workKind
      - targetManagedScopeIdentity
      - sourceOccurrenceIdentity
  historicalTransitionIdentity:
    domain: blue-contracts-historical-transition/1.0
    value:
      type: object
      fields: [documentId, fromEpoch, toEpoch, beforeBlueId, afterBlueId]
  channelOccurrenceIdentity:
    domain: blue-contracts-channel-occurrence/1.0
    value:
      type: object
      fields: [managedDocumentId, scopePath, scopeActivationGeneration, rawChannelKey, effectiveRuntimeContributionBlueId, subscriptionHeaderBlueId]
  checkpointDomainBlueId:
    algorithm: Blue Language 1.0 direct BlueId calculation over the exact value object; this constructor does not use the SHA-256 envelope defined above.
    representation: Exact canonical direct BlueId text.
    value:
      type: object
      requiredFields: [contractsVersion, effectiveTypeBlueId, sourceContributionNodeBlueIds]
      optionalFields: [deterministicDependencyNodeBlueIds, runtimeDiscriminator]
      fieldRules:
        contractsVersion: The exact text value '1.0'.
        effectiveTypeBlueId: Exact effective Channel type BlueId.
        sourceContributionNodeBlueIds: Ordered array of exact source-contribution BlueIds; an empty array is encoded when there are none.
        deterministicDependencyNodeBlueIds: Ordered array of exact deterministic same-scope dependency BlueIds; the field is omitted when the array is empty.
        runtimeDiscriminator: Non-empty runtime implementation discriminator text; the field is omitted when absent or empty.
        fieldPresenceOverride: The two optional fields are the sole exception in this registry to algorithm.absentValues; their omission is part of the exact Blue value.
        objectIdentity: The returned checkpointDomainBlueId is the direct BlueId of this exact Blue object. It is not a sha256 identity and does not hash a reference-expanded value.
  subscriptionIdentity:
    domain: blue-contracts-subscription/1.0
    value:
      type: object
      fields: [channelOccurrenceIdentity, documentBlueId, graphGeneration, componentGeneration]
      fieldRules:
        channelOccurrenceIdentity: Exact identity whose subscriptionHeaderBlueId already binds the declared dependency surface.
  graphChangesIdentity:
    domain: blue-contracts-graph-changes/1.0
    value:
      type: array
      order: graphChangeOrdinal ascending without gaps
      items:
        fields: [graphChangeOrdinal, changeKind, sourceDocumentId, sourcePath, beforeActivationGeneration, beforeOccurrenceIdentity, beforeBindingIdentity, beforeTargetDocumentId, beforeTargetBlueId, afterActivationGeneration, afterOccurrenceIdentity, afterBindingIdentity, afterTargetDocumentId, afterTargetBlueId]
        fieldRules:
          changeKind: One of ADD, REMOVE, RETARGET or REBIND.
          beforeActivationGeneration: Exact value before the change; JSON null when the before side is absent.
          beforeOccurrenceIdentity: Exact value before the change; JSON null when the before side is absent.
          beforeBindingIdentity: Exact value before the change; JSON null when the before side is absent.
          beforeTargetDocumentId: Exact value before the change; JSON null when the before side is absent.
          beforeTargetBlueId: Exact value before the change; JSON null when the before side is absent.
          afterActivationGeneration: Exact value after the change; JSON null when the after side is absent.
          afterOccurrenceIdentity: Exact value after the change; JSON null when the after side is absent.
          afterBindingIdentity: Exact value after the change; JSON null when the after side is absent.
          afterTargetDocumentId: Exact value after the change; JSON null when the after side is absent.
          afterTargetBlueId: Exact value after the change; JSON null when the after side is absent.
  checkpointWritesIdentity:
    domain: blue-contracts-checkpoint-writes/1.0
    value:
      type: array
      order: checkpointWriteOrdinal ascending without gaps
      items:
        fields: [checkpointWriteOrdinal, targetManagedScopeIdentity, rawChannelKey, beforePresent, beforeDomainBlueId, beforeDomainValue, beforeSubjectBlueId, afterPresent, afterDomainBlueId, afterDomainValue, afterSubjectBlueId]
        fieldRules:
          beforeDomainBlueId: Exact value when beforePresent is true; otherwise JSON null.
          beforeDomainValue: Exact checkpoint-domain Blue value whose independently recomputed direct BlueId equals beforeDomainBlueId when beforePresent is true; otherwise JSON null.
          beforeSubjectBlueId: Exact value when beforePresent is true; otherwise JSON null.
          afterDomainBlueId: Exact value when afterPresent is true; otherwise JSON null.
          afterDomainValue: Exact checkpoint-domain Blue value whose independently recomputed direct BlueId equals afterDomainBlueId when afterPresent is true; otherwise JSON null.
          afterSubjectBlueId: Exact value when afterPresent is true; otherwise JSON null.
  subscriptionDeltasIdentity:
    domain: blue-contracts-subscription-deltas/1.0
    value:
      type: array
      order: subscriptionDeltaOrdinal ascending without gaps
      items:
        fields: [subscriptionDeltaOrdinal, operation, targetManagedScopeIdentity, channelOccurrenceIdentity, beforeSubscriptionIdentity, afterSubscriptionIdentity, beforeDocumentBlueId, afterDocumentBlueId, beforeGraphGeneration, afterGraphGeneration, beforeComponentGeneration, afterComponentGeneration]
        fieldRules:
          beforeSubscriptionIdentity: Exact value before the delta; JSON null when the before side is absent.
          afterSubscriptionIdentity: Exact value after the delta; JSON null when the after side is absent.
          beforeDocumentBlueId: Exact value before the delta; JSON null when the before side is absent.
          afterDocumentBlueId: Exact value after the delta; JSON null when the after side is absent.
          beforeGraphGeneration: Exact value before the delta; JSON null when the before side is absent.
          afterGraphGeneration: Exact value after the delta; JSON null when the after side is absent.
          beforeComponentGeneration: Exact value before the delta; JSON null when the before side is absent.
          afterComponentGeneration: Exact value after the delta; JSON null when the after side is absent.
  publicEventsIdentity:
    domain: blue-contracts-public-events/1.0
    value:
      type: array
      order: publicEventOrdinal ascending without gaps
      items:
        fields: [publicEventOrdinal, publicRootDocumentId, eventOccurrenceIdentity, eventBlueId]
  rejectedChargeIdentity:
    domain: blue-contracts-rejected-charge/1.0
    value:
      type: object
      fields: [namespace, counter, quantity, weight, subtotal, applicableCap, remainingBeforeCharge, owner]
      fieldRules:
        applicableCap: 'Closed union: an object with only kind = SHARED, or an object with kind = LOCAL and documentId = the exact NFC-normalized DocumentId owning the lower cap.'
        owner: 'Closed union: {kind: INVOCATION}; {kind: WORK, workOccurrenceIdentity}; or {kind: FINALIZATION, finalizationOrdinal, componentIdentity, componentGeneration}. A branch contains no fields belonging to another branch. finalizationOrdinal is the exact invocation-global tentative-finalization ordinal.'
  gasTraceIdentity:
    domain: blue-contracts-gas-trace/1.0
    value:
      type: array
      items: Complete admitted gas-trace entries in sequence order, including only semantically applicable optional context fields.
  platformCommitCompanionIdentity:
    domain: blue-contracts-platform-commit-companion/1.0
    value:
      type: object
      fields:
      - invocationIdentity
      - inputClosureIdentity
      - outputClosureIdentity
      - expectedInputGraphGeneration
      - expectedInputDocuments
      - expectedInputComponents
      - inputOccurrenceBindingSetIdentity
      - outputGraphGeneration
      - resultingDocuments
      - resultingComponents
      - occurrenceBindingSetIdentity
      - graphChangesIdentity
      - checkpointWritesIdentity
      - subscriptionDeltasIdentity
      - publicEventsIdentity
      - gasTraceIdentity
      - blueLanguageSpecificationIdentity
      - contractsSpecificationIdentity
      - managedDocumentIdentityPolicyIdentity
      - managedBindingPolicyIdentity
      - exactNodeProviderDomainIdentity
      - externalOrderPolicyIdentity
      - runtimeRegistryIdentity
      - gasManifestIdentity
      - portableLimitPolicyIdentity
      - cyclicFinalizerIdentity
      - cyclicProofVerifierIdentity
      fieldRules:
        expectedInputDocuments: Array of objects with fields documentId and blueId, sorted by documentId.
        expectedInputComponents: Array of objects with fields componentIdentity, componentStateIdentity, componentGeneration and masterBlueId, in canonical condensation order. masterBlueId is JSON null for ACYCLIC.
        resultingDocuments: Array of objects with fields documentId, beforeBlueId and afterBlueId, sorted by documentId.
        resultingComponents: Array of objects with fields componentIdentity, componentStateIdentity and cyclicProofIdentity, in canonical condensation order. cyclicProofIdentity is JSON null for ACYCLIC.
        blueLanguageSpecificationIdentity: SHA-256 of the exact Blue Language specification bytes, represented as sha256:<64 lowercase hexadecimal digits>.
        contractsSpecificationIdentity: SHA-256 of the exact Blue Contracts specification bytes, represented as sha256:<64 lowercase hexadecimal digits>.
        gasManifestIdentity: SHA-256 of the exact normative gas-manifest bytes, represented as sha256:<64 lowercase hexadecimal digits>.
compatibility:
  languageIdentityAlgorithmsChanged: false
  note: Except for the explicitly marked checkpointDomainBlueId exact-value recipe, these constructors are Contracts platform-evidence identities. The checkpoint recipe invokes the unchanged Blue Language direct-BlueId algorithm; nothing here alters that algorithm or cyclic MASTER#index syntax.
