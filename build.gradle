    reports {
        junitXml.required = true
        junitXml.outputLocation = fragmentedProcessingTestResults
        html.required = true
    }
    filter {
        includeTestsMatching 'blue.language.provider.ExactNodeGraphFragmentsTest'
        includeTestsMatching 'blue.language.utils.NodeProviderWrapperCompatibilityTest'
        includeTestsMatching 'blue.language.processor.ProcessingInputAdmissionTest'
        includeTestsMatching 'blue.language.processor.DeepGraphPhysicalLocalityIntegrationTest'
        includeTestsMatching 'blue.language.processor.FragmentedProcessingLocalityIntegrationTest'
        includeTestsMatching 'blue.language.processor.FragmentedProcessingFailureMatrixTest'
        includeTestsMatching 'blue.language.processor.LogicalDeliveryRoutingTest'
        includeTestsMatching 'blue.language.processor.*LogicalDelivery*'
        includeTestsMatching 'blue.language.processor.*LogicalChannel*'
        includeTestsMatching 'blue.language.processor.*RoutedChannel*'
        includeTestsMatching 'blue.language.processor.*Routing*'
        includeTestsMatching 'blue.language.processor.ExternalChannelPatternMatchingTest'
        includeTestsMatching 'blue.language.processor.ExternalChannelDependencyContextTest'
        includeTestsMatching 'blue.language.processor.ExternalChannelCatalogContextTest'
        includeTestsMatching 'blue.language.processor.EffectiveFragmentationCatalogTest'
        includeTestsMatching 'blue.language.processor.ImmutablePatchPlannerTest'
        includeTestsMatching 'blue.language.processor.DocumentProcessingRuntimeBatchPatchTest'
        includeTestsMatching 'blue.language.processor.PreparedPatchSequenceTest'
        includeTestsMatching 'blue.language.processor.ProcessorPhasePrecedenceTest'
        includeTestsMatching 'blue.language.processor.CyclicProcessingBoundaryTest'
        includeTestsMatching 'blue.language.CyclicProviderFallbackTest'
        includeTestsMatching 'blue.language.RecursiveTypeResolutionTest'
    }
}

tasks.register('fragmentedProcessingReport') {
    group = 'verification'
    description = 'Emits deterministic fragmented-processing verification evidence.'
    dependsOn tasks.named('fragmentedProcessingTest')
    dependsOn tasks.named('releaseConformanceTest')
    dependsOn tasks.named('jar')
    dependsOn 'sourceReleaseArchive'
    inputs.dir(fragmentedProcessingTestResults)
    inputs.file(releaseConformanceJson)
    inputs.file(fragmentedProcessingJar)
    inputs.file(fragmentedProcessingSourceRelease)
    inputs.property('sourceCommit', fragmentedProcessingSourceCommit)
    outputs.file(fragmentedProcessingJson)

    doLast {
        def xmlFiles = fileTree(fragmentedProcessingTestResults.get().asFile) {
            include 'TEST-*.xml'
        }.files.sort { left, right -> left.name <=> right.name }
        if (xmlFiles.isEmpty()) {
            throw new GradleException(
                    'fragmentedProcessingTest produced no JUnit XML test suites')
        }

        def documentBuilderFactory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        documentBuilderFactory.setFeature(
                'http://apache.org/xml/features/disallow-doctype-decl', true)
        documentBuilderFactory.setFeature(
                'http://xml.org/sax/features/external-general-entities', false)
        documentBuilderFactory.setFeature(
                'http://xml.org/sax/features/external-parameter-entities', false)
        documentBuilderFactory.setXIncludeAware(false)
        documentBuilderFactory.setExpandEntityReferences(false)

        def focusedSuitesByName = new TreeMap<String, Map<String, Object>>()
        xmlFiles.each { xmlFile ->
            def suite = documentBuilderFactory.newDocumentBuilder().parse(xmlFile)
                    .documentElement
            def suiteName = suite.getAttribute('name')
            if (suiteName == null || suiteName.trim().isEmpty()) {
                suiteName = xmlFile.name
            }
            int tests = Integer.parseInt(suite.getAttribute('tests') ?: '0')
            int failures = Integer.parseInt(suite.getAttribute('failures') ?: '0')
            int errors = Integer.parseInt(suite.getAttribute('errors') ?: '0')
            int skipped = Integer.parseInt(suite.getAttribute('skipped') ?: '0')
            int failed = failures + errors
            int passed = tests - failed - skipped
            if (passed < 0) {
                throw new GradleException(
                        "Invalid JUnit counts in ${xmlFile}: tests=${tests}, "
                                + "failed=${failed}, skipped=${skipped}")
            }
            def prior = focusedSuitesByName.get(suiteName)
            if (prior == null) {
                prior = [
                        name   : suiteName,
                        tests  : 0,
                        passed : 0,
                        failed : 0,
                        skipped: 0
                ]
                focusedSuitesByName.put(suiteName, prior)
            }
            prior.tests += tests
            prior.passed += passed
            prior.failed += failed
            prior.skipped += skipped
        }

        def focusedSuites = focusedSuitesByName.values().findAll {
            it.tests > 0
        }.collect { new LinkedHashMap<String, Object>(it) }
        if (focusedSuites.isEmpty()) {
            throw new GradleException(
                    'fragmentedProcessingTest executed no focused tests')
        }
        int focusedTests = focusedSuites.sum { it.tests } as int
        int focusedPassed = focusedSuites.sum { it.passed } as int
        int focusedFailed = focusedSuites.sum { it.failed } as int
        int focusedSkipped = focusedSuites.sum { it.skipped } as int

        def releaseReport = new groovy.json.JsonSlurper()
                .parse(releaseConformanceJson.get().asFile)
        def requiredPackageKeys = [
                'languageRegistry',
                'languageFixtures',
                'contractsRegistry',
                'contractsGas',
                'contractsFixtures'
        ]
        if (releaseReport.release == null
                || !(releaseReport.release.packageIdentity instanceof String)
                || !releaseReport.release.packageIdentity.startsWith('sha256:')
                || releaseReport.packages == null
                || !requiredPackageKeys.every {
                    releaseReport.packages[it] instanceof String
                            && releaseReport.packages[it].startsWith('sha256:')
                }) {
            throw new GradleException(
                    'release-conformance.json is missing exact release/package identities')
        }

        def releaseSuiteNames = releaseReport.fixtures.collect {
            it.suite.toString()
        }.toSet().sort().collect {
            "release-conformance:${it}".toString()
        }
        int releaseTests = releaseReport.summary.total as int
        int releasePassed = releaseReport.summary.passed as int
        int releaseFailed = releaseReport.summary.failed as int
        int releaseSkipped = releaseReport.summary.skipped as int
        boolean focusedConformant = focusedFailed == 0 && focusedSkipped == 0
        boolean releaseConformant = releaseReport.summary.conformant == true
        boolean conformant = focusedConformant && releaseConformant

        def sourceCommit = fragmentedProcessingSourceCommit.get()
        if (!(sourceCommit ==~ /(?:[0-9a-f]{40}|[0-9a-f]{64})/)) {
            throw new GradleException(
                    "Git returned an invalid source commit identity: '${sourceCommit}'")
        }
        def sha256Identity = { artifact ->
            if (!artifact.isFile()) {
                throw new GradleException(
                        "Required report artifact does not exist: ${artifact}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            'sha256:' + digest.digest().collect {
                String.format('%02x', ((byte) it) & 0xff)
            }.join()
        }
        def jarArtifact = fragmentedProcessingJar.get().asFile
        def sourceReleaseArtifact = fragmentedProcessingSourceRelease.get().asFile

        def report = [
                schema              : 'blue-language-java-fragmented-processing-report/1.1',
                version             : '1.1',
                source              : [
                        commit: sourceCommit
                ],
                release             : [
                        name           : releaseReport.release.name,
                        packageIdentity: releaseReport.release.packageIdentity
                ],
                packages            : [
                        languageRegistry : releaseReport.packages.languageRegistry,
                        languageFixtures : releaseReport.packages.languageFixtures,
                        contractsRegistry: releaseReport.packages.contractsRegistry,
                        contractsGas     : releaseReport.packages.contractsGas,
                        contractsFixtures: releaseReport.packages.contractsFixtures
                ],
                artifacts           : [
                        jar          : [
                                name    : jarArtifact.name,
                                identity: sha256Identity(jarArtifact)
                        ],
                        sourceRelease: [
                                name    : sourceReleaseArtifact.name,
                                identity: sha256Identity(sourceReleaseArtifact)
                        ]
                ],
                summary             : [
                        suiteCount: focusedSuites.size() + releaseSuiteNames.size(),
                        tests     : focusedTests + releaseTests,
                        passed    : focusedPassed + releasePassed,
                        failed    : focusedFailed + releaseFailed,
                        skipped   : focusedSkipped + releaseSkipped,
                        conformant: conformant
                ],
                focusedVerification : [
                        suiteCount   : focusedSuites.size(),
                        tests        : focusedTests,
                        passed       : focusedPassed,
                        failed       : focusedFailed,
                        skipped      : focusedSkipped,
                        conformant   : focusedConformant,
                        executedSuites: focusedSuites.collect { it.name },
                        suites       : focusedSuites
                ],
                releaseConformance  : [
                        schema        : releaseReport.schema,
                        suiteCount    : releaseSuiteNames.size(),
                        tests         : releaseTests,
                        passed        : releasePassed,
                        failed        : releaseFailed,
                        skipped       : releaseSkipped,
                        conformant    : releaseConformant,
                        executedSuites: releaseSuiteNames
                ],
                executedSuites      : focusedSuites.collect { it.name }
                        + releaseSuiteNames,
                demandVocabulary    : [
                        semanticDemands: [
                                category: 'logical-consensus',
                                portable: true,
                                meaning : 'Exact semantic identities demanded by processing.'
                        ],
                        logicalGasTrace: [
                                category: 'logical-consensus',
                                portable: true,
                                meaning : 'Deterministic gas-counter sequence for semantic work.'
                        ],
                        providerCalls  : [
                                category: 'physical-observation',
                                portable: false,
                                meaning : 'Runtime provider acquisition calls; never a gas input.'
                        ],
                        providerBytes  : [
                                category: 'physical-observation',
                                portable: false,
                                meaning : 'Runtime provider bytes transferred; never a gas input.'
                        ],
                        invarianceContract:
                                'Equivalent representations preserve semanticDemands '
                                        + 'and logicalGasTrace; providerCalls and providerBytes '
                                        + 'may vary with cache and provider segmentation.'
                ]
        ]

        def output = fragmentedProcessingJson.get().asFile
        output.parentFile.mkdirs()
        output.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(report)) + '\n',
                'UTF-8')
        if (!conformant) {
            throw new GradleException(
                    'Fragmented-processing verification is not conformant; see '
                            + output)
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyNoDeprecatedProductionApi')
    dependsOn tasks.named('verifyNoAmbiguousReverseApi')
    dependsOn tasks.named('verifyFinalApiBaseline')
}

jmh {
    includeTests = true
    jmhVersion = '1.37'
    warmupIterations = 3
    warmup = '1s'
    iterations = 5
    timeOnIteration = '1s'
    fork = 2
    profilers = ['gc']
    resultFormat = 'JSON'
    resultsFile = file("$buildDir/reports/jmh/processor-process-event-context.json")
}

ext.genResourcesDir = file("$buildDir/generated-resources")
def sourceDateEpoch = providers.environmentVariable('SOURCE_DATE_EPOCH')
task generateBuildProperties {
    ext.buildPropertiesFile = file("$genResourcesDir/blue/language/build.properties")
    inputs.property('buildVersion', project.version.toString())
    inputs.property('sourceDateEpoch', sourceDateEpoch.orNull ?: '')
    outputs.file(buildPropertiesFile)
    doLast {
        def epoch = sourceDateEpoch.orNull
        def buildInstant
        if (epoch != null && !epoch.trim().isEmpty()) {
            try {
                buildInstant = java.time.Instant.ofEpochSecond(Long.parseLong(epoch.trim()))
            } catch (NumberFormatException exception) {
                throw new GradleException("SOURCE_DATE_EPOCH must be a Unix epoch second", exception)
            }
        } else {
            buildInstant = java.time.Instant.now()
        }
        def buildTimestamp = java.time.format.DateTimeFormatter
                .ofPattern("yyyy-MM-dd'T'HH:mm:ssZ")
                .withZone(java.time.ZoneOffset.UTC)
                .format(buildInstant)
        buildPropertiesFile.text = """\
                |blue-language-java.build.version=$project.version
                |blue-language-java.build.timestamp=${buildTimestamp}
        """.stripMargin().trim()
    }
}
sourceSets.main.output.dir genResourcesDir, builtBy: generateBuildProperties


tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

def sourceReleaseMetadataDir = layout.buildDirectory.dir('generated/source-release-metadata')
def sourceReleaseChecksumFile = layout.buildDirectory.file(
        "release/blue-language-java-${project.version}-source-release.zip.sha256")
tasks.register('generateSourceReleaseMetadata') {
    inputs.file('.cz.toml')
    inputs.property('releaseVersion', project.version.toString())
    outputs.file(sourceReleaseMetadataDir.map { it.file('.cz.toml') })
    doLast {
        def output = sourceReleaseMetadataDir.get().file('.cz.toml').asFile
        output.parentFile.mkdirs()
        output.text = file('.cz.toml').getText('UTF-8').replaceFirst(
                /(?m)^version\s*=\s*"[^"]+"/,
                "version = \"${project.version}\"")
    }
}

tasks.register('sourceReleaseArchive', Zip) {
    group = 'distribution'
    description = 'Creates a reproducible, metadata-free source archive for public release review.'
    archiveBaseName = 'blue-language-java'
    archiveVersion = project.version
    archiveClassifier = 'source-release'
    destinationDirectory = layout.buildDirectory.dir('release')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dependsOn tasks.named('generateSourceReleaseMetadata')
    outputs.file(sourceReleaseChecksumFile)
    eachFile { details ->
        details.permissions { permissions ->
            permissions.unix(details.path.endsWith('/gradlew') || details.path.endsWith('.sh')
                    ? 0755
                    : 0644)
        }
    }

    into("blue-language-java-${project.version}") {
        from(rootDir) {
            include 'CHANGELOG.md'
            include 'LICENSE*'
            include 'README*'
            include 'build.gradle'
            include 'settings.gradle*'
            include 'gradle.properties'
            include 'gradlew'
            include 'gradlew.bat'
            include 'gradle/**'
            include 'api/**'
            include '.github/**'
            include 'docs/**'
            include 'src/**'
            include 'tools/**'

            exclude '**/.DS_Store'
            exclude '**/._*'
            exclude '**/*.jfr'
            exclude '**/*.hprof'
            exclude '**/*.heapdump'
            exclude '**/*.db'
            exclude '**/*.sqlite*'
            exclude '**/node_modules/**'
            exclude '**/__pycache__/**'
            exclude '**/*.pyc'
            exclude '**/*.pyo'
            exclude '**/.gradle/**'
            exclude '**/build/**'
            exclude '**/*.zip'
            exclude '**/*.tar'
            exclude '**/*.tar.gz'
            exclude '**/*.tgz'
        }
        from(sourceReleaseMetadataDir) {
            include '.cz.toml'
        }
    }

    doLast {
        def archive = archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = digest.digest().collect {
            String.format('%02x', ((byte) it) & 0xff)
        }.join()
        def checksum = sourceReleaseChecksumFile.get().asFile
        checksum.parentFile.mkdirs()
        checksum.setText("${hash}  ${archive.name}\n", 'UTF-8')
    }
}

def sourceReleaseArchiveTask = tasks.named('sourceReleaseArchive', Zip)
tasks.register('verifySourceReleaseArchive') {
    group = 'verification'
    description = 'Checks the source release archive for required files and local-only debris.'
    dependsOn sourceReleaseArchiveTask
    inputs.file(sourceReleaseArchiveTask.flatMap { it.archiveFile })
    doLast {
        def archive = sourceReleaseArchiveTask.get().archiveFile.get().asFile
        def names = []
        archive.withInputStream { input ->
            def zip = new java.util.zip.ZipInputStream(input)
            try {
                def entry = zip.getNextEntry()
                while (entry != null) {
                    names.add(entry.name)
                    zip.closeEntry()
                    entry = zip.getNextEntry()
                }
            } finally {
                zip.close()
            }
        }
        def forbidden = names.findAll { name ->
            name.contains('__MACOSX/')
                    || name.endsWith('/.DS_Store')
                    || name.contains('/._')
                    || name.contains('/__pycache__/')
                    || name.endsWith('.pyc')
                    || name.endsWith('.pyo')
                    || name.contains('/build/')
                    || name.contains('/docs/performance/')
                    || name.endsWith('/Archive.zip')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Source release archive contains forbidden entries: "
                    + forbidden.take(20))
        }
        def root = "blue-language-java-${project.version}/".toString()
        def required = [
                root + '.cz.toml',
                root + 'api/blue-language-java-1.0.json',
                root + 'build.gradle',
                root + 'settings.gradle.kts',
                root + 'README.md',
                root + 'src/main/java/blue/language/Blue.java'
        ]
        def missing = required.findAll { requiredName -> !names.contains(requiredName) }
        if (!missing.isEmpty()) {
            throw new GradleException("Source release archive is missing required entries: "
                    + missing)
        }
    }
}

