plugins {
    id 'base'
    id 'blue.root-orchestration'
    id 'org.jreleaser' version '1.24.0'
}

group = 'blue.language'
version = providers.gradleProperty('releaseVersion').orElse(
        providers.fileContents(layout.projectDirectory.file('.cz.toml')).asText.map { text ->
            def match = text =~ /(?m)^version\s*=\s*"([^"]+)"\s*$/
            if (!match.find()) {
                throw new GradleException('tool.commitizen.version is missing from .cz.toml')
            }
            match.group(1) + (System.getenv('CI') ? '' : '-SNAPSHOT')
        }).get()

subprojects {
    group = rootProject.group
    version = rootProject.version
}

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }
    project {
        description = 'Java client library for Blue Language'
        copyright = '© 2024 Blue Company. Licensed under the MIT License'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    applyMavenCentralRules = true
                    snapshotSupported = true
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }
}
