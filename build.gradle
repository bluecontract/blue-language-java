def jarRepeatabilityJson = layout.buildDirectory.file(
        'reports/reproducibility/jar-repeatability.json')
def sourceArchiveRepeatabilityJson = layout.buildDirectory.file(
        'reports/reproducibility/source-archive-repeatability.json')
tasks.register('verifyDeterministicJar') {
    group = 'verification'
    description = 'Assembles the production JAR twice and requires byte-for-byte identical output.'
    dependsOn primaryJarTask
    dependsOn repeatabilityJarTask
    inputs.file(primaryJarTask.flatMap { it.archiveFile })
    inputs.file(repeatabilityJarTask.flatMap { it.archiveFile })
    inputs.property('buildVersion', project.version.toString())
    inputs.property('sourceDateEpoch', effectiveSourceDateEpoch)
    inputs.property('sourceDateEpochOrigin', sourceDateEpochOrigin)
    outputs.file(jarRepeatabilityJson)

    doLast {
        def primaryTask = primaryJarTask.get()
        def replicaTask = repeatabilityJarTask.get()
        if (primaryTask.preserveFileTimestamps
                || replicaTask.preserveFileTimestamps
                || !primaryTask.reproducibleFileOrder
                || !replicaTask.reproducibleFileOrder) {
            throw new GradleException(
                    'JAR tasks must disable file timestamps and use reproducible file order')
        }

        def archiveEvidence = { File archive ->
            def names = []
            def timestamps = []
            String buildProperties = null
            def zip = new java.util.zip.ZipFile(archive)
            try {
                def entries = zip.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    names.add(entry.name)
                    timestamps.add(entry.time)
                    if (entry.name == 'blue/language/build.properties') {
                        buildProperties = new String(
                                zip.getInputStream(entry).bytes,
                                java.nio.charset.StandardCharsets.UTF_8)
                    }
                }
            } finally {
                zip.close()
            }
            [
                    entryNames     : names,
                    entryCount     : names.size(),
                    entryTimestamps: timestamps.toSet().sort(),
                    buildProperties: buildProperties
            ]
        }

        def primaryArtifact = primaryTask.archiveFile.get().asFile
        def replicaArtifact = replicaTask.archiveFile.get().asFile
        def primaryIdentity = sha256IdentityOf(primaryArtifact)
        def replicaIdentity = sha256IdentityOf(replicaArtifact)
        def primaryEvidence = archiveEvidence(primaryArtifact)
        def replicaEvidence = archiveEvidence(replicaArtifact)
        def expectedTimestamp = formatBuildTimestamp(
                parseSourceDateEpoch(effectiveSourceDateEpoch.get()))
        def expectedBuildProperties = """\
                |blue-language-java.build.version=${project.version}
                |blue-language-java.build.timestamp=${expectedTimestamp}
        """.stripMargin().trim()

        if (primaryEvidence.buildProperties == null
                || primaryEvidence.buildProperties != expectedBuildProperties) {
            throw new GradleException(
                    'Production JAR build.properties is missing or does not match '
                            + 'the effective SOURCE_DATE_EPOCH')
        }
        if (replicaEvidence.buildProperties != expectedBuildProperties) {
            throw new GradleException(
                    'Repeatability JAR build.properties does not match the production JAR')
        }
        if (primaryEvidence.entryNames != replicaEvidence.entryNames
                || primaryIdentity != replicaIdentity) {
            throw new GradleException(
                    "Production JAR is not repeatable: ${primaryIdentity} != "
                            + replicaIdentity)
        }

        def report = [
                schema              : 'blue-language-java-jar-repeatability/1.0',
                repeatable          : true,
                archiveConfiguration: [
                        preserveFileTimestamps: false,
                        reproducibleFileOrder : true
                ],
                buildProperties     : [
                        sourceDateEpoch      : effectiveSourceDateEpoch.get(),
                        sourceDateEpochOrigin: sourceDateEpochOrigin.get(),
                        timestamp            : expectedTimestamp
                ],
                primary             : [
                        name                       : primaryArtifact.name,
                        identity                   : primaryIdentity,
                        entryCount                 : primaryEvidence.entryCount,
                        entryTimestampsEpochMillis:
                                primaryEvidence.entryTimestamps
                ],
                replica             : [
                        name                       : replicaArtifact.name,
                        identity                   : replicaIdentity,
                        entryCount                 : replicaEvidence.entryCount,
                        entryTimestampsEpochMillis:
                                replicaEvidence.entryTimestamps
                ]
        ]
        def output = jarRepeatabilityJson.get().asFile
        output.parentFile.mkdirs()
        output.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(report)) + '\n',
                'UTF-8')
    }
}

