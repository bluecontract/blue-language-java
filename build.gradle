tasks.register('fragmentedProcessingTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs provider-fragment admission, physical-locality, and logical-delivery coverage.'
    reports {
        junitXml.required = true
        junitXml.outputLocation = fragmentedProcessingTestResults
        html.required = true
    }
    systemProperty 'blue.semantic.locality.evidence.dir',
            semanticLocalityEvidenceDirectory.get().asFile.absolutePath
    outputs.dir(semanticLocalityEvidenceDirectory)
    filter {
        includeTestsMatching 'blue.language.provider.ExactNodeGraphFragmentsTest'
        includeTestsMatching 'blue.language.utils.NodeProviderWrapperCompatibilityTest'
        includeTestsMatching 'blue.language.processor.ProcessingInputAdmissionTest'
        includeTestsMatching 'blue.language.processor.DeepGraphPhysicalLocalityIntegrationTest'
        includeTestsMatching 'blue.language.processor.FragmentedProcessingLocalityIntegrationTest'
        includeTestsMatching 'blue.language.processor.FragmentedProcessingFailureMatrixTest'
        includeTestsMatching 'blue.language.processor.LogicalDeliveryRoutingTest'
        includeTestsMatching 'blue.language.processor.*LogicalDelivery*'
        includeTestsMatching 'blue.language.processor.*LogicalChannel*'
        includeTestsMatching 'blue.language.processor.*RoutedChannel*'
        includeTestsMatching 'blue.language.processor.*Routing*'
        includeTestsMatching 'blue.language.processor.ExternalChannelPatternMatchingTest'
        includeTestsMatching 'blue.language.processor.ExternalChannelDependencyContextTest'
        includeTestsMatching 'blue.language.processor.ExternalChannelCatalogContextTest'
        includeTestsMatching 'blue.language.processor.EffectiveFragmentationCatalogTest'
        includeTestsMatching 'blue.language.processor.ImmutablePatchPlannerTest'
        includeTestsMatching 'blue.language.processor.DocumentProcessingRuntimeBatchPatchTest'
        includeTestsMatching 'blue.language.processor.PreparedPatchSequenceTest'
        includeTestsMatching 'blue.language.processor.ProcessorPhasePrecedenceTest'
        includeTestsMatching 'blue.language.processor.CyclicProcessingBoundaryTest'
        includeTestsMatching 'blue.language.CyclicProviderFallbackTest'
        includeTestsMatching 'blue.language.RecursiveTypeResolutionTest'
    }
}

tasks.register('fragmentedProcessingReport') {
    group = 'verification'
    description = 'Emits machine-readable release, test, API, artifact, and locality evidence.'
    dependsOn tasks.named('fragmentedProcessingTest')
    dependsOn tasks.named('releaseConformanceTest')
    dependsOn tasks.named('runtimeTraceEvidence')
    dependsOn tasks.named('verifyFinalApiBaseline')
    dependsOn tasks.named('verifyDeterministicJar')
    dependsOn tasks.named('verifyDeterministicSourceArchives')
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
    dependsOn tasks.named('jmhClasses')
    dependsOn 'sourceReleaseArchive'
    inputs.dir(allTestResults)
    inputs.dir(fragmentedProcessingTestResults)
    inputs.file(releaseConformanceJson)
    inputs.file(runtimeTraceEvidenceJson)
    inputs.file(fragmentedProcessingJar)
    inputs.file(fragmentedProcessingSourcesJar)
    inputs.file(fragmentedProcessingJavadocJar)
    inputs.file(fragmentedProcessingSourceRelease)
    inputs.file(finalApiBaseline)
    inputs.file(finalApiReport)
    inputs.file(jarRepeatabilityJson)
    inputs.file(sourceArchiveRepeatabilityJson)
    inputs.files(representationEvidenceSources)
    inputs.dir(semanticLocalityEvidenceDirectory)
    inputs.files(releaseEvidenceSourceInputs)
    inputs.file(cleanBuildEvidenceFile).optional()
    inputs.property('sourceCommit', fragmentedProcessingSourceCommit)
    inputs.property('gitStatus', fragmentedProcessingGitStatus)
    inputs.property(
            'commitAutomationDiff',
            fragmentedProcessingCommitAutomationDiff)
    inputs.property(
            'apiBaselineDiff',
            fragmentedProcessingApiBaselineDiff)
    inputs.property('gradleVersion', gradle.gradleVersion)
    inputs.property('buildJavaVersion', System.getProperty('java.version'))
    inputs.property('buildJavaVendor', System.getProperty('java.vendor'))
    inputs.property('buildJvmVersion', System.getProperty('java.vm.version'))
    inputs.property('testJavaRuntimeVersion',
            fragmentedProcessingTestLauncher.map {
                it.metadata.javaRuntimeVersion
            })
    outputs.file(fragmentedProcessingJson)
    outputs.file(finalGenericKernelMarkdown)

    doLast {
        def documentBuilderFactory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        documentBuilderFactory.setFeature(
                'http://apache.org/xml/features/disallow-doctype-decl', true)
        documentBuilderFactory.setFeature(
                'http://xml.org/sax/features/external-general-entities', false)
        documentBuilderFactory.setFeature(
                'http://xml.org/sax/features/external-parameter-entities', false)
        documentBuilderFactory.setXIncludeAware(false)
        documentBuilderFactory.setExpandEntityReferences(false)

        def parseJUnitEvidence = {
            File resultDirectory, String sourceTask, boolean includeTestCases ->
                def xmlFiles = fileTree(resultDirectory) {
                    include 'TEST-*.xml'
                }.files.sort { left, right ->
                    left.name <=> right.name
                }
                if (xmlFiles.isEmpty()) {
                    throw new GradleException(
                            "${sourceTask} produced no JUnit XML test suites")
                }

                def suitesByName = new TreeMap<String, Map<String, Object>>()
                xmlFiles.each { xmlFile ->
                    def suite = documentBuilderFactory.newDocumentBuilder()
                            .parse(xmlFile).documentElement
                    def suiteName = suite.getAttribute('name')
                    if (suiteName == null || suiteName.trim().isEmpty()) {
                        suiteName = xmlFile.name
                    }
                    int tests = Integer.parseInt(
                            suite.getAttribute('tests') ?: '0')
                    int failures = Integer.parseInt(
                            suite.getAttribute('failures') ?: '0')
                    int errors = Integer.parseInt(
                            suite.getAttribute('errors') ?: '0')
                    int skipped = Integer.parseInt(
                            suite.getAttribute('skipped') ?: '0')
                    int failed = failures + errors
                    int passed = tests - failed - skipped
                    if (passed < 0) {
                        throw new GradleException(
                                "Invalid JUnit counts in ${xmlFile}: tests=${tests}, "
                                        + "failed=${failed}, skipped=${skipped}")
                    }
                    def prior = suitesByName.get(suiteName)
                    if (prior == null) {
                        prior = [
                                name   : suiteName,
                                tests  : 0,
                                passed : 0,
                                failed : 0,
                                skipped: 0
                        ]
                        if (includeTestCases) {
                            prior.testCases = []
                        }
                        suitesByName.put(suiteName, prior)
                    }
                    prior.tests += tests
                    prior.passed += passed
                    prior.failed += failed
                    prior.skipped += skipped

                    if (includeTestCases) {
                        def testCases = suite.getElementsByTagName('testcase')
                        for (int index = 0; index < testCases.length; index++) {
                            def testCase = testCases.item(index)
                            def status = testCase
                                    .getElementsByTagName('failure').length > 0
                                    || testCase.getElementsByTagName(
                                    'error').length > 0
                                    ? 'FAILED'
                                    : testCase.getElementsByTagName(
                                    'skipped').length > 0
                                    ? 'SKIPPED'
                                    : 'PASSED'
                            prior.testCases.add([
                                    className: testCase.getAttribute('classname'),
                                    name     : testCase.getAttribute('name'),
                                    status   : status
                            ])
                        }
                    }
                }

                def suites = suitesByName.values().findAll {
                    it.tests > 0
                }.collect {
                    def copy = new LinkedHashMap<String, Object>(it)
                    if (includeTestCases) {
                        copy.testCases = copy.testCases.sort { left, right ->
                            def classOrder = left.className <=> right.className
                            classOrder != 0
                                    ? classOrder
                                    : left.name <=> right.name
                        }
                    }
                    copy
                }
                if (suites.isEmpty()) {
                    throw new GradleException(
                            "${sourceTask} executed no tests")
                }
                int tests = suites.sum { it.tests } as int
                int passed = suites.sum { it.passed } as int
                int failed = suites.sum { it.failed } as int
                int skipped = suites.sum { it.skipped } as int
                [
                        sourceTask    : sourceTask,
                        suiteCount   : suites.size(),
                        tests        : tests,
                        passed       : passed,
                        failed       : failed,
                        skipped      : skipped,
                        conformant   : failed == 0 && skipped == 0,
                        executedSuites: suites.collect { it.name },
                        suites       : suites
                ]
        }

        def allTests = parseJUnitEvidence(
                allTestResults.get().asFile,
                ':test',
                false)
        def focusedVerification = parseJUnitEvidence(
                fragmentedProcessingTestResults.get().asFile,
                ':fragmentedProcessingTest',
                true)

        def releaseReport = new groovy.json.JsonSlurper()
                .parse(releaseConformanceJson.get().asFile)
        def runtimeTraceReport = new groovy.json.JsonSlurper()
                .parse(runtimeTraceEvidenceJson.get().asFile)
        def requiredPackageKeys = [
                'languageRegistry',
                'languageFixtures',
                'contractsRegistry',
                'contractsGas',
                'contractsFixtures'
        ]
        if (releaseReport.release == null
                || !(releaseReport.release.packageIdentity instanceof String)
                || !releaseReport.release.packageIdentity.startsWith('sha256:')
                || releaseReport.packages == null
                || !requiredPackageKeys.every {
                    releaseReport.packages[it] instanceof String
                            && releaseReport.packages[it].startsWith('sha256:')
                }) {
            throw new GradleException(
                    'release-conformance.json is missing exact release/package identities')
        }
        def runtimeScenariosById =
                runtimeTraceReport.scenarios instanceof List
                        ? runtimeTraceReport.scenarios.collectEntries {
                            [(it.id): it]
                        }
                        : [:]
        def longTraceScenario =
                runtimeScenariosById['long-trace-success']
        def gasExhaustionScenario =
                runtimeScenariosById[
                        'known-entry-gas-exhaustion']
        def boundedVisitsScenario =
                runtimeScenariosById['bounded-member-visits']
        def catalogOverflowScenario =
                runtimeScenariosById['counter-catalog-overflow']
        def multipleNamespacesScenario =
                runtimeScenariosById[
                        'combined-multiple-namespaces']
        def namespaceOrderScenario =
                runtimeScenariosById[
                        'deterministic-namespace-order']
        def deterministicFailureScenario =
                runtimeScenariosById[
                        'deterministic-failure-retention']
        def transientSuspensionScenario =
                runtimeScenariosById[
                        'transient-suspension-discard']
        def requiredRuntimeScenarioIds = [
                'long-trace-success',
                'known-entry-gas-exhaustion',
                'bounded-member-visits',
                'counter-catalog-overflow',
                'combined-multiple-namespaces',
                'deterministic-namespace-order',
                'deterministic-failure-retention',
                'transient-suspension-discard'
        ]
        boolean runtimeTraceConformant =
                runtimeTraceReport.schemaVersion
                == 'blue-language-java-runtime-trace-evidence/1.0'
                        && runtimeTraceReport.sourceTask
                        == ':runtimeTraceEvidence'
                        && runtimeTraceReport.summary instanceof Map
                        && runtimeTraceReport.summary.executed == 8
                        && runtimeTraceReport.summary.passed == 8
                        && runtimeTraceReport.summary.failed == 0
                        && runtimeTraceReport.summary.skipped == 0
                        && runtimeTraceReport.summary
                        .maximumObservedOrderedEntries == 4096
                        && runtimeTraceReport.summary
                        .minimumRequiredOrderedEntries == 516
                        && runtimeTraceReport.summary.conformant == true
                        && runtimeTraceReport.failures instanceof List
                        && runtimeTraceReport.failures.isEmpty()
                        && runtimeScenariosById.size() == 8
                        && runtimeScenariosById.keySet()
                        .containsAll(requiredRuntimeScenarioIds)
                        && runtimeScenariosById.values().every {
                            it.status == 'PASS'
                        }
                        && longTraceScenario
                        .observedOrderedEntries >= 516
                        && longTraceScenario
                        .exactOrderVerified == true
                        && gasExhaustionScenario
                        .observedOrderedEntries == 515
                        && gasExhaustionScenario
                        .rejectedChargeAbsent == true
                        && gasExhaustionScenario
                        .laterWorkPrevented == true
                        && gasExhaustionScenario
                        .exactPrefixVerified == true
                        && boundedVisitsScenario
                        .boundedMemberVisits == 1024
                        && boundedVisitsScenario
                        .observedOrderedEntries == 4096
                        && catalogOverflowScenario
                        .rejectedBeforeAdmission == true
                        && multipleNamespacesScenario
                        .combinedEntriesExceed256 == true
                        && namespaceOrderScenario
                        .canonicalOrderVerified == true
                        && deterministicFailureScenario
                        .exactPrefixRetained == true
                        && transientSuspensionScenario
                        .portableTraceDiscarded == true
                        && transientSuspensionScenario
                        .committedEntries == 0

        def releaseSuitesByName = new TreeMap<String, Map<String, Object>>()
        releaseReport.fixtures.each { fixture ->
            def suiteName = fixture.suite.toString()
            def suite = releaseSuitesByName.get(suiteName)
            if (suite == null) {
                suite = [
                        name   : suiteName,
                        tests  : 0,
                        passed : 0,
                        failed : 0,
                        skipped: 0
                ]
                releaseSuitesByName.put(suiteName, suite)
            }
            suite.tests++
            if (fixture.status == 'PASS') {
                suite.passed++
            } else if (fixture.status == 'SKIP'
                    || fixture.status == 'SKIPPED') {
                suite.skipped++
            } else {
                suite.failed++
            }
        }
        def releaseSuites = releaseSuitesByName.values().collect {
            new LinkedHashMap<String, Object>(it)
        }
        int releaseTests = releaseReport.summary.total as int
        int releasePassed = releaseReport.summary.passed as int
        int releaseFailed = releaseReport.summary.failed as int
        int releaseSkipped = releaseReport.summary.skipped as int
        boolean releaseConformant = releaseReport.summary.conformant == true
        if (releaseSuites.sum { it.tests } != releaseTests
                || releaseSuites.sum { it.passed } != releasePassed
                || releaseSuites.sum { it.failed } != releaseFailed
                || releaseSuites.sum { it.skipped } != releaseSkipped) {
            throw new GradleException(
                    'Release fixture records do not match their summary counts')
        }

        def sourceCommit = fragmentedProcessingSourceCommit.get()
        if (!(sourceCommit ==~ /(?:[0-9a-f]{40}|[0-9a-f]{64})/)) {
            throw new GradleException(
                    "Git returned an invalid source commit identity: '${sourceCommit}'")
        }

        def binaryApiValues = new LinkedHashMap<String, String>()
        finalApiReport.get().asFile.readLines('UTF-8').each { line ->
            int separator = line.indexOf('=')
            if (separator > 0) {
                binaryApiValues.put(
                        line.substring(0, separator),
                        line.substring(separator + 1))
            }
        }
        def requiredBinaryApiKeys = [
                'baseline',
                'current',
                'baselineApiClasses',
                'currentApiClasses',
                'currentClassMajorVersions',
                'incompatibleChanges',
                'additiveChanges'
        ]
        if (!requiredBinaryApiKeys.every {
            binaryApiValues.containsKey(it)
        }) {
            throw new GradleException(
                    'Binary API report is missing required result fields')
        }
        int incompatibleChanges = Integer.parseInt(
                binaryApiValues.incompatibleChanges)
        int additiveChanges = Integer.parseInt(
                binaryApiValues.additiveChanges)
        def additiveApiChanges = []
        boolean readingAdditiveChanges = false
        finalApiReport.get().asFile.readLines('UTF-8').each { line ->
            if (line == 'Additive changes:') {
                readingAdditiveChanges = true
            } else if (readingAdditiveChanges
                    && !line.trim().isEmpty()) {
                additiveApiChanges.add(line.trim())
            }
        }
        if (additiveApiChanges.size() != additiveChanges) {
            throw new GradleException(
                    'Binary API report additive-change details do not match '
                            + 'their summary count')
        }
        def classMajorVersions = binaryApiValues.currentClassMajorVersions
                .split(',')
                .findAll { !it.isEmpty() }
                .collect { Integer.parseInt(it) }
        boolean binaryApiCompatible = incompatibleChanges == 0
                && !classMajorVersions.isEmpty()
                && classMajorVersions.every { it <= 52 }

        def repeatabilityReport = new groovy.json.JsonSlurper()
                .parse(jarRepeatabilityJson.get().asFile)
        boolean jarRepeatable = repeatabilityReport.repeatable == true
                && repeatabilityReport.primary.identity
                == repeatabilityReport.replica.identity
        def sourceArchiveRepeatabilityReport =
                new groovy.json.JsonSlurper()
                        .parse(sourceArchiveRepeatabilityJson.get().asFile)
        boolean sourceArchivesRepeatable =
                sourceArchiveRepeatabilityReport.repeatable == true
                        && sourceArchiveRepeatabilityReport
                        .sourcesJar.byteIdentical == true
                        && sourceArchiveRepeatabilityReport
                        .sourcesJar.entriesIdentical == true
                        && sourceArchiveRepeatabilityReport
                        .sourceReleaseZip.byteIdentical == true
                        && sourceArchiveRepeatabilityReport
                        .sourceReleaseZip.entriesIdentical == true

        def jarArtifact = fragmentedProcessingJar.get().asFile
        def sourcesJarArtifact = fragmentedProcessingSourcesJar.get().asFile
        def javadocJarArtifact = fragmentedProcessingJavadocJar.get().asFile
        def sourceReleaseArtifact = fragmentedProcessingSourceRelease.get().asFile
        def replicaJarArtifact = repeatabilityJarTask.get()
                .archiveFile.get().asFile
        def jarIdentity = sha256IdentityOf(jarArtifact)
        if (jarIdentity != repeatabilityReport.primary.identity) {
            throw new GradleException(
                    'Reported production JAR identity does not match repeatability evidence')
        }

        def diagnosticEvidenceFor = { String suiteSuffix ->
            def suites = focusedVerification.suites.findAll {
                it.name == suiteSuffix || it.name.endsWith('.' + suiteSuffix)
            }
            [
                    executed   : !suites.isEmpty(),
                    suiteNames : suites.collect { it.name },
                    tests      : suites.isEmpty()
                            ? 0
                            : suites.sum { it.tests } as int,
                    passed     : suites.isEmpty()
                            ? 0
                            : suites.sum { it.passed } as int,
                    failed     : suites.isEmpty()
                            ? 0
                            : suites.sum { it.failed } as int,
                    skipped    : suites.isEmpty()
                            ? 0
                            : suites.sum { it.skipped } as int,
                    testCases  : suites.collectMany { it.testCases }
            ]
        }
        def allTestSuiteEvidenceFor = { String suiteSuffix ->
            def suites = allTests.suites.findAll {
                it.name == suiteSuffix
                        || it.name.endsWith('.' + suiteSuffix)
            }
            [
                    evidenceKind: 'passing-junit-suite',
                    executed    : !suites.isEmpty(),
                    suiteNames  : suites.collect { it.name },
                    tests       : suites.isEmpty()
                            ? 0
                            : suites.sum { it.tests } as int,
                    passed      : suites.isEmpty()
                            ? 0
                            : suites.sum { it.passed } as int,
                    failed      : suites.isEmpty()
                            ? 0
                            : suites.sum { it.failed } as int,
                    skipped     : suites.isEmpty()
                            ? 0
                            : suites.sum { it.skipped } as int
            ]
        }
        def representationMatrixEvidence = diagnosticEvidenceFor(
                'FragmentedProcessingLocalityIntegrationTest')
        def deepLocalityEvidence = diagnosticEvidenceFor(
                'DeepGraphPhysicalLocalityIntegrationTest')
        def exactFragmentEvidence = diagnosticEvidenceFor(
                'ExactNodeGraphFragmentsTest')
        def failureMatrixEvidence = diagnosticEvidenceFor(
                'FragmentedProcessingFailureMatrixTest')
        def requiredDiagnosticEvidence = [
                representationMatrixEvidence,
                deepLocalityEvidence,
                exactFragmentEvidence,
                failureMatrixEvidence
        ]
        def diagnosticCaseEvidenceFor = {
            Map<String, Object> suiteEvidence, String testMethod ->
                def matches = suiteEvidence.testCases.findAll {
                    it.name == testMethod
                            || it.name == testMethod + '()'
                            || it.name.startsWith(testMethod + '(')
                }
                [
                        testMethod: testMethod,
                        executed  : !matches.isEmpty(),
                        passed    : !matches.isEmpty()
                                && matches.every {
                                    it.status == 'PASSED'
                                },
                        records   : matches
                ]
        }
        def representationMatrixCase = diagnosticCaseEvidenceFor(
                representationMatrixEvidence,
                'shouldVerifyExactRootAndEventFragmentsHaveIdenticalSemanticsAcrossMatrix')
        def deepLocalityCase = diagnosticCaseEvidenceFor(
                deepLocalityEvidence,
                'shouldVerifyDeepGraphHasSemanticParityAndPhysicalLocalityAcrossRepresentationsAndProviders')
        def exactFragmentCase = diagnosticCaseEvidenceFor(
                exactFragmentEvidence,
                'shouldSplitOnlySelectedCutsAndTheirAncestorSpine')
        def providerFailureCase = diagnosticCaseEvidenceFor(
                failureMatrixEvidence,
                'shouldVerifySelectedBodyUnavailableSuspendsWithoutPortableGasAndRetryMatches')
        def requiredDiagnosticCases = [
                representationMatrixCase,
                deepLocalityCase,
                exactFragmentCase,
                providerFailureCase
        ]
        boolean diagnosticEvidenceConformant = requiredDiagnosticEvidence.every {
            it.executed && it.tests > 0 && it.failed == 0 && it.skipped == 0
        } && requiredDiagnosticCases.every {
            it.executed && it.passed
        }
        def runtimeWorkSessionEvidence =
                allTestSuiteEvidenceFor(
                        'RuntimeWorkSessionTest')
        def runtimePhaseIntegrationEvidence =
                allTestSuiteEvidenceFor(
                        'RuntimeWorkSessionProcessorPhaseIntegrationTest')
        def semanticIdentityEvidence =
                allTestSuiteEvidenceFor(
                        'SemanticOutputBoundaryTest')
        def gasExhaustionEvidence =
                allTestSuiteEvidenceFor(
                        'DocumentProcessorHandlerFailureTest')
        def subtypeCatalogEvidence =
                allTestSuiteEvidenceFor(
                        'ExternalChannelDependencyContextTest')
        def subtypePredicateEvidence =
                allTestSuiteEvidenceFor(
                        'SubtypeAssignablePredicateTest')
        def bodySourceEvidence =
                allTestSuiteEvidenceFor(
                        'ContractContributionResolverTest')
        def selectedBodyEvidence =
                allTestSuiteEvidenceFor(
                        'SelectedExecutableBodyCapabilityTest')
        def hostedOutputAdmissionEvidence =
                allTestSuiteEvidenceFor(
                        'ExternalChannelHostedOutputAdmissionTest')
        def cyclicBoundaryEvidence =
                allTestSuiteEvidenceFor(
                        'CyclicProcessingBoundaryTest')
        def hostedRuntimeEvidence = [
                runtimeWorkSession      :
                        runtimeWorkSessionEvidence,
                runtimePhaseIntegration:
                        runtimePhaseIntegrationEvidence,
                semanticIdentityBoundary:
                        semanticIdentityEvidence,
                gasExhaustion           :
                        gasExhaustionEvidence,
                subtypeCatalog          :
                        subtypeCatalogEvidence,
                subtypePredicate        :
                        subtypePredicateEvidence,
                executableBodySource    :
                        bodySourceEvidence,
                selectedBodyMaterializer:
                        selectedBodyEvidence,
                hostedOutputAdmission  :
                        hostedOutputAdmissionEvidence
        ]
        boolean hostedRuntimeEvidenceConformant =
                hostedRuntimeEvidence.values().every {
                    it.executed
                            && it.tests > 0
                            && it.failed == 0
                            && it.skipped == 0
                }

        def assertionEvidence = { List<Map<String, Object>> testCases ->
            [
                    evidenceKind : 'passing-junit-assertions',
                    asserted     : testCases.every {
                        it.executed && it.passed
                    },
                    valuesExported: false,
                    testCases    : testCases
            ]
        }
        def measurementEvidence = [
                exactRequestedBlueIds            :
                        assertionEvidence([
                                representationMatrixCase,
                                deepLocalityCase
                        ]),
                transferredProviderBytes         :
                        assertionEvidence([
                                representationMatrixCase,
                                deepLocalityCase
                        ]),
                forbiddenDemands                 :
                        assertionEvidence([
                                representationMatrixCase,
                                deepLocalityCase
                        ]),
                structuralSharing                :
                        assertionEvidence([
                                deepLocalityCase
                        ]),
                semanticDemandSet                :
                        assertionEvidence([
                                representationMatrixCase,
                                deepLocalityCase
                        ]),
                representationNeutralSemanticsGas:
                        assertionEvidence([
                                representationMatrixCase,
                                deepLocalityCase
                        ])
        ]

        def currentSourceSnapshot = releaseEvidenceSourceSnapshot()
        def cleanEvidencePath = cleanBuildEvidenceFile.get().asFile
        def cleanEvidenceReason = 'missing-clean-build-evidence'
        def cleanMarker = null
        if (cleanEvidencePath.isFile()) {
            try {
                cleanMarker = new groovy.json.JsonSlurper()
                        .parse(cleanEvidencePath)
                cleanEvidenceReason = cleanMarker.schema
                        != cleanBuildEvidenceSchema
                        ? 'unexpected-clean-build-evidence-schema'
                        : cleanMarker.cleanTask != cleanTaskPath
                        ? 'unexpected-clean-task'
                        : cleanMarker.buildTask != buildTaskPath
                        ? 'unexpected-build-task'
                        : cleanMarker.sourceCommit != sourceCommit
                        ? 'source-commit-changed-since-clean-build'
                        : cleanMarker.sourceDateEpoch
                        != effectiveSourceDateEpoch.get()
                        ? 'source-date-epoch-changed-since-clean-build'
                        : cleanMarker.excludedTasks
                        != Collections.emptyList()
                        ? 'clean-build-used-task-exclusions'
                        : cleanMarker.sourceInputIdentity
                        != currentSourceSnapshot.identity
                        || cleanMarker.sourceFileCount
                        != currentSourceSnapshot.fileCount
                        ? 'source-inputs-changed-since-clean-build'
                        : 'verified'
            } catch (Exception ignored) {
                cleanEvidenceReason = 'invalid-clean-build-evidence'
                cleanMarker = null
            }
        }
        boolean cleanBuildVerified = cleanEvidenceReason == 'verified'

        def testLauncherMetadata = fragmentedProcessingTestLauncher.get().metadata
        boolean conformant = allTests.conformant
                && focusedVerification.conformant
                && releaseConformant
                && runtimeTraceConformant
                && binaryApiCompatible
                && jarRepeatable
                && sourceArchivesRepeatable
                && diagnosticEvidenceConformant
                && hostedRuntimeEvidenceConformant
                && cleanBuildVerified

        boolean workingTreeClean =
                fragmentedProcessingGitStatus.get().isEmpty()
        boolean commitAutomationUntouched =
                fragmentedProcessingCommitAutomationDiff
                        .get().isEmpty()
        boolean apiBaselineIndependent =
                fragmentedProcessingApiBaselineDiff
                        .get().isEmpty()
        def knownLimitations = []
        if (!workingTreeClean) {
            knownLimitations.add(
                    'The candidate source tree has uncommitted changes, so '
                            + 'HEAD is not the exact candidate source identity; '
                            + 'the report binds the candidate separately with '
                            + 'sourceInputIdentity.')
        }
        if (!apiBaselineIndependent) {
            knownLimitations.add(
                    'api/blue-language-java-1.0.json already differs from '
                            + 'HEAD, so the zero-break comparison is not '
                            + 'independent evidence against the committed '
                            + 'baseline.')
        }
        boolean readyToGo = conformant
                && workingTreeClean
                && commitAutomationUntouched
                && apiBaselineIndependent

        def report = [
                schema                  : 'blue-language-java-release-evidence/1.4',
                version                 : '1.4',
                source                  : [
                        commit           : sourceCommit,
                        workingTreeClean : workingTreeClean,
                        modifiedPathCount: fragmentedProcessingGitStatus
                                .get().isEmpty()
                                ? 0
                                : fragmentedProcessingGitStatus.get()
                                .readLines().size()
                ],
                baseline                : [
                        sourceTask: ':test before generic-kernel changes',
