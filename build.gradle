    group = 'verification'
    description = 'Independently assembles the sources JAR and source-release ZIP twice and requires identical bytes and entries.'
    dependsOn primarySourcesJarTask
    dependsOn repeatabilitySourcesJarTask
    dependsOn sourceReleaseArchiveTask
    dependsOn repeatabilitySourceReleaseArchiveTask
    inputs.file(primarySourcesJarTask.flatMap { it.archiveFile })
    inputs.file(repeatabilitySourcesJarTask.flatMap { it.archiveFile })
    inputs.file(sourceReleaseArchiveTask.flatMap { it.archiveFile })
    inputs.file(repeatabilitySourceReleaseArchiveTask.flatMap {
        it.archiveFile
    })
    inputs.property('buildVersion', project.version.toString())
    outputs.file(sourceArchiveRepeatabilityJson)

    doLast {
        def archiveEntryEvidence = { File archive ->
            def entries = []
            def zip = new java.util.zip.ZipFile(archive)
            try {
                def enumeration = zip.entries()
                while (enumeration.hasMoreElements()) {
                    def entry = enumeration.nextElement()
                    String identity = null
                    if (!entry.directory) {
                        def digest = java.security.MessageDigest.getInstance(
                                'SHA-256')
                        zip.getInputStream(entry).withCloseable { input ->
                            byte[] buffer = new byte[8192]
                            int read
                            while ((read = input.read(buffer)) != -1) {
                                digest.update(buffer, 0, read)
                            }
                        }
                        identity = 'sha256:' + digest.digest().collect {
                            String.format('%02x', ((byte) it) & 0xff)
                        }.join()
                    }
                    entries.add([
                            name     : entry.name,
                            directory: entry.directory,
                            size     : entry.size,
                            crc32    : entry.crc,
                            identity : identity
                    ])
                }
            } finally {
                zip.close()
            }
            [
                    entryCount: entries.size(),
                    entries   : entries
            ]
        }
        def byteIdentical = { File primary, File replica ->
            if (primary.length() != replica.length()) {
                return false
            }
            def primaryInput = new java.io.BufferedInputStream(
                    new java.io.FileInputStream(primary))
            def replicaInput = new java.io.BufferedInputStream(
                    new java.io.FileInputStream(replica))
            try {
                while (true) {
                    int primaryByte = primaryInput.read()
                    int replicaByte = replicaInput.read()
                    if (primaryByte != replicaByte) {
                        return false
                    }
                    if (primaryByte == -1) {
                        return true
                    }
                }
            } finally {
                primaryInput.close()
                replicaInput.close()
            }
        }
        def compareArchivePair = {
            String kind,
            AbstractArchiveTask primaryTask,
            AbstractArchiveTask replicaTask ->
            if (primaryTask.preserveFileTimestamps
                    || replicaTask.preserveFileTimestamps
                    || !primaryTask.reproducibleFileOrder
                    || !replicaTask.reproducibleFileOrder) {
                throw new GradleException(
                        "${kind} tasks must disable file timestamps and use "
                                + 'reproducible file order')
            }

            def primary = primaryTask.archiveFile.get().asFile
            def replica = replicaTask.archiveFile.get().asFile
            def primaryIdentity = sha256IdentityOf(primary)
            def replicaIdentity = sha256IdentityOf(replica)
            def primaryEvidence = archiveEntryEvidence(primary)
            def replicaEvidence = archiveEntryEvidence(replica)
            def bytesMatch = byteIdentical(primary, replica)
            def entriesMatch =
                    primaryEvidence.entries == replicaEvidence.entries

            if (!bytesMatch
                    || primaryIdentity != replicaIdentity
                    || !entriesMatch) {
                throw new GradleException(
                        "${kind} is not repeatable: primary "
                                + "${primaryIdentity}, replica "
                                + "${replicaIdentity}, byteIdentical="
                                + "${bytesMatch}, entriesIdentical="
                                + entriesMatch)
            }

            [
                    byteIdentical   : bytesMatch,
                    entriesIdentical: entriesMatch,
                    primary        : [
                            name      : primary.name,
                            identity  : primaryIdentity,
                            sizeBytes : primary.length(),
                            entryCount: primaryEvidence.entryCount,
                            entries   : primaryEvidence.entries
                    ],
                    replica        : [
                            name      : replica.name,
                            identity  : replicaIdentity,
                            sizeBytes : replica.length(),
                            entryCount: replicaEvidence.entryCount,
                            entries   : replicaEvidence.entries
                    ]
            ]
        }

        def report = [
                schema              :
                        'blue-language-java-source-archive-repeatability/1.0',
                repeatable          : true,
                archiveConfiguration: [
                        preserveFileTimestamps: false,
                        reproducibleFileOrder : true
                ],
                sourcesJar          : compareArchivePair(
                        'Sources JAR',
                        primarySourcesJarTask.get(),
                        repeatabilitySourcesJarTask.get()),
                sourceReleaseZip    : compareArchivePair(
                        'Source-release ZIP',
                        sourceReleaseArchiveTask.get(),
                        repeatabilitySourceReleaseArchiveTask.get())
        ]
        def output = sourceArchiveRepeatabilityJson.get().asFile
        output.parentFile.mkdirs()
        output.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(report)) + '\n',
                'UTF-8')
    }
}

tasks.register('verifySourceReleaseArchive') {
    group = 'verification'
    description = 'Checks the source release archive for required files and local-only debris.'
    dependsOn sourceReleaseArchiveTask
    inputs.file(sourceReleaseArchiveTask.flatMap { it.archiveFile })
    doLast {
        def archive = sourceReleaseArchiveTask.get().archiveFile.get().asFile
        def names = []
        archive.withInputStream { input ->
            def zip = new java.util.zip.ZipInputStream(input)
            try {
                def entry = zip.getNextEntry()
                while (entry != null) {
                    names.add(entry.name)
                    zip.closeEntry()
                    entry = zip.getNextEntry()
                }
            } finally {
                zip.close()
            }
        }
        def forbidden = names.findAll { name ->
            name.contains('__MACOSX/')
                    || name.endsWith('/.DS_Store')
                    || name.contains('/._')
                    || name.contains('/__pycache__/')
                    || name.endsWith('.pyc')
                    || name.endsWith('.pyo')
                    || name.contains('/build/')
                    || name.contains('/docs/performance/')
                    || name.endsWith('/Archive.zip')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Source release archive contains forbidden entries: "
                    + forbidden.take(20))
        }
        def root = "blue-language-java-${project.version}/".toString()
        def required = [
                root + '.cz.toml',
                root + 'api/blue-language-java-1.0.json',
                root + 'api/modernization-api-migration-ledger-1.0.json',
                root + 'api/semantic-baseline-1.0.json',
                root + 'build.gradle',
                root + 'settings.gradle.kts',
                root + 'README.md',
                root + 'src/main/java/blue/language/Blue.java',
                root + 'src/main/resources/specifications/blue-language-specification-1.0.md',
                root + 'src/main/resources/specifications/blue-contracts-and-processor-specification-1.0.md',
                root + 'src/main/resources/release/blue-language-1.0-contracts-1.0-bex-2.0/RELEASE-MANIFEST.yaml',
                root + 'src/main/resources/registry/blue-language-1.0/manifest.yaml',
                root + 'src/main/resources/registry/blue-contracts-1.0/manifest.yaml',
                root + 'src/main/resources/blue/language/processor/contracts-gas-1.0.yaml',
                root + 'src/test/resources/blue-language-1.0/fixtures/manifest.yaml',
                root + 'src/test/resources/blue-contracts-1.0/fixtures/manifest.yaml'
        ]
        def missing = required.findAll { requiredName -> !names.contains(requiredName) }
        if (!missing.isEmpty()) {
            throw new GradleException("Source release archive is missing required entries: "
                    + missing)
        }
    }
}

