tasks.register('verifyNoDeprecatedProductionApi') {
    group = 'verification'
    description = 'Fails when production Java source declares a deprecated preview API.'
    def productionSources = fileTree('src/main/java') {
        include '**/*.java'
    }
    inputs.files(productionSources)
    doLast {
        def violations = []
        productionSources.files.sort().each { source ->
            source.readLines('UTF-8').eachWithIndex { line, index ->
                if (line.contains('@Deprecated')) {
                    violations.add("${project.relativePath(source)}:${index + 1}: ${line.trim()}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Production deprecated APIs are forbidden:\n"
                            + violations.join('\n'))
        }
    }
}

tasks.register('verifyNoAmbiguousReverseApi') {
    group = 'verification'
    description = 'Fails when production Java source reintroduces ambiguous bare reverse semantics.'
    def productionSources = fileTree('src/main/java') {
        include '**/*.java'
    }
    inputs.files(productionSources)
    doLast {
        def reverseCall = ~/\breverse\s*\(/
        def mergeReverser = ~/\bMergeReverser\b/
        def violations = []
        productionSources.files.sort().each { source ->
            source.readLines('UTF-8').eachWithIndex { line, index ->
                def trimmed = line.trim()
                def commentLine = trimmed.startsWith('//')
                        || trimmed.startsWith('/*')
                        || trimmed.startsWith('*')
                        || trimmed.startsWith('*/')
                if (!commentLine
                        && ((line =~ reverseCall).find()
                        || (line =~ mergeReverser).find())) {
                    violations.add("${project.relativePath(source)}:${index + 1}: ${line.trim()}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Ambiguous reverse APIs are forbidden:\n"
                            + violations.join('\n'))
        }
    }
}

