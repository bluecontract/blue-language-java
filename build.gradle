    configureFocusedTest(delegate)
    description = 'Runs Base58, canonical-byte, and frozen identity differential coverage.'
    filter {
        includeTestsMatching 'blue.language.utils.Base58Test'
        includeTestsMatching 'blue.language.utils.Base58Sha256ProviderTest'
        includeTestsMatching 'blue.language.utils.BlueIdCalculatorTest'
        includeTestsMatching 'blue.language.snapshot.FrozenNodeTest'
        includeTestsMatching 'blue.language.snapshot.FrozenNodeStructuralInternerTest'
        includeTestsMatching 'blue.language.snapshot.FrozenCanonicalDigesterTest'
    }
}

tasks.register('patchSequenceDifferentialTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs deterministic sequential-patch parity and cursor semantic coverage.'
    filter {
        includeTestsMatching 'blue.language.processor.PatchSequenceRandomizedDifferentialTest'
        includeTestsMatching 'blue.language.processor.SequentialPatchPlanningSessionTest'
        includeTestsMatching 'blue.language.processor.PreparedPatchSequenceTest'
        includeTestsMatching 'blue.language.processor.DocumentProcessorBatchPatchTest'
    }
}

tasks.register('memoryIntegrationTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs bounded sequence-retention and weak-reference collectability stress tests.'
    maxHeapSize = '512m'
    forkEvery = 1
    filter {
        includeTestsMatching 'blue.language.processor.PatchSequenceRetentionStressTest'
    }
}

tasks.register('cacheLifecycleTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs weighted-cache, reference-cache, and runtime lifecycle contracts.'
    filter {
        includeTestsMatching 'blue.language.BlueCacheLifecycleTest'
        includeTestsMatching 'blue.language.BlueCachePolicyTest'
        includeTestsMatching 'blue.language.WeightedLruCacheTest'
        includeTestsMatching 'blue.language.processor.ProcessorOwnedCacheLifecycleTest'
        includeTestsMatching 'blue.language.snapshot.FrozenNodeRetainedWeightTest'
        includeTestsMatching 'blue.language.snapshot.ResolvedReferenceCacheContractTest'
        includeTestsMatching 'blue.language.utils.FrozenTypeMatcherCachePolicyTest'
    }
}

tasks.register('verifyNoDeprecatedProductionApi') {
    group = 'verification'
    description = 'Fails when production Java source declares a deprecated preview API.'
    def productionSources = fileTree('src/main/java') {
        include '**/*.java'
    }
    inputs.files(productionSources)
    doLast {
        def violations = []
        productionSources.files.sort().each { source ->
            source.readLines('UTF-8').eachWithIndex { line, index ->
                if (line.contains('@Deprecated')) {
                    violations.add("${project.relativePath(source)}:${index + 1}: ${line.trim()}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Production deprecated APIs are forbidden:\n"
                            + violations.join('\n'))
        }
    }
}

tasks.register('verifyNoAmbiguousReverseApi') {
    group = 'verification'
    description = 'Fails when production Java source reintroduces ambiguous bare reverse semantics.'
    def productionSources = fileTree('src/main/java') {
        include '**/*.java'
    }
    inputs.files(productionSources)
    doLast {
        def reverseCall = ~/\breverse\s*\(/
        def mergeReverser = ~/\bMergeReverser\b/
        def violations = []
        productionSources.files.sort().each { source ->
            source.readLines('UTF-8').eachWithIndex { line, index ->
                def trimmed = line.trim()
                def commentLine = trimmed.startsWith('//')
                        || trimmed.startsWith('/*')
                        || trimmed.startsWith('*')
                        || trimmed.startsWith('*/')
                if (!commentLine
                        && ((line =~ reverseCall).find()
                        || (line =~ mergeReverser).find())) {
                    violations.add("${project.relativePath(source)}:${index + 1}: ${line.trim()}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Ambiguous reverse APIs are forbidden:\n"
                            + violations.join('\n'))
        }
    }
}

def finalApiBaseline = layout.projectDirectory.file(
        'api/blue-language-java-1.0.json')
def finalApiReport = layout.buildDirectory.file(
        'reports/binary-api/final-1.0-baseline-to-candidate.txt')
tasks.register('verifyFinalApiBaseline', Exec) {
    group = 'verification'
    description = 'Checks the candidate JAR against the final Language 1.0 and Contracts kernel 1.0 JVM API baseline.'
    dependsOn tasks.named('jar')
    inputs.file(finalApiBaseline)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.file(finalApiReport)
    doFirst {
        commandLine 'python3',
                'tools/check_binary_api.py',
                finalApiBaseline.asFile.absolutePath,
                tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                finalApiReport.get().asFile.absolutePath
    }
}

def releaseConformanceJson = layout.buildDirectory.file(
        'reports/conformance/release-conformance.json')
def releaseConformanceText = layout.buildDirectory.file(
        'reports/conformance/release-conformance.txt')
tasks.register('releaseConformanceTest', JavaExec) {
    group = 'verification'
    description = 'Runs all tests and the strict 125/125 Language plus 127/127 Contracts release gate.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('verifyNoDeprecatedProductionApi')
    dependsOn tasks.named('verifyNoAmbiguousReverseApi')
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'blue.language.conformance.ReleaseConformanceCli'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    args releaseConformanceJson.get().asFile.absolutePath,
            releaseConformanceText.get().asFile.absolutePath
    inputs.files(fileTree('src/test/resources/blue-language-1.0/fixtures'))
    inputs.files(fileTree('src/test/resources/blue-contracts-1.0/fixtures'))
    inputs.files(fileTree('src/main/resources/registry'))
    inputs.file('src/main/resources/blue/language/processor/contracts-gas-1.0.yaml')
    outputs.file(releaseConformanceJson)
    outputs.file(releaseConformanceText)
}

def fragmentedProcessingTestResults = layout.buildDirectory.dir(
        'test-results/fragmentedProcessingTest')
def fragmentedProcessingJson = layout.buildDirectory.file(
        'reports/fragmented-processing/fragmented-processing.json')
def fragmentedProcessingJar = tasks.named('jar', Jar).flatMap {
    it.archiveFile
}
def fragmentedProcessingSourceRelease = layout.buildDirectory.file(
        "release/blue-language-java-${project.version}-source-release.zip")
def fragmentedProcessingSourceCommit = providers.exec {
    workingDir rootDir
    commandLine 'git', 'rev-parse', '--verify', 'HEAD^{commit}'
}.standardOutput.asText.map {
    it.trim()
}
tasks.register('fragmentedProcessingTest', Test) {
    configureFocusedTest(delegate)
