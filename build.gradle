buildscript {
    dependencies {
        classpath 'org.apache.groovy:groovy-toml:4.0.22'
    }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.24.0'
    id 'me.champeau.jmh' version '0.7.3'
}

group = "blue.language"
version = project.findProperty('releaseVersion') ?: determineProjectVersion()

def releaseChannel = System.getenv('BLUE_RELEASE_CHANNEL')
if (releaseChannel != null && !['rc', 'stable'].contains(releaseChannel)) {
    throw new GradleException("BLUE_RELEASE_CHANNEL must be either 'rc' or 'stable'")
}
def releaseVersion = project.version.toString()
if (releaseChannel == 'rc' && !(releaseVersion ==~ /\d+\.\d+\.\d+-rc\.\d+/)) {
    throw new GradleException(
            "BLUE_RELEASE_CHANNEL=rc requires an x.y.z-rc.n version, found '${releaseVersion}'")
}
if (releaseChannel == 'stable' && !(releaseVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException(
            "BLUE_RELEASE_CHANNEL=stable requires an x.y.z version, found '${releaseVersion}'")
}
def isReleaseCandidate = releaseChannel == 'rc'

base {
    archivesName = "blue-language-java"
}

repositories {
    if (!System.getenv('CI')) {
        mavenLocal()
    }
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

compileTestJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}


dependencies {
    // JUnit Jupiter (JUnit 5)
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.mockito:mockito-core:3.12.4")

    // Jackson
    implementation("com.fasterxml.jackson.core:jackson-databind:2.15.2")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2")

    implementation("commons-codec:commons-codec:1.15")

    implementation("org.apache.httpcomponents:httpclient:4.5.14")

    implementation("org.reflections:reflections:0.10.2")

    implementation("io.github.erdtman:java-json-canonicalization:1.1")

}

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    useJUnitPlatform()
    reports {
        junitXml.required = false
        html.required = true
    }
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

def configureFocusedTest = { Test task ->
    task.group = 'verification'
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.dependsOn tasks.named('testClasses')
    task.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    task.useJUnitPlatform()
    task.reports {
        junitXml.required = false
        html.required = true
    }
}

