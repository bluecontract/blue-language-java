tasks.register('verifyReleaseEvidenceReport') {
    group = 'verification'
    description = 'Validates the machine-readable release evidence schema and mandatory gate results.'
    dependsOn tasks.named('fragmentedProcessingReport')
    inputs.file(fragmentedProcessingJson)
    inputs.file(finalGenericKernelMarkdown)
    doLast {
        def report = new groovy.json.JsonSlurper()
                .parse(fragmentedProcessingJson.get().asFile)
        def failUnless = { boolean condition, String message ->
            if (!condition) {
                throw new GradleException(message)
            }
        }
        failUnless(
                report.schema == 'blue-language-java-release-evidence/1.4',
                'Release evidence uses an unexpected schema')
        failUnless(
                report.source.commit ==~ /(?:[0-9a-f]{40}|[0-9a-f]{64})/,
                'Release evidence is missing a valid source commit')
        failUnless(
                report.toolchain.gradle.version != null
                        && report.toolchain.buildJvm.javaVersion != null
                        && report.toolchain.testJvm.runtimeVersion != null,
                'Release evidence is missing Java or Gradle versions')
        failUnless(
                report.allTests.tests > 0
                        && report.allTests.failed == 0
                        && report.allTests.skipped == 0,
                'Release evidence does not prove a complete passing test task')
        def fixtureSuites = report.releaseConformance.suites.collectEntries {
            [(it.name): it]
        }
        failUnless(
                fixtureSuites.language?.tests == 153
                        && fixtureSuites.language?.passed == 153
                        && fixtureSuites.contracts?.tests == 140
                        && fixtureSuites.contracts?.passed == 140
                        && report.releaseConformance.failed == 0
                        && report.releaseConformance.skipped == 0,
                'Release evidence does not prove 153/153 Language and '
                        + '140/140 Contracts fixtures')
        failUnless(
                report.artifacts.values().every {
                    it.identity ==~ /sha256:[0-9a-f]{64}/
                },
                'Release evidence contains an invalid artifact SHA-256 identity')
        failUnless(
                report.binaryApi.compatible == true
                        && report.binaryApi.incompatibleChanges == 0,
                'Release evidence does not prove binary API compatibility')
        failUnless(
                report.jarRepeatability.repeatable == true
                        && report.jarRepeatability.primary.identity
                        == report.jarRepeatability.replica.identity,
                'Release evidence does not prove JAR repeatability')
        failUnless(
                report.sourceArchiveRepeatability.repeatable == true
                        && report.summary.sourceArchivesRepeatable == true,
                'Release evidence does not prove source-archive repeatability')
        failUnless(
                report.binaryApi.additiveApi.size()
                        == report.binaryApi.additiveChanges,
                'Release evidence does not contain the exact additive API list')
        def runtimeScenarios =
                report.runtimeTrace.scenarios.collectEntries {
                    [(it.id): it]
                }
        failUnless(
                report.runtimeTrace.schemaVersion
                        == 'blue-language-java-runtime-trace-evidence/1.0'
                        && report.runtimeTrace.summary.executed == 8
                        && report.runtimeTrace.summary.passed == 8
                        && report.runtimeTrace.summary.failed == 0
                        && report.runtimeTrace.summary.skipped == 0
                        && report.runtimeTrace.summary
                        .maximumObservedOrderedEntries == 4096
                        && report.runtimeTrace.failures.isEmpty()
                        && runtimeScenarios[
                        'long-trace-success']
                        .observedOrderedEntries >= 516
                        && runtimeScenarios[
                        'known-entry-gas-exhaustion']
                        .rejectedChargeAbsent == true
                        && runtimeScenarios[
                        'known-entry-gas-exhaustion']
                        .laterWorkPrevented == true
                        && runtimeScenarios[
                        'bounded-member-visits']
                        .observedOrderedEntries == 4096
                        && runtimeScenarios[
                        'counter-catalog-overflow']
                        .rejectedBeforeAdmission == true
                        && runtimeScenarios[
                        'deterministic-failure-retention']
                        .exactPrefixRetained == true
                        && runtimeScenarios[
                        'transient-suspension-discard']
                        .portableTraceDiscarded == true
                        && report.summary.runtimeTraceEvidencePassed
                        == true
                        && report.summary
                        .maximumObservedRuntimeTraceEntries == 4096,
                'Release evidence does not prove the required observed '
                        + 'RuntimeWorkSession trace semantics')
        failUnless(
                report.hostedRuntime.values().every {
                    it.executed == true
                            && it.tests > 0
                            && it.failed == 0
                            && it.skipped == 0
                },
                'Release evidence does not prove every generic hosted-runtime workstream')
        failUnless(
                report.releaseReadiness.commitAutomationUntouched == true
                        && report.summary.commitAutomationUntouched == true,
                'Release evidence does not prove .cz.toml remained untouched')
        failUnless(
                report.releaseReadiness.readyToGo == true
                        && report.releaseReadiness.readyToGo
                        == (report.releaseReadiness
                        .implementationGatesPassed
                        && report.releaseReadiness.exactCandidateCommit
                        && report.releaseReadiness
                        .commitAutomationUntouched
                        && report.releaseReadiness
                        .independentApiBaseline),
                'Release readiness is false or inconsistent with candidate-state gates')
        failUnless(
                finalGenericKernelMarkdown.get().asFile.isFile()
                        && finalGenericKernelMarkdown.get()
                        .asFile.length() > 0L,
                'Release evidence did not produce the Markdown final report')
        failUnless(
                report.representationAndLocality.conformant == true
                        && report.representationAndLocality
                        .representationMatrix.executed == true
                        && report.representationAndLocality
                        .deepPhysicalLocality.executed == true
                        && report.representationAndLocality
                        .requiredTestCases.every {
                            it.executed == true && it.passed == true
                        }
                        && report.representationAndLocality
                        .measurementEvidence.values().every {
                            it.asserted == true
                                    && it.valuesExported == false
                        },
                'Release evidence does not prove representation/locality coverage')
        failUnless(
                report.execution.cleanBuild.verified == true
                        && report.execution.cleanBuild.evidenceKind
                        == cleanBuildEvidenceKind
                        && report.execution.cleanBuild.cleanTask
                        == cleanTaskPath
                        && report.execution.cleanBuild.buildTask
                        == buildTaskPath
                        && report.execution.cleanBuild.excludedTasks
                        == Collections.emptyList()
                        && report.execution.cleanBuild.sourceDateEpoch
                        == report.jarRepeatability.buildProperties
                        .sourceDateEpoch
                        && report.summary.cleanBuildVerified == true,
                'Release evidence is not bound to a successful clean build '
                        + 'over the exact source-release inputs')
        failUnless(
                report.execution.benchmarkCompilation.successful == true,
                'Release evidence does not prove benchmark compilation')
        failUnless(
                report.summary.conformant == true,
                'Release evidence summary is not conformant')
    }
}

