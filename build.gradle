buildscript {
    dependencies {
        classpath 'org.apache.groovy:groovy-toml:4.0.22'
    }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.24.0'
    id 'me.champeau.jmh' version '0.7.3'
}

group = "blue.language"
version = project.findProperty('releaseVersion') ?: determineProjectVersion()

def releaseChannel = System.getenv('BLUE_RELEASE_CHANNEL')
if (releaseChannel != null && !['rc', 'stable'].contains(releaseChannel)) {
    throw new GradleException("BLUE_RELEASE_CHANNEL must be either 'rc' or 'stable'")
}
def releaseVersion = project.version.toString()
if (releaseChannel == 'rc' && !(releaseVersion ==~ /\d+\.\d+\.\d+-rc\.\d+/)) {
    throw new GradleException(
            "BLUE_RELEASE_CHANNEL=rc requires an x.y.z-rc.n version, found '${releaseVersion}'")
}
if (releaseChannel == 'stable' && !(releaseVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException(
            "BLUE_RELEASE_CHANNEL=stable requires an x.y.z version, found '${releaseVersion}'")
}
def isReleaseCandidate = releaseChannel == 'rc'

base {
    archivesName = "blue-language-java"
}

repositories {
    if (!System.getenv('CI')) {
        mavenLocal()
    }
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

compileTestJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}


dependencies {
    // JUnit Jupiter (JUnit 5)
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.mockito:mockito-core:3.12.4")

    // Jackson
    implementation("com.fasterxml.jackson.core:jackson-databind:2.15.2")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2")

    implementation("commons-codec:commons-codec:1.15")

    implementation("org.apache.httpcomponents:httpclient:4.5.14")

    implementation("org.reflections:reflections:0.10.2")

    implementation("io.github.erdtman:java-json-canonicalization:1.1")

}

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    useJUnitPlatform()
    reports {
        junitXml.required = false
        html.required = true
    }
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

def configureFocusedTest = { Test task ->
    task.group = 'verification'
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.dependsOn tasks.named('testClasses')
    task.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    task.useJUnitPlatform()
    task.reports {
        junitXml.required = false
        html.required = true
    }
}

tasks.register('identityDifferentialTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs Base58, canonical-byte, and frozen identity differential coverage.'
    filter {
        includeTestsMatching 'blue.language.utils.Base58Test'
        includeTestsMatching 'blue.language.utils.Base58Sha256ProviderTest'
        includeTestsMatching 'blue.language.utils.BlueIdCalculatorTest'
        includeTestsMatching 'blue.language.snapshot.FrozenNodeTest'
        includeTestsMatching 'blue.language.snapshot.FrozenNodeStructuralInternerTest'
        includeTestsMatching 'blue.language.snapshot.FrozenCanonicalDigesterTest'
    }
}

tasks.register('patchSequenceDifferentialTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs deterministic sequential-patch parity and cursor semantic coverage.'
    filter {
        includeTestsMatching 'blue.language.processor.PatchSequenceRandomizedDifferentialTest'
        includeTestsMatching 'blue.language.processor.SequentialPatchPlanningSessionTest'
        includeTestsMatching 'blue.language.processor.PreparedPatchSequenceTest'
        includeTestsMatching 'blue.language.processor.DocumentProcessorBatchPatchTest'
    }
}

tasks.register('memoryIntegrationTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs bounded sequence-retention and weak-reference collectability stress tests.'
    maxHeapSize = '512m'
    forkEvery = 1
    filter {
        includeTestsMatching 'blue.language.processor.PatchSequenceRetentionStressTest'
    }
}

tasks.register('cacheLifecycleTest', Test) {
    configureFocusedTest(delegate)
    description = 'Runs weighted-cache, reference-cache, and runtime lifecycle contracts.'
    filter {
        includeTestsMatching 'blue.language.BlueCacheLifecycleTest'
        includeTestsMatching 'blue.language.BlueCachePolicyTest'
        includeTestsMatching 'blue.language.WeightedLruCacheTest'
        includeTestsMatching 'blue.language.processor.ProcessorOwnedCacheLifecycleTest'
        includeTestsMatching 'blue.language.snapshot.FrozenNodeRetainedWeightTest'
        includeTestsMatching 'blue.language.snapshot.ResolvedReferenceCacheContractTest'
        includeTestsMatching 'blue.language.utils.FrozenTypeMatcherCachePolicyTest'
    }
}

jmh {
    includeTests = true
    jmhVersion = '1.37'
    warmupIterations = 3
    warmup = '1s'
    iterations = 5
    timeOnIteration = '1s'
    fork = 2
    profilers = ['gc']
    resultFormat = 'JSON'
    resultsFile = file("$buildDir/reports/jmh/processor-process-event-context.json")
}

ext.genResourcesDir = file("$buildDir/generated-resources")
def sourceDateEpoch = providers.environmentVariable('SOURCE_DATE_EPOCH')
task generateBuildProperties {
    ext.buildPropertiesFile = file("$genResourcesDir/blue/language/build.properties")
    inputs.property('buildVersion', project.version.toString())
    inputs.property('sourceDateEpoch', sourceDateEpoch.orNull ?: '')
    outputs.file(buildPropertiesFile)
    doLast {
        def epoch = sourceDateEpoch.orNull
        def buildInstant
        if (epoch != null && !epoch.trim().isEmpty()) {
            try {
                buildInstant = java.time.Instant.ofEpochSecond(Long.parseLong(epoch.trim()))
            } catch (NumberFormatException exception) {
                throw new GradleException("SOURCE_DATE_EPOCH must be a Unix epoch second", exception)
            }
        } else {
            buildInstant = java.time.Instant.now()
        }
        def buildTimestamp = java.time.format.DateTimeFormatter
                .ofPattern("yyyy-MM-dd'T'HH:mm:ssZ")
                .withZone(java.time.ZoneOffset.UTC)
                .format(buildInstant)
        buildPropertiesFile.text = """\
                |blue-language-java.build.version=$project.version
                |blue-language-java.build.timestamp=${buildTimestamp}
        """.stripMargin().trim()
    }
}
sourceSets.main.output.dir genResourcesDir, builtBy: generateBuildProperties


tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

def sourceReleaseMetadataDir = layout.buildDirectory.dir('generated/source-release-metadata')
def sourceReleaseChecksumFile = layout.buildDirectory.file(
        "release/blue-language-java-${project.version}-source-release.zip.sha256")
tasks.register('generateSourceReleaseMetadata') {
    inputs.file('.cz.toml')
    inputs.property('releaseVersion', project.version.toString())
    outputs.file(sourceReleaseMetadataDir.map { it.file('.cz.toml') })
    doLast {
        def output = sourceReleaseMetadataDir.get().file('.cz.toml').asFile
        output.parentFile.mkdirs()
        output.text = file('.cz.toml').getText('UTF-8').replaceFirst(
                /(?m)^version\s*=\s*"[^"]+"/,
                "version = \"${project.version}\"")
    }
}

tasks.register('sourceReleaseArchive', Zip) {
    group = 'distribution'
    description = 'Creates a reproducible, metadata-free source archive for public release review.'
    archiveBaseName = 'blue-language-java'
    archiveVersion = project.version
    archiveClassifier = 'source-release'
    destinationDirectory = layout.buildDirectory.dir('release')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dependsOn tasks.named('generateSourceReleaseMetadata')
    outputs.file(sourceReleaseChecksumFile)
    eachFile { details ->
        details.permissions { permissions ->
            permissions.unix(details.path.endsWith('/gradlew') || details.path.endsWith('.sh')
                    ? 0755
                    : 0644)
        }
    }

    into("blue-language-java-${project.version}") {
        from(rootDir) {
            include 'CHANGELOG.md'
            include 'LICENSE*'
            include 'README*'
            include 'build.gradle'
            include 'settings.gradle*'
            include 'gradle.properties'
            include 'gradlew'
            include 'gradlew.bat'
            include 'gradle/**'
            include '.github/**'
            include 'docs/**'
            include 'src/**'
            include 'tools/**'

            exclude '**/.DS_Store'
            exclude '**/._*'
            exclude '**/*.jfr'
            exclude '**/*.hprof'
            exclude '**/*.heapdump'
            exclude '**/*.db'
            exclude '**/*.sqlite*'
            exclude '**/node_modules/**'
            exclude '**/.gradle/**'
            exclude '**/build/**'
            exclude '**/*.zip'
            exclude '**/*.tar'
            exclude '**/*.tar.gz'
            exclude '**/*.tgz'
        }
        from(sourceReleaseMetadataDir) {
            include '.cz.toml'
        }
    }

    doLast {
        def archive = archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = digest.digest().collect {
            String.format('%02x', ((byte) it) & 0xff)
        }.join()
        def checksum = sourceReleaseChecksumFile.get().asFile
        checksum.parentFile.mkdirs()
        checksum.setText("${hash}  ${archive.name}\n", 'UTF-8')
    }
}

def sourceReleaseArchiveTask = tasks.named('sourceReleaseArchive', Zip)
tasks.register('verifySourceReleaseArchive') {
    group = 'verification'
    description = 'Checks the source release archive for required files and local-only debris.'
    dependsOn sourceReleaseArchiveTask
    inputs.file(sourceReleaseArchiveTask.flatMap { it.archiveFile })
    doLast {
        def archive = sourceReleaseArchiveTask.get().archiveFile.get().asFile
        def names = []
        archive.withInputStream { input ->
            def zip = new java.util.zip.ZipInputStream(input)
            try {
                def entry = zip.getNextEntry()
                while (entry != null) {
                    names.add(entry.name)
                    zip.closeEntry()
                    entry = zip.getNextEntry()
                }
            } finally {
                zip.close()
            }
        }
        def forbidden = names.findAll { name ->
            name.contains('__MACOSX/')
                    || name.endsWith('/.DS_Store')
                    || name.contains('/._')
                    || name.contains('/build/')
                    || name.contains('/docs/performance/')
                    || name.endsWith('/Archive.zip')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Source release archive contains forbidden entries: "
                    + forbidden.take(20))
        }
        def root = "blue-language-java-${project.version}/".toString()
        def required = [
                root + '.cz.toml',
                root + 'build.gradle',
                root + 'settings.gradle.kts',
                root + 'README.md',
                root + 'src/main/java/blue/language/Blue.java'
        ]
        def missing = required.findAll { requiredName -> !names.contains(requiredName) }
        if (!missing.isEmpty()) {
            throw new GradleException("Source release archive is missing required entries: "
                    + missing)
        }
    }
}

tasks.register('rcVerify') {
    group = 'verification'
    description = 'Runs the local blue-language-java release-candidate verification gates.'
    dependsOn tasks.named('check')
    dependsOn tasks.named('identityDifferentialTest')
    dependsOn tasks.named('patchSequenceDifferentialTest')
    dependsOn tasks.named('memoryIntegrationTest')
    dependsOn tasks.named('cacheLifecycleTest')
    dependsOn tasks.named('verifySourceReleaseArchive')
}

publishing {
  publications {
      maven(MavenPublication) {
          groupId = "blue.language"
          artifactId = 'blue-language-java'

          from components.java

          pom {
              name = 'Blue Language Java Library'
              description = 'Java client library for Blue Language'
              url = 'https://timeline.blue'
              licenses {
                  license {
                      name = 'MIT license'
                      url = 'https://github.com/bluecontract/blue-language-java/blob/master/LICENSE'
                  }
              }
              developers {
                  developer {
                      name = 'Blue'
                      email = 'devsupport@timeline.blue'
                  }
              }
              scm {
                  url = 'https://github.com/bluecontract/blue-language-java.git'
                  connection = 'scm:git:git@github.com:bluecontract/blue-language-java.git'
                  developerConnection = 'scm:git:git@github.com:bluecontract/blue-language-java.git'
              }
          }
      }
  }

  repositories {
      maven {
          url = layout.buildDirectory.dir('staging-deploy')
      }
      if (!System.getenv('CI')) {
        maven {
            name = 'local'
            url = uri('file:///' + new File(System.getProperty("user.home"), ".m2/repository").absolutePath)
        }
      }
  }
}

if (System.getenv('CI')) {
    jreleaser {
        signing {
            active = 'ALWAYS'
            armored = true
        }
        project {
            description = 'Java client library for Blue Language'
            copyright = '© 2024 Blue Company. Licensed under the MIT License'
        }
        if (isReleaseCandidate) {
            release {
                github {
                    // The RC workflow creates, pushes, and verifies the annotated
                    // tag before upload. Stable releases retain JReleaser defaults.
                    skipTag = true
                    prerelease.enabled = true
                    makeLatest = 'false'
                }
            }
        }

        deploy {
            maven {
            mavenCentral {
                sonatype {
                active = 'ALWAYS'
                url = 'https://central.sonatype.com/api/v1/publisher'
                applyMavenCentralRules = true
                snapshotSupported = true
                stagingRepository('build/staging-deploy')
                }
            }
            }
        }
    }
}

def determineProjectVersion() {
    def tomlFile = file('.cz.toml')
    if (tomlFile.exists()) {
        def toml = new groovy.toml.TomlSlurper().parse(tomlFile)
        return toml.tool.commitizen.version + (!System.getenv('CI') ? '-SNAPSHOT' : '')
    } else {
        throw new GradleException(".cz.toml file not found")
    }
}
