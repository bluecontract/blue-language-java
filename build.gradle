buildscript {
    dependencies {
        classpath 'org.apache.groovy:groovy-toml:4.0.22'
    }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.24.0'
    id 'me.champeau.jmh' version '0.7.3'
}

group = "blue.language"
version = project.findProperty('releaseVersion') ?: determineProjectVersion()

def releaseChannel = System.getenv('BLUE_RELEASE_CHANNEL')
if (releaseChannel != null && !['rc', 'stable'].contains(releaseChannel)) {
    throw new GradleException("BLUE_RELEASE_CHANNEL must be either 'rc' or 'stable'")
}
def releaseVersion = project.version.toString()
if (releaseChannel == 'rc' && !(releaseVersion ==~ /\d+\.\d+\.\d+-rc\.\d+/)) {
    throw new GradleException(
            "BLUE_RELEASE_CHANNEL=rc requires an x.y.z-rc.n version, found '${releaseVersion}'")
}
if (releaseChannel == 'stable' && !(releaseVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException(
            "BLUE_RELEASE_CHANNEL=stable requires an x.y.z version, found '${releaseVersion}'")
}
def isReleaseCandidate = releaseChannel == 'rc'

base {
    archivesName = "blue-language-java"
}

repositories {
    if (!System.getenv('CI')) {
        mavenLocal()
    }
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def sourceDateEpochEnvironment = providers.environmentVariable('SOURCE_DATE_EPOCH')
def effectiveSourceDateEpoch = sourceDateEpochEnvironment.map { value ->
    def normalized = value.trim()
    normalized.isEmpty() ? '0' : normalized
}.orElse('0')
def sourceDateEpochOrigin = sourceDateEpochEnvironment.map { value ->
    value.trim().isEmpty() ? 'deterministic-fallback' : 'environment'
}.orElse('deterministic-fallback')
def parseSourceDateEpoch = { String value ->
    try {
        java.time.Instant.ofEpochSecond(Long.parseLong(value))
    } catch (Exception exception) {
        throw new GradleException(
                'SOURCE_DATE_EPOCH must be a valid Unix epoch second',
                exception)
    }
}
def formatBuildTimestamp = { java.time.Instant instant ->
    java.time.format.DateTimeFormatter
            .ofPattern("yyyy-MM-dd'T'HH:mm:ssZ")
            .withZone(java.time.ZoneOffset.UTC)
            .format(instant)
}
def sha256IdentityOf = { File artifact ->
    if (!artifact.isFile()) {
        throw new GradleException(
                "Required artifact does not exist: ${artifact}")
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    'sha256:' + digest.digest().collect {
        String.format('%02x', ((byte) it) & 0xff)
    }.join()
}

def releaseEvidenceSourceInputs = fileTree(rootDir) {
    include '.cz.toml'
    include 'CHANGELOG.md'
    include 'LICENSE*'
    include 'README*'
    include 'build.gradle'
    include 'settings.gradle*'
    include 'gradle.properties'
    include 'gradlew'
    include 'gradlew.bat'
    include 'gradle/**'
    include 'api/**'
    include '.github/**'
    include 'docs/**'
    include 'src/**'
    include 'tools/**'

    exclude '**/.DS_Store'
    exclude '**/._*'
    exclude '**/*.jfr'
    exclude '**/*.hprof'
    exclude '**/*.heapdump'
    exclude '**/*.db'
    exclude '**/*.sqlite*'
    exclude '**/node_modules/**'
    exclude '**/__pycache__/**'
    exclude '**/*.pyc'
    exclude '**/*.pyo'
    exclude '**/.gradle/**'
    exclude '**/build/**'
    exclude '**/*.zip'
    exclude '**/*.tar'
    exclude '**/*.tar.gz'
    exclude '**/*.tgz'
}
def releaseEvidenceSourceSnapshot = {
    def sourceFiles = releaseEvidenceSourceInputs.files.findAll {
        it.isFile()
    }.sort { left, right ->
        project.relativePath(left) <=> project.relativePath(right)
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    sourceFiles.each { sourceFile ->
        def relativePath = project.relativePath(sourceFile)
                .replace(File.separatorChar, '/' as char)
        def record = relativePath + '\u0000' +
                sha256IdentityOf(sourceFile) + '\n'
        digest.update(record.getBytes(
                java.nio.charset.StandardCharsets.UTF_8))
    }
    [
            identity: 'sha256:' + digest.digest().collect {
                String.format('%02x', ((byte) it) & 0xff)
            }.join(),
            fileCount: sourceFiles.size()
    ]
}
def releaseEvidenceSourceCommit = providers.exec {
    workingDir rootDir
    commandLine 'git', 'rev-parse', '--verify', 'HEAD^{commit}'
}.standardOutput.asText.map {
    it.trim()
}
def cleanSourceInputEvidenceSchema =
        'blue-language-java-clean-source-input/1.0'
def cleanBuildEvidenceSchema =
        'blue-language-java-clean-build/1.0'
def cleanBuildEvidenceKind = 'successful-clean-build-marker'
def cleanTaskPath = ':clean'
def buildTaskPath = ':build'
def cleanSourceInputEvidenceFile = layout.buildDirectory.file(
        'reports/release-evidence/clean-source-input.json')
def cleanBuildEvidenceFile = layout.buildDirectory.file(
        'reports/release-evidence/clean-build.json')
tasks.named('clean') {
    doLast {
        def sourceSnapshot = releaseEvidenceSourceSnapshot()
        def evidence = [
                schema             : cleanSourceInputEvidenceSchema,
                cleanTask          : cleanTaskPath,
                sourceCommit       : releaseEvidenceSourceCommit.get(),
                sourceInputIdentity: sourceSnapshot.identity,
                sourceFileCount    : sourceSnapshot.fileCount,
                sourceDateEpoch    : effectiveSourceDateEpoch.get(),
                excludedTasks      :
                        new ArrayList<>(
                                gradle.startParameter
                                        .excludedTaskNames).sort(),
                invocationTasks    :
                        new ArrayList<>(gradle.startParameter.taskNames)
        ]
        def output = cleanSourceInputEvidenceFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(evidence)) + '\n',
                'UTF-8')
    }
}
tasks.named('build') {
    mustRunAfter tasks.named('clean')
    doLast {
        def output = cleanBuildEvidenceFile.get().asFile
        delete(output)
        def excludedTasks =
                new ArrayList<>(
                        gradle.startParameter
                                .excludedTaskNames).sort()
        if (!gradle.taskGraph.hasTask(tasks.named('clean').get())) {
            return
        }
        if (!excludedTasks.isEmpty()) {
            return
        }

        def cleanInput = cleanSourceInputEvidenceFile.get().asFile
        if (!cleanInput.isFile()) {
            return
        }

        try {
            def cleanMarker = new groovy.json.JsonSlurper()
                    .parse(cleanInput)
            def sourceSnapshot = releaseEvidenceSourceSnapshot()
            def sourceCommit = releaseEvidenceSourceCommit.get()
            if (cleanMarker.schema
                    != cleanSourceInputEvidenceSchema
                    || cleanMarker.cleanTask != cleanTaskPath
                    || cleanMarker.sourceCommit != sourceCommit
                    || cleanMarker.sourceInputIdentity
                    != sourceSnapshot.identity
                    || cleanMarker.sourceFileCount
                    != sourceSnapshot.fileCount
                    || cleanMarker.sourceDateEpoch
                    != effectiveSourceDateEpoch.get()
                    || cleanMarker.excludedTasks != excludedTasks) {
                return
            }

            def evidence = [
                    schema             : cleanBuildEvidenceSchema,
                    cleanTask          : cleanTaskPath,
                    buildTask          : buildTaskPath,
                    sourceCommit       : sourceCommit,
                    sourceInputIdentity: sourceSnapshot.identity,
                    sourceFileCount    : sourceSnapshot.fileCount,
                    sourceDateEpoch    : effectiveSourceDateEpoch.get(),
                    excludedTasks      : excludedTasks,
                    invocationTasks    :
                            new ArrayList<>(
                                    gradle.startParameter.taskNames)
            ]
            output.parentFile.mkdirs()
            output.setText(
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(evidence)) + '\n',
                    'UTF-8')
        } catch (Exception ignored) {
            // Absence of completion evidence keeps the release gate red.
        }
    }
}

ext.genResourcesDir = file("$buildDir/generated-resources")
tasks.register('generateBuildProperties') {
    ext.buildPropertiesFile = file(
            "$genResourcesDir/blue/language/build.properties")
    inputs.property('buildVersion', project.version.toString())
    inputs.property('sourceDateEpoch', effectiveSourceDateEpoch)
    outputs.file(buildPropertiesFile)
    doLast {
        def buildTimestamp = formatBuildTimestamp(
                parseSourceDateEpoch(effectiveSourceDateEpoch.get()))
        buildPropertiesFile.parentFile.mkdirs()
        buildPropertiesFile.setText("""\
                |blue-language-java.build.version=$project.version
                |blue-language-java.build.timestamp=${buildTimestamp}
        """.stripMargin().trim(), 'UTF-8')
    }
}
