id: terminationDirectWriteMalformedContractsFallbackOrTerminationError
category: Termination
operation: processDocument
processorCapabilities:
  - blue-contracts-fixture-scripted-runtime-v1
initialDocument:
  contracts: malformed-scalar-contracts-container
event:
  kind: force-root-fatal
mockRuntime:
  forcedFatal:
    scope: /
    reason: malformed contracts prevents ordinary termination write
expectedStatus: runtime-fatal
expectedErrorCategories: [TerminationError]
expectedTerminationFallback:
  maxAttempts: 1
  targetPath: /contracts
expectedDocumentPaths:
  /contracts/terminated/cause:
    value: fatal
assertions:
  - If the fallback also fails, the conformance result reports TerminationError instead of looping.
