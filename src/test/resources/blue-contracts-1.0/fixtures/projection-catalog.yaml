- path: result.document.contracts.checkpoint.entries.in.subject
  type: scalar-or-node
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.document.contracts.checkpoint.entries.old
  type: value
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.document.contracts.embedded.paths
  type: sequence-or-value
  definition: Exact resulting Process Embedded paths value.
- path: result.document.contracts.h2
  type: value
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.document.contracts.initialized
  type: value
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.document.contracts.old
  type: value
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.document.contracts.terminated.reason
  type: scalar-or-node
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.document.h2Ran
  type: value
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.document.large
  type: value
  definition: Exact large-node reference retained in the resulting Root without semantic materialization.
- path: result.document.postInitRan
  type: value
  definition: Exact value selected from the resulting Root at the suffix path.
- path: result.events
  type: sequence-or-value
  definition: Out-of-band ordered sequence of exact events emitted by Root only.
- path: result.status
  type: scalar-or-node
  definition: One status from Contracts §12.1.
- path: result.totalGas
  type: integer
  definition: Weighted sum of admitted canonical named trace entries.
- path: result.{status,document,events,totalGas}
  type: value
  definition: Ordered object projection of the four public result fields.
- path: retry.trace
  type: sequence-or-value
  definition: Canonical trace of the fixture retry attempt.
- path: runtime.recursiveSizeCounterPresent
  type: boolean
  definition: False when no recursive payload-size counter exists in the generic runtime ledger.
- path: runtime.referenceStateObservable
  type: boolean
  definition: False when the registered portable runtime cannot observe reference/materialization state.
- path: trace.acceptedChannelSnapshot.usedAfterInitialization
  type: value
  definition: Deterministic derived conformance projection defined by its final path component and normative processor phase.
- path: trace.checkpointCleanupKeys
