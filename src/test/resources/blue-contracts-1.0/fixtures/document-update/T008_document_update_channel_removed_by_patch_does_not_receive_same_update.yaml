id: T008_document_update_channel_removed_by_patch_does_not_receive_same_update
category: DocumentUpdate
operation: processDocument
processorCapabilities:
  - blue-contracts-fixture-scripted-runtime-v1
initialDocument:
  contracts:
    channel:
      type:
        blueId: 9XJaukZBmGUkFJ5TD3mrEnj98A6UfXXhzXGtwTJapmZi
    docUpdate:
      type:
        blueId: "Ac9LC5T7pHVa1TtkhMBjBRtxecShzvbe7ugUdXT1Mu2o"
      path: /contracts/docUpdate
    removedChannelHandler:
      channel: docUpdate
      type:
        blueId: HvDTdkzXnW9fRL7NrifNu63TMdQbXUcyihfiPy4CARw4
      patches:
        - op: replace
          path: /removedChannelSawRemoval
          val:
            value: true
    patcher:
      channel: channel
      type:
        blueId: HvDTdkzXnW9fRL7NrifNu63TMdQbXUcyihfiPy4CARw4
      patches:
        - op: remove
          path: /contracts/docUpdate
        - op: replace
          path: /watched
          val:
            value: changed
event:
  kind: document-update
expectedCapabilityFailure: false
expectedTotalGasMin: 1
expectedDocumentPaths:
  /watched:
    value: changed
expectedAbsentDocumentPaths:
  - /removedChannelSawRemoval
  - /contracts/docUpdate
