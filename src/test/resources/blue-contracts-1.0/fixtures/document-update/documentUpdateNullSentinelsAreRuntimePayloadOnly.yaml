id: documentUpdateNullSentinelsAreRuntimePayloadOnly
category: DocumentUpdate
operation: processDocument
processorCapabilities:
  - blue-contracts-fixture-scripted-runtime-v1
initialDocument:
  contracts:
    incoming:
      type:
        blueId: C37UoAfTNUnoxkB2CdEE7BfHJwYqTNiWzQb5xuRMkBzm
    patcher:
      type:
        blueId: 2TwRC3EdLXk4gqwyyVWy52h5BQ5ntrkmpcrhrTxsGAs1
      channel: incoming
    watchAdded:
      type:
        blueId: Ac9LC5T7pHVa1TtkhMBjBRtxecShzvbe7ugUdXT1Mu2o
      path: /added
event:
  kind: add-node
mockRuntime:
  channels:
    - contract: /contracts/incoming
      calls:
        - when:
            event:
              kind: add-node
          accepted: true
          payload:
            kind: add-node
  handlers:
    - contract: /contracts/patcher
      calls:
        - when:
            channelKey: incoming
          result:
            patches:
              - op: add
                path: /added
                val: created
expectedStatus: success
expectedDocumentPaths:
  /added:
    value: created
expectedDocumentUpdates:
  - path: /added
    before: null
    after:
      value: created
assertions:
  - before null is a delivered runtime absence sentinel, not BlueId-preserved content.
