id: T033_embedded_rereads_paths_after_each_child
category: Embedded
operation: processDocument
processorCapabilities:
  - blue-contracts-fixture-scripted-runtime-v1
description: >
  Stable embedded path list re-read smoke fixture. This fixture proves ordinary
  per-child re-read behavior with unchanged paths; dynamic mutation of
  contracts/embedded.paths is covered by
  T001_dynamic_embedded_paths_mutation_allowed_only_for_paths.
initialDocument:
  first:
    contracts:
      childChannel:
        type:
          blueId: "9XJaukZBmGUkFJ5TD3mrEnj98A6UfXXhzXGtwTJapmZi"
      firstHandler:
        channel: childChannel
        type:
          blueId: "HvDTdkzXnW9fRL7NrifNu63TMdQbXUcyihfiPy4CARw4"
        patches:
          - op: replace
            path: /first/firstRan
            val:
              value: true
  second:
    contracts:
      secondChannel:
        type:
          blueId: "9XJaukZBmGUkFJ5TD3mrEnj98A6UfXXhzXGtwTJapmZi"
      secondHandler:
        channel: secondChannel
        type:
          blueId: "HvDTdkzXnW9fRL7NrifNu63TMdQbXUcyihfiPy4CARw4"
        patches:
          - op: replace
            path: /second/secondRan
            val:
              value: true
  contracts:
    embedded:
      type:
        blueId: "8FVc8MPz6DcTMgcY3RXU6EBpGa9arWPJ141K2H86yi8Q"
      paths:
        - /first
        - /second
event:
  kind: reread
expectedCapabilityFailure: false
expectedDocumentPaths:
  /first/firstRan:
    value: true
  /second/secondRan:
    value: true
