id: T006_patch_cascade_after_each_patch
category: Patching
operation: processDocument
processorCapabilities:
  - blue-contracts-fixture-scripted-runtime-v1
initialDocument:
  contracts:
    channel:
      type:
        blueId: 9XJaukZBmGUkFJ5TD3mrEnj98A6UfXXhzXGtwTJapmZi
    docUpdate:
      type:
        blueId: "Ac9LC5T7pHVa1TtkhMBjBRtxecShzvbe7ugUdXT1Mu2o"
      path: /a
    afterFirst:
      channel: docUpdate
      type:
        blueId: HvDTdkzXnW9fRL7NrifNu63TMdQbXUcyihfiPy4CARw4
      patches:
        - op: replace
          path: /afterFirstCascade
          val:
            value: true
        - op: replace
          path: /orderLog
          val:
            items:
              - value: patch-1
              - value: cascade-1
    patcher:
      channel: channel
      type:
        blueId: HvDTdkzXnW9fRL7NrifNu63TMdQbXUcyihfiPy4CARw4
      patches:
        - op: replace
          path: /a
          val:
            value: one
        - op: remove
          path: /afterFirstCascade
        - op: replace
          path: /orderLog
          val:
            items:
              - value: patch-1
              - value: cascade-1
              - value: patch-2
event:
  kind: patch
expectedCapabilityFailure: false
expectedTotalGasMin: 1
expectedDocumentPaths:
  /a:
    value: one
expectedDocumentPathValues:
  - path: /orderLog
    value:
      items:
        - value: patch-1
        - value: cascade-1
        - value: patch-2
expectedAbsentDocumentPaths:
  - /afterFirstCascade
  - /contracts/terminated
