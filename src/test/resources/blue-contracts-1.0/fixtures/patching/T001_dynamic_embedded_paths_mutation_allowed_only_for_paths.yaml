id: T001_dynamic_embedded_paths_mutation_allowed_only_for_paths
category: Patching
operation: processDocument
processorCapabilities:
  - blue-contracts-fixture-scripted-runtime-v1
initialDocument:
  contracts:
    embedded:
      type:
        blueId: 8FVc8MPz6DcTMgcY3RXU6EBpGa9arWPJ141K2H86yi8Q
      paths:
        - /a
        - /b
    watchAProcessed:
      type:
        blueId: Ac9LC5T7pHVa1TtkhMBjBRtxecShzvbe7ugUdXT1Mu2o
      path: /a/processed
    rewriteEmbeddedPaths:
      type:
        blueId: 2TwRC3EdLXk4gqwyyVWy52h5BQ5ntrkmpcrhrTxsGAs1
      channel: watchAProcessed
  a:
    contracts:
      incoming:
        type:
          blueId: C37UoAfTNUnoxkB2CdEE7BfHJwYqTNiWzQb5xuRMkBzm
      markA:
        type:
          blueId: 2TwRC3EdLXk4gqwyyVWy52h5BQ5ntrkmpcrhrTxsGAs1
        channel: incoming
  b:
    contracts:
      incoming:
        type:
          blueId: C37UoAfTNUnoxkB2CdEE7BfHJwYqTNiWzQb5xuRMkBzm
      markB:
        type:
          blueId: 2TwRC3EdLXk4gqwyyVWy52h5BQ5ntrkmpcrhrTxsGAs1
        channel: incoming
  c:
    contracts:
      incoming:
        type:
          blueId: C37UoAfTNUnoxkB2CdEE7BfHJwYqTNiWzQb5xuRMkBzm
      markC:
        type:
          blueId: 2TwRC3EdLXk4gqwyyVWy52h5BQ5ntrkmpcrhrTxsGAs1
        channel: incoming
event:
  kind: embedded-reread
mockRuntime:
  channels:
    - contract: /a/contracts/incoming
      calls:
        - when:
            event:
              kind: embedded-reread
          accepted: true
          payload:
            child: /a
    - contract: /b/contracts/incoming
      calls:
        - when:
            event:
              kind: embedded-reread
          accepted: true
          payload:
            child: /b
    - contract: /c/contracts/incoming
      calls:
        - when:
            event:
              kind: embedded-reread
          accepted: true
          payload:
            child: /c
  handlers:
    - contract: /a/contracts/markA
      calls:
        - when:
            channelKey: incoming
            payload:
              child: /a
          result:
            patches:
              - op: replace
                path: /a/processed
                val: true
    - contract: /contracts/rewriteEmbeddedPaths
      calls:
        - when:
            channelKey: watchAProcessed
            payload:
              path: /a/processed
          result:
            patches:
              - op: replace
                path: /contracts/embedded/paths
                val:
                  items:
                    - /a
                    - /c
    - contract: /b/contracts/markB
      calls:
        - when:
            channelKey: incoming
            payload:
              child: /b
          result:
            patches:
              - op: replace
                path: /b/processed
                val: true
    - contract: /c/contracts/markC
      calls:
        - when:
            channelKey: incoming
            payload:
              child: /c
          result:
            patches:
              - op: replace
                path: /c/processed
                val: true
expectedStatus: success
expectedEmbeddedDeliveryOrder:
  - /a
  - /c
expectedDocumentUpdateOrder:
  - /a/processed
  - /contracts/embedded/paths
  - /c/processed
expectedDocumentPaths:
  /a/processed:
    value: true
  /c/processed:
    value: true
expectedAbsentDocumentPaths:
  - /b/processed
expectedDocumentPathValues:
  - path: /contracts/embedded/paths
    value:
      items:
        - value: /a
        - value: /c
assertions:
  - /a is processed during root Phase 1 before the root external phase.
  - /a/processed triggers a root Document Update handler during root Phase 1.
  - The root handler writes only /contracts/embedded/paths under the narrow reserved-key exception.
  - Root Phase 1 re-reads embedded paths after /a, skips already-processed /a, and processes /c.
  - /b is not processed after the path list changes.
