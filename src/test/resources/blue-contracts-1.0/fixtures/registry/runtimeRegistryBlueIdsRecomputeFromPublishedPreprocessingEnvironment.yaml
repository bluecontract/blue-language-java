id: runtimeRegistryBlueIdsRecomputeFromPublishedPreprocessingEnvironment
category: Registry
operation: runtimeRegistryPreprocessingEnvironmentReproducible
registryKind: Blue Contracts runtime type registry
preprocessingEnvironment:
  coreRegistry: blue-language-1.0
  runtimeRegistry: blue-contracts-1.0
assertions:
  - The registry source nodes can be preprocessed using only the published core and runtime registry bindings.
  - Every preprocessed runtime registry node hashes to the BlueId published in the runtime registry manifest.
  - Implementations do not rely on implementation-local alias maps to reproduce runtime registry BlueIds.
