id: checkpointEventIdDoesNotOverrideDefaultIdentity
category: Checkpoint
operation: processDocument
processorCapabilities:
  - blue-contracts-fixture-scripted-runtime-v1
initialDocument:
  contracts:
    incoming:
      type:
        blueId: C37UoAfTNUnoxkB2CdEE7BfHJwYqTNiWzQb5xuRMkBzm
    checkpoint:
      type:
        blueId: 9GEC24YbFG9hj4banjYh2oEnDpAob1wAPmhjuykJp8T1
      lastEvents:
        incoming:
          eventId: same
          amount: 10
    handler:
      type:
        blueId: 2TwRC3EdLXk4gqwyyVWy52h5BQ5ntrkmpcrhrTxsGAs1
      channel: incoming
event:
  eventId: same
  amount: 11
mockRuntime:
  channels:
    - contract: /contracts/incoming
      checkpointIdentityMode: contentBlueId
      calls:
        - when:
            event:
              eventId: same
              amount: 11
          accepted: true
          payload:
            eventId: same
            amount: 11
  handlers:
    - contract: /contracts/handler
      calls:
        - when:
            channelKey: incoming
          result:
            patches:
              - op: replace
                path: /handled
                val: true
expectedStatus: success
expectedDocumentPaths:
  /handled:
    value: true
  /contracts/checkpoint/lastEvents/incoming/amount:
    value: 11
assertions:
  - eventId has no special meaning under default contentBlueId identity.
