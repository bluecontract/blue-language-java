id: R_recursive_optional_branch_defers_required_descendants
category: Resolution
operation: scenario
description: required descendants of a recursive optional branch activate only when that branch has instance content
provider:
- cyclicSet:
  - name: Optional Recursive Holder
    next:
      type:
        blueId: this#1
  - name: Optional Recursive Branch
    previous:
      type:
        blueId: this#0
    actor:
      type: Text
      schema:
        required: true
  expectedMemberBlueIds:
    Optional Recursive Holder: 7NaCC3YttLEvL9xtH1LtYDSFyj5ofnHPgZX67Rr7gpLi#1
    Optional Recursive Branch: 7NaCC3YttLEvL9xtH1LtYDSFyj5ofnHPgZX67Rr7gpLi#0
steps:
- action: resolve
  source:
    type:
      blueId: 7NaCC3YttLEvL9xtH1LtYDSFyj5ofnHPgZX67Rr7gpLi#1
  expectedResolvedPaths:
  - path: /next/previous/type
    expectedNode:
      blueId: 7NaCC3YttLEvL9xtH1LtYDSFyj5ofnHPgZX67Rr7gpLi#1
- action: resolve
  source:
    type:
      blueId: 7NaCC3YttLEvL9xtH1LtYDSFyj5ofnHPgZX67Rr7gpLi#1
    next:
      actor: Ada
  expectedResolvedPaths:
  - path: /next/actor/value
    expectedNode: {value: Ada}
- action: resolve
  expectError: true
  expectedErrorCategory: SchemaViolation
  source:
    type:
      blueId: 7NaCC3YttLEvL9xtH1LtYDSFyj5ofnHPgZX67Rr7gpLi#1
    next:
      note: supplied
