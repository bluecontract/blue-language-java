id: R_recursive_structural_instance_validation
category: Resolution
operation: scenario
description: finite instance content at a recursive structural field receives the inherited type and schema
provider:
- cyclicSet:
  - name: Recursive A
    next:
      type:
        blueId: this#1
    code:
      type: Text
      schema:
        maxLength: 4
  - name: Recursive B
    previous:
      type:
        blueId: this#0
  expectedMemberBlueIds:
    Recursive A: Re2s3J9yfF8TJ1pzpp8QqEQaafjECQceZU2D6Y2SFaM#0
    Recursive B: Re2s3J9yfF8TJ1pzpp8QqEQaafjECQceZU2D6Y2SFaM#1
steps:
- action: resolve
  source:
    type:
      blueId: Re2s3J9yfF8TJ1pzpp8QqEQaafjECQceZU2D6Y2SFaM#0
    next:
      previous:
        code: GOOD
  expectedResolvedPaths:
  - path: /next/previous/code/value
    expectedNode: {value: GOOD}
- action: resolve
  expectError: true
  expectedErrorCategory: SchemaViolation
  source:
    type:
      blueId: Re2s3J9yfF8TJ1pzpp8QqEQaafjECQceZU2D6Y2SFaM#0
    next:
      previous:
        code: TOO_LONG
