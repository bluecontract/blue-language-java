                'managedTransitionReceiptOutputReport'
        ]
        def missing = requiredProperties.findAll { !project.hasProperty(it) }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Missing required managed-transition receipt export properties: ${missing.join(', ')}")
        }
        args = requiredProperties.collect { project.property(it).toString() }
    }
}
