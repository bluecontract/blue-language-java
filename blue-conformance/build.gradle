plugins {
    id 'blue.java8-library-conventions'
    id 'blue.reproducible-archives'
    id 'blue.api-baseline'
    id 'blue.conformance-package'
    id 'blue.jreleaser-publishing'
}

description = 'Executable Language and Contracts conformance fixtures and release reports.'

dependencies {
    api project(':blue-language-model')
    api project(':blue-language-core')
    api project(':blue-language-mapping')
    api project(':blue-contracts-core')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    implementation 'org.yaml:snakeyaml:2.0'
}

tasks.register('historicalRepresentationConformanceTest', JavaExec) {
    group = 'verification'
    description = 'Runs the proposed authenticated historical-representation sequence.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'blue.language.conformance.contracts.representation.HistoricalRepresentationConformanceCli'
    args layout.buildDirectory.file('reports/conformance/historical-representation.json').get().asFile.absolutePath
    inputs.files(fileTree('src/main/resources/blue-contracts-representation-1.0'))
    outputs.file(layout.buildDirectory.file('reports/conformance/historical-representation.json'))
}

tasks.named('check') { dependsOn tasks.named('historicalRepresentationConformanceTest') }
tasks.named('releaseConformanceTest') { dependsOn tasks.named('historicalRepresentationConformanceTest') }

// These are checker-sensitivity tests; real rooted runtime acceptance is separate.
def rootedCheckerTasks = ['Harness', 'Iteration2', 'CheckerHardening', 'CheckpointIdentity', 'ResourceAdmissionBindings', 'ResourceFollowupBindings', 'ReconnectIdentityBindings'].collect { suffix ->
    def scripts = [Harness: 'test_harness.py', Iteration2: 'test_iteration2.py',
                   CheckerHardening: 'test_checker_hardening.py',
                   CheckpointIdentity: 'test_checkpoint_identity.py',
                   ResourceAdmissionBindings: 'test_resource_admission_bindings.py',
                   ResourceFollowupBindings: 'test_resource_followup_bindings.py',
                   ReconnectIdentityBindings: 'test_reconnect_identity_bindings.py']
    tasks.register("rooted${suffix}Test", Exec) {
        group = 'verification'
        description = "Runs the reviewed rooted ${suffix} checker tests (no runtime claim)."
        def root = layout.projectDirectory.dir('src/main/resources/blue-rooted-checkpoint-1.0')
        workingDir root
        commandLine providers.gradleProperty('bluePythonExecutable').getOrElse('python3'),
                '-B', root.file("tools/${scripts[suffix]}").asFile.absolutePath
        inputs.dir(root)
    }
}
tasks.register('rootedCheckerTest') {
    group = 'verification'
    description = 'Verifies the imported rooted checker and its mutation negatives.'
    dependsOn rootedCheckerTasks
}
tasks.named('check') { dependsOn tasks.named('rootedCheckerTest') }
tasks.named('releaseConformanceTest') { dependsOn tasks.named('rootedCheckerTest') }

tasks.register('inactiveRetargetReleaseTransitionTest', Exec) {
    group = 'verification'
    description = 'Verifies the exact inactive-retarget release binding and corruption negatives.'
    def tools = layout.projectDirectory.dir('src/main/tools')
    workingDir tools
    commandLine providers.gradleProperty('bluePythonExecutable').getOrElse('python3'),
            '-B', tools.file('test_inactive_retarget_release_transition.py').asFile.absolutePath
    inputs.dir(tools)
}
tasks.named('check') { dependsOn tasks.named('inactiveRetargetReleaseTransitionTest') }
tasks.named('releaseConformanceTest') { dependsOn tasks.named('inactiveRetargetReleaseTransitionTest') }

