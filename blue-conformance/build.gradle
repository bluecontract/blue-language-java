tasks.register('exportFullLifecycleFixtures', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'blue.language.conformance.contracts.FullLifecycleFixtureExporter'
    outputs.upToDateWhen { false }
    doFirst {
        def requiredProperties = [
                'fullLifecycleSourceRoot',
                'fullLifecyclePackageRoot',
                'fullLifecycleOutputRoot'
        ]
        def missing = requiredProperties.findAll { !project.hasProperty(it) }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Missing required full-lifecycle export properties: ${missing.join(', ')}")
        }
        args = requiredProperties.collect { project.property(it).toString() }
    }
}

