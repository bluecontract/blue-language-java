manifestType: blue-contracts-gas-manifest
schedule: blue-contracts/gas/1.0
specification: Blue Contracts and Processor
specificationVersion: '1.0'
status: normative
unit: gas
maxProcessGas: 100000
traceEntryFields:
- sequence
- namespace
- counter
- quantity
- weight
- subtotal
- documentId
- scopePath
- activationGeneration
- componentGeneration
- contractKey
- logicalPath
- workOccurrenceId
- reason
admissionRule: Admit quantity * weight before the corresponding logical work against both the shared closure ceiling and any
  applicable lower member-local ceiling. If the next charge exceeds either ceiling, omit that charge, report its exact rejected-charge
  evidence, and stop before the work. When both fail with equal remaining allowance, shared-closure precedence applies.
compositionRule: totalGas is the sum of processor, semantic, and registered runtime counter subtotals; one logical unit is
  charged in exactly one owning namespace.
localCeilingAttribution:
  appliesWhen: the canonical trace context contains the locally capped member's documentId
  globalEntries: entries without documentId debit only the shared closure ceiling
  aggregation: units with different documentId attribution are separate deterministic trace entries and are never aggregated
    across members
namespaces:
  processor:
    counterCount: 39
    counters:
      processInvocation: 50
      closureInvocation: 100
      managedDocumentOpened: 10
      managedOccurrenceBindingVerified: 5
      processEmbeddedEdgeExamined: 2
      componentMemberPartitioned: 2
      componentEdgePartitioned: 1
      closureWorkOccurrenceEnqueued: 5
      closureWorkOccurrenceDequeued: 5
      closureExpanded: 20
      componentPartitionChanged: 20
      tentativeComponentFinalization: 20
      cyclicMemberFinalized: 10
      containingReferenceUpdated: 10
      deliverySnapshotEntry: 5
      scopeOpened: 10
      contractHeaderRecognized: 2
      channelCandidateTested: 5
      channelAccepted: 5
      handlerCandidateTested: 5
      handlerCall: 50
      scopeInitialization: 1000
      embeddedPathEntryRead: 1
      embeddedPathSegmentValidated: 1
      pointerSegmentTraversed: 1
      patchBoundaryChecked: 2
      patchAddOrReplace: 20
      patchRemove: 10
      documentUpdateDelivered: 10
      internalEventEnqueued: 20
      internalEventDequeued: 10
      triggeredEventDelivered: 10
      embeddedEventDelivered: 10
      rootEventRecorded: 5
      lifecycleDelivered: 30
      checkpointCompared: 5
      checkpointWritten: 20
      processorMarkerWritten: 20
      terminationRequested: 10
  semantic:
    counterCount: 17
    counters:
      nodeManifestOpened: 1
      objectMemberRead: 1
      listItemRead: 1
      textBlockExamined: 1
      textBlockConstructed: 1
      scalarComparison: 1
      integerLimbOperation: 1
      sortComparison: 1
      typeEdgeFollowed: 1
      schemaPredicateEvaluated: 1
      validationMemberExamined: 1
      validationProofReused: 1
      subtypeCandidateTested: 5
      nodeIdentityEstablished: 1
      objectMemberRebuilt: 1
      listFoldStepRecomputed: 1
      directIdentityHashBlock: 1
formulas:
  textBlocks:
    blockCodePoints: 64
    fullScan: ceil(codePointLength / 64)
    lexicographicComparison: scalarComparison += 1; each operand textBlockExamined += ceil(codePointsRead / 64)
  integerLimbs:
    radix: 2^32
    minimumLimbs: 1
    equalityOrOrdering: L(a) + L(b)
    additionOrSubtraction: max(L(a), L(b)) + 1
    multiplication: L(a) * L(b)
    divisionOrRemainder: L(a) * L(b)
    gcdOrMultipleOf: L(a) * L(b)
    lcm: gcd quantity + multiplication quantity
  sorting:
    algorithm: stable bottom-up merge sort
    initialRunWidth: 1
    mergeOrder: left-to-right
    equalSelection: left
    widthProgression: double after each pass
    comparisonCharges:
    - sortComparison
    - content work required by comparator
  identity:
    everyNewExactNode: nodeIdentityEstablished += 1
    nonListDirectMembers: objectMemberRebuilt += direct helper-map members processed
    directHashBlocks: directIdentityHashBlock += ceil((canonicalDirectIdentityInputUtf8Bytes + 9) / 64)
    transitiveChildren: represented by bounded canonical child BlueId strings before byte counting
    invocationLedger: establishedNewNodeIds starts empty; add an exact BlueId only after its complete admitted identity charge
    exactPatchValueReuse: an already-established exact patch value is not charged again while rebuilding a parent
    acyclicIncrementalOrder: changed/new leaf if not established, then changed direct container, then changed ancestor spine
      bottom-up
    unchangedExactChildren: carried by BlueId and never recursively charged
    eventAdmission: one semantic identity admission per newly constructed exact value before internalEventEnqueued; equal
      later occurrences reuse the exact established value but retain per-occurrence processor work
    cyclicTransitionOwnership: one complete tentative cyclic finalization owns all Language identity work for every member
      in that transition
    cyclicTracePosition: immediately after the identity-changing work occurrence, before its Document Update continuation
      or later Handler effect
  listIdentity:
    fullConstruction: one listFoldStepRecomputed per result element
    verifiedAppend: appended result elements only
    replaceAtIndex: result suffix from changed index
    insertOrRemoveAtIndex: affected result suffix
    directIdentityHashBlock: not additionally charged for fixed list-cons inputs
  validationProofReuse:
    key:
    - nodeBlueId
    - effectiveTypeBlueId
    - effectiveConstraintIdentity
    firstUse: full validation counters
    laterUseInSameInvocation: validationProofReused += 1
    crossInvocationCaches: do not change canonical trace
portableLimits:
  effectiveContractsPerParticipatingScope: 8192
  externalChannelsPerScope: 2048
  handlersBoundToOneDelivery: 4096
  subscriptionKeysPerChannel: 256
  preselectedExternalOccurrencesPerEvent: 1024
  participatingScopesPerEvent: 4096
  processEmbeddedPathsPerScope: 4096
  embeddedDepth: 256
  runtimePointerSegments: 256
  normalizedRuntimePointerUtf8Bytes: 4096
  contractKeyCodePoints: 256
  contractKeyUtf8Bytes: 1024
  directObjectEntriesMaterializedOrRebuilt: 16384
  directListItemsMaterializedOrRebuilt: 16384
  directCanonicalIdentityInputBytes: 1048576
  typeChainEdges: 256
  patchesPerContractExecutionResult: 1024
  eventsPerContractExecutionResult: 1024
  internalEventOccurrencesPerInvocation: 8192
  rootEventsReturned: 4096
  nestedDocumentUpdateCascadeDepth: 256
  runtimeChildLedgerCounterKinds: 256
  directObjectKeyCodePoints: 4096
  directInlineIdentityTextCodePoints: 262144
  managedDocumentsPerClosure: 4096
  processEmbeddedEdgesPerClosure: 16384
  cyclicMembersPerComponent: 128
  cyclicEdgesPerComponent: 1024
  cyclicCanonicalBytesPerComponent: 16777216
  closureGraphChangesPerInvocation: 4096
  closureExpansionsPerInvocation: 4096
  closureWorkOccurrencesPerInvocation: 8192
  closureTentativeFinalizationsPerInvocation: 8192
zeroPortableGas:
- provider lookup and transfer
- provider BlueId verification
- cache operations
- storage page or chunk access
- physical prefetch
- allocation and host copying
- hash-cache lookup
- transport serialization
- subscription-index maintenance and query
- Timeline completeness queries
- database commit and compare-and-swap retry
fixtureRequirements:
- one exact microfixture per named counter
- composite formula fixtures
- gas-exhaustion prefix fixture
- inline/reference trace equivalence
- closure orchestration counter microfixtures
- exact tentative finalization trace fixture
- default-policy cyclic loop fixture
- local-cap versus shared-cap precedence fixture
- changed cyclic-to-acyclic split with exact incremental identity trace and no double charge
- duplicate exact event occurrences with one semantic establishment and distinct occurrence orchestration
cyclicCanonicalBytesDefinition:
  sequence: UTF-8 RFC 8785 canonical encoding of the representation-normalized ordered cyclic limit form
  memberOrder: ascending preliminary member BlueId
  internalReferences: canonical this#n after preliminary-order remapping
  normalization:
  - retain every internal this#n reference and each object/list container on its path
  - retain complete direct literal members named name, description, or value
  - replace every complete non-literal off-path child with its pure exact BlueId reference
  representationInvariant: semantically equal inline and exact-reference child representations produce the same byte sequence
  languageIdentityEffect: none; this is a Contracts accounting projection and the actual Language cyclic input remains unchanged
  counted: once per tentative cyclic component finalization
  excluded:
  - preliminary-member canonical inputs
  - materialized MASTER#index member suffixes
  - proof serialization
  - containing-document reconstruction
identityAlgorithm: sha256 of RFC 8785 canonical JSON encoded as UTF-8 with packageIdentity set to null
packageIdentity: sha256:03219c42eb3696ef8727fe8ae226c8a5eb4a6126859ba744f571d892c409626a
numericWeightsStatus: frozen for Blue Contracts and Processor Specification 1.0
defaultExecutionPolicy:
  defaultGasLimit: 100000
  documentOrHostMayLower: true
  documentOrHostMayRaiseAboveReleaseMaximum: false
  nestedOrMemberLocalCapUsesSharedMeter: true
  wallClockTimeoutIsSemantic: false
