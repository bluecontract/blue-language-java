schema: blue-contracts-fixture/1.0
id: c-evo-17
vectors:
- C-EVO-17
category: emb
description: One transition generalizes away a required Workflow and directly adds exact Process Embedded over existing content.
operation: process
input:
  root:
    child:
      payload: retained
      contracts:
        childChannel:
          type:
