          eventKey: child-only
          accept: true
          checkpointDomain: child-only-v1
    contracts:
      in:
        type:
          blueId: 2hesjWGVbvcJSu6woCUTssU9S7A69ep93UzdgvwosDLt
        order: 0
        subscriptionKey: evolution
        eventKey: evolution
        accept: true
        checkpointDomain: evolution-v1
      requiredWorkflow:
        type:
          blueId: FE68gr14jPkb9RfHbQH1tHGE4YALJbZvgC6CtdHwYheX
        channel: in
        operationId: EVO-UNRELATED-REQUIRED-WORKFLOW
      generalizeAndEmbed:
        type:
          blueId: 6rznQbYVahD1UVqdRXbPy7wF1NV5LYhDyzThEL1znaFw
