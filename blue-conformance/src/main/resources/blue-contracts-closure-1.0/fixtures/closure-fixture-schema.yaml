      expectedInputDocuments:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/commitInputDocument'}
      expectedInputComponents:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/commitInputComponent'}
      inputOccurrenceBindingSetIdentity: {$ref: '#/$defs/sha256Identity'}
      outputGraphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      resultingDocuments:
        type: array
        items: {$ref: '#/$defs/commitDocumentDelta'}
      resultingComponents:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/commitResultComponent'}
      occurrenceBindingSetIdentity: {$ref: '#/$defs/sha256Identity'}
      graphChangesIdentity: {$ref: '#/$defs/sha256Identity'}
      checkpointWritesIdentity: {$ref: '#/$defs/sha256Identity'}
      subscriptionDeltasIdentity: {$ref: '#/$defs/sha256Identity'}
      publicEventsIdentity: {$ref: '#/$defs/sha256Identity'}
      gasTraceIdentity:
        description: Identity of the admitted gas entries after removing only each diagnostic reason field.
        $ref: '#/$defs/sha256Identity'
      blueLanguageSpecificationIdentity: {$ref: '#/$defs/sha256Identity'}
      contractsSpecificationIdentity: {$ref: '#/$defs/sha256Identity'}
      managedDocumentIdentityPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      managedBindingPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      exactNodeProviderDomainIdentity: {$ref: '#/$defs/sha256Identity'}
      externalOrderPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      runtimeRegistryIdentity: {$ref: '#/$defs/sha256Identity'}
      gasManifestIdentity: {$ref: '#/$defs/sha256Identity'}
      portableLimitPolicyIdentity: {$ref: '#/$defs/sha256Identity'}
      cyclicFinalizerIdentity: {$ref: '#/$defs/sha256Identity'}
      cyclicProofVerifierIdentity: {$ref: '#/$defs/sha256Identity'}
  completeExpected:
    type: object
    additionalProperties: false
    required: [attemptOutcome, status, invocationIdentity, inputClosureIdentity, outputClosureIdentity, atomic, workTrace, documentStepTrace, tentativeFinalizations, graphGeneration, resultingDocuments, resultingComponents, occurrenceBindings, occurrenceBindingSetIdentity, graphChanges, graphChangesIdentity, subscriptionDeltas, subscriptionDeltasIdentity, checkpointWrites, checkpointWritesIdentity, publicEvents, publicEventsIdentity, rollbackToInput, totalGas, gasTraceIdentity]
    properties:
      attemptOutcome: {const: Complete}
      status: {enum: [success, no-match, stale, terminated, invalid-processing-document, capability-failure, runtime-fatal, gas-limit-exceeded, portable-limit-exceeded, subscription-surface-invalid]}
      invocationIdentity: {$ref: '#/$defs/sha256Identity'}
      inputClosureIdentity: {$ref: '#/$defs/sha256Identity'}
      outputClosureIdentity: {$ref: '#/$defs/sha256Identity'}
      diagnostic: {type: string}
      atomic: {const: true}
      workTrace: {type: array, items: {$ref: '#/$defs/work'}}
      documentStepTrace: {type: array, items: {$ref: '#/$defs/documentStepEvidence'}}
      rejectedWorkOccurrence: {$ref: '#/$defs/work'}
      rejectedCharge: {$ref: '#/$defs/rejectedCharge'}
      tentativeFinalizations: {type: array, items: {$ref: '#/$defs/finalization'}}
      graphGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      resultingDocuments: {type: array, items: {$ref: '#/$defs/resultingDocument'}}
      resultingComponents: {type: array, minItems: 1, items: {$ref: '#/$defs/resultComponent'}}
      occurrenceBindings: {type: array, items: {$ref: '#/$defs/occurrence'}}
      occurrenceBindingSetIdentity: {$ref: '#/$defs/sha256Identity'}
      graphChanges: {type: array, items: {$ref: '#/$defs/graphChange'}}
      graphChangesIdentity: {$ref: '#/$defs/sha256Identity'}
      subscriptionDeltas: {type: array, items: {$ref: '#/$defs/subscriptionDelta'}}
      subscriptionDeltasIdentity: {$ref: '#/$defs/sha256Identity'}
      checkpointWrites: {type: array, items: {$ref: '#/$defs/checkpointWrite'}}
      checkpointWritesIdentity: {$ref: '#/$defs/sha256Identity'}
      publicEvents: {type: array, items: {$ref: '#/$defs/publicEvent'}}
      publicEventsIdentity: {$ref: '#/$defs/sha256Identity'}
      rollbackToInput: {type: boolean}
      totalGas: {$ref: '#/$defs/nonNegativeSafeInteger'}
      gasTrace: {type: array, items: {$ref: '#/$defs/gasTraceEntry'}}
      gasTraceFile: {type: string, pattern: '^traces/[a-z0-9][a-z0-9-]*-gas\.yaml$'}
      gasTraceIdentity:
        description: Identity of the admitted gas entries after removing only each diagnostic reason field.
        $ref: '#/$defs/sha256Identity'
      platformCommitCompanion: {$ref: '#/$defs/platformCommitCompanion'}
      observations: {type: array, items: {$ref: '#/$defs/observation'}}
    allOf:
    - oneOf:
      - required: [gasTrace]
        not: {required: [gasTraceFile]}
      - required: [gasTraceFile]
        not: {required: [gasTrace]}
    - if:
        properties:
          status: {const: success}
        required: [status]
      then:
        required: [platformCommitCompanion]
        properties:
          rollbackToInput: {const: false}
      else:
        allOf:
        - properties:
            rollbackToInput: {const: true}
        - not: {required: [platformCommitCompanion]}
    - if:
        properties:
          status: {const: gas-limit-exceeded}
        required: [status]
      then:
        required: [rejectedCharge]
      else:
        not:
          anyOf:
          - required: [rejectedCharge]
          - required: [rejectedWorkOccurrence]
    - if:
        required: [rejectedCharge]
        properties:
          rejectedCharge:
            properties:
              owner:
                properties:
                  kind: {const: WORK}
                required: [kind]
            required: [owner]
      then:
        required: [rejectedWorkOccurrence]
      else:
        not: {required: [rejectedWorkOccurrence]}
  needsResourcesExpected:
    type: object
    additionalProperties: false
    required: [attemptOutcome, requiredBlueIds]
    properties:
      attemptOutcome: {const: NeedsResources}
      requiredBlueIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/blueId'}
  expected:
    oneOf:
    - {$ref: '#/$defs/completeExpected'}
    - {$ref: '#/$defs/needsResourcesExpected'}
