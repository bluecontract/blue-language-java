  commitInputDocument:
    type: object
    additionalProperties: false
    required: [documentId, blueId]
    properties:
      documentId: {$ref: '#/$defs/documentId'}
      blueId: {$ref: '#/$defs/blueId'}
  commitInputComponent:
    type: object
    additionalProperties: false
    required: [componentIdentity, componentStateIdentity, componentGeneration, masterBlueId]
    properties:
      componentIdentity: {$ref: '#/$defs/sha256Identity'}
      componentStateIdentity: {$ref: '#/$defs/sha256Identity'}
      componentGeneration: {$ref: '#/$defs/nonNegativeSafeInteger'}
      masterBlueId: {$ref: '#/$defs/nullableBlueId'}
