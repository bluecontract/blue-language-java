          beforeBindingIdentity: {$ref: '#/$defs/sha256Identity'}
          beforeTargetDocumentId: {$ref: '#/$defs/documentId'}
          beforeTargetBlueId: {$ref: '#/$defs/blueId'}
          afterActivationGeneration: {type: 'null'}
          afterOccurrenceIdentity: {type: 'null'}
          afterBindingIdentity: {type: 'null'}
          afterTargetDocumentId: {type: 'null'}
          afterTargetBlueId: {type: 'null'}
    - if:
