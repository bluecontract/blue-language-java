  commitResultComponent:
    type: object
    additionalProperties: false
    required: [componentIdentity, componentStateIdentity, cyclicProofIdentity]
    properties:
      componentIdentity: {$ref: '#/$defs/sha256Identity'}
      componentStateIdentity: {$ref: '#/$defs/sha256Identity'}
      cyclicProofIdentity: {$ref: '#/$defs/nullableSha256Identity'}
  platformCommitCompanion:
    type: object
    additionalProperties: false
    required: [companionIdentity, invocationIdentity, inputClosureIdentity, outputClosureIdentity, expectedInputGraphGeneration, expectedInputDocuments, expectedInputComponents, inputOccurrenceBindingSetIdentity, outputGraphGeneration, resultingDocuments, resultingComponents, occurrenceBindingSetIdentity, graphChangesIdentity, checkpointWritesIdentity, subscriptionDeltasIdentity, publicEventsIdentity, gasTraceIdentity, blueLanguageSpecificationIdentity, contractsSpecificationIdentity, managedDocumentIdentityPolicyIdentity, managedBindingPolicyIdentity, exactNodeProviderDomainIdentity, externalOrderPolicyIdentity, runtimeRegistryIdentity, gasManifestIdentity, portableLimitPolicyIdentity, cyclicFinalizerIdentity, cyclicProofVerifierIdentity]
