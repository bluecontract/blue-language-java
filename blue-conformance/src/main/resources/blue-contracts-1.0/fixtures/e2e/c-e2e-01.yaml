        - {namespace: processor, counter: deliverySnapshotEntry, quantity: 1, weight: 5, subtotal: 5, scopePath: /, contractKey: in, reason: revalidate-delivery}
        - {namespace: processor, counter: scopeOpened, quantity: 1, weight: 10, subtotal: 10, scopePath: /, reason: participating-scope}
        - {namespace: processor, counter: contractHeaderRecognized, quantity: 1, weight: 2, subtotal: 2, scopePath: /, contractKey: in, reason: external-channel-header}
        - {namespace: processor, counter: channelCandidateTested, quantity: 1, weight: 5, subtotal: 5, scopePath: /, contractKey: in, reason: acceptance}
    - actual: result.totalGas
