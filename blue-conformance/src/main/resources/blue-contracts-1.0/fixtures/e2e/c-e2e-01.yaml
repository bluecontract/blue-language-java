schema: blue-contracts-fixture/1.0
id: c-e2e-01
vectors:
  - C-E2E-01
category: e2e
description: Complete no-match Root result with exact public fields, named trace, gas, and semantic demands.
operation: process
input:
  root:
    value: 0
    contracts:
      in:
        type:
          blueId: LYwiqvSHTUSVN15kKLxFhVLF2qLrzVu1grmYUjbqqgp
        order: 0
        subscriptionKey: timeline
        eventKey: timeline
        accept: false
        checkpointDomain: domain-v1
