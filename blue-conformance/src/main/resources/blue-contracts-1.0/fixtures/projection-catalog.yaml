- path: trace.integerLimbOperation
  type: integer
  definition: Deterministic derived conformance projection defined by its final path component and normative processor phase.
- path: trace.lifecycleOrder
  type: sequence-or-value
  definition: Deterministic derived conformance projection defined by its final path component and normative processor phase.
- path: trace.logicalDeliveryGroups
  type: sequence-or-value
  definition: Canonical logical delivery groups and their participating raw source keys.
- path: trace.markerWrites
  type: sequence-or-value
  definition: Deterministic derived conformance projection defined by its final path component and normative processor phase.
- path: trace.namedEntries
