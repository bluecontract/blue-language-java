admissionRule: Admit quantity * weight before work into a child ledger bounded by the exact remaining Contracts budget.
mergeRule: Merge the ordered child ledger into the parent exactly once; a local limit may only reduce the remaining budget.
formulas:
  textBlocks:
    blockCodePoints: 64
    fullScan: ceil(codePointLength / 64)
    construction: ceil(constructedCodePointLength / 64)
    comparison: charge blocks actually read from each operand
  integerLimbs:
    radix: 2^32
    minimumLimbs: 1
    equalityOrOrdering: L(a) + L(b)
    additionOrSubtraction: max(L(a), L(b)) + 1
    multiplication: L(a) * L(b)
    divisionOrRemainder: L(a) * L(b)
    decimalScaleAlignment: same unscaled Integer formula plus one operation
  collectionIteration:
    input: collectionItemVisited once per evaluated item
    output: collectionItemProduced once per produced item
    dynamicObject: transientObjectMemberProduced per retained field
    dynamicList: transientListItemProduced per item
    shortCircuit: no charges for skipped items
  sorting:
    algorithm: stable bottom-up merge sort
    initialRunWidth: 1
    mergeOrder: left-to-right
    equalSelection: left
    widthProgression: double after each pass
    comparisonCharges:
    - sortComparison
    - comparisonNodeVisited
    - scalar content work
  blueBoundary:
    everyValue: blueOutputBoundary += 1
    existingExactValue: no recursive construction or size charge
    transientValue: Contracts semantic identity establishment is merged once
    nodeBlueIdTransient: nodeIdentityRequested + blueOutputBoundary + Contracts identity establishment
forbiddenPortableMetering:
- recursive estimatedSize
- serialized payload bytes at patch or event boundary
- UTF-16 length
- cache-dependent discounts
- opaque implementation-selected gasConsumed
fixtureRequirements:
- one exact microfixture per named counter
- operator behavior vectors
- representation-blind inline/reference variants
- shared-meter exhaustion prefix
- intrinsic named-ledger fixture
identityAlgorithm: sha256 of UTF-8 canonical JSON with packageIdentity set to null
