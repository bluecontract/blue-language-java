updates: 0
name: RCP2 Representation Consumer
seen: 0
log: []
contracts:
  embedded:
    type: Process Embedded
    paths:
    - /child
  owner:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: rcp2/consumer
    actor:
      type: MyOS/Principal Actor
      accountId: alice
  attach:
    type: Coordination/Sequential Workflow Operation
    channel: owner
    request:
      child: {}
    steps:
    - type: Coordination/Compute
      do:
      - $appendChange:
          op: add
          path: /child
          val:
            $binding: event/message/request/child
      - $return: true
  fromChild:
    type: Embedded Node Channel
    sourcePath: /child
    event:
      type: Coordination/Event
      kind: RCP2/Tick
  observe:
    type: Coordination/Sequential Workflow
    channel: fromChild
    event:
      type: Coordination/Event
      kind: RCP2/Tick
    steps:
    - type: Coordination/Compute
      do:
      - $appendChange:
          op: replace
          path: /seen
          val:
            $document: /child/counter
      - $appendChange:
          op: add
          path: /log/-
          val:
            $document: /child/counter
      - $return: true
  referenceChanges:
    type: Document Update Channel
    path: /child
  countChanges:
    type: Coordination/Sequential Workflow
    channel: referenceChanges
    steps:
    - type: Coordination/Compute
      do:
      - $appendChange:
          op: replace
          path: /updates
          val:
            $add:
            - $document: /updates
            - 1
      - $return: true
