name: RCP2 cycle-a
documentId: rcp2-cycle-a
phase: initial
contracts:
  embedded:
    type: Process Embedded
    paths:
    - /peer
  ownerChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: rcp2/cycle
    actor:
      type: MyOS/Principal Actor
      accountId: alice
  attachB:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      b: {}
    steps:
    - type: Coordination/Compute
      do:
      - $appendChange:
          op: add
          path: /peer
          val:
            $binding: event/message/request/b
      - $return: true
  startFinite:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request: {}
    steps:
    - type: Coordination/Compute
      do:
      - $appendChange:
          op: replace
          path: /phase
          val: started
      - $appendEvent:
          type: Coordination/Event
          kind: Tutorial/Cycle X
      - $return: true
  startLoop:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request: {}
    steps:
    - type: Coordination/Compute
      do:
      - $appendEvent:
          type: Coordination/Event
          kind: Tutorial/Cycle Loop
      - $return: true
  touchA:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request: {}
    steps:
    - type: Coordination/Compute
      do:
      - $appendChange:
          op: replace
          path: /phase
          val: usable-a
      - $return: true
  finiteFromB:
    type: Embedded Node Channel
    sourcePath: /peer
    event:
      type: Coordination/Event
      kind: Tutorial/Cycle Y
  finishFinite:
    type: Coordination/Sequential Workflow
    channel: finiteFromB
    event:
      type: Coordination/Event
      kind: Tutorial/Cycle Y
    steps:
    - type: Coordination/Compute
      do:
      - $appendChange:
          op: replace
          path: /phase
          val: done
      - $return: true
  loopFromB:
    type: Embedded Node Channel
    sourcePath: /peer
    event:
      type: Coordination/Event
      kind: Tutorial/Cycle Loop
  repeatLoop:
    type: Coordination/Sequential Workflow
    channel: loopFromB
    event:
      type: Coordination/Event
      kind: Tutorial/Cycle Loop
    steps:
    - type: Coordination/Compute
      do:
      - $appendEvent:
          type: Coordination/Event
          kind: Tutorial/Cycle Loop
      - $return: true
