        "timelineId": "rcp/literal018/P"
      },
      "actor": {
        "type": "MyOS/Principal Actor",
        "accountId": "alice"
      }
    },
    "attach": {
      "type": "Coordination/Sequential Workflow Operation",
      "channel": "owner",
      "steps": [
        {
          "type": "Coordination/Compute",
          "do": [
            {
              "$appendChange": {
                "op": "add",
                "path": {
                  "$pointerJoin": [
                    "peers",
                    {
                      "$binding": "event/message/request/edge"
                    }
                  ]
                },
                "val": {
                  "$binding": "event/message/request/source"
                }
              }
            },
            {
              "$return": true
            }
          ]
        }
      ],
      "request": {
        "edge": {
          "type": "Text",
          "schema": {
            "required": true
          }
        },
        "source": {}
      }
    },
    "detach": {
      "type": "Coordination/Sequential Workflow Operation",
      "channel": "owner",
      "steps": [
        {
          "type": "Coordination/Compute",
          "do": [
            {
              "$appendChange": {
                "op": "remove",
                "path": {
                  "$pointerJoin": [
                    "peers",
                    {
                      "$binding": "event/message/request/edge"
                    }
                  ]
                }
              }
            },
            {
              "$return": true
