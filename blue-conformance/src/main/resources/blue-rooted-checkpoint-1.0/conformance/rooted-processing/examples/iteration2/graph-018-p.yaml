    "fromMembers": {
      "type": "Embedded Collection Event Channel",
      "collectionPath": "/peers",
      "event": {
        "type": "Coordination/Event",
        "kind": "Tutorial/Graph Token"
      }
    },
    "receive": {
      "type": "Coordination/Sequential Workflow",
      "channel": "fromMembers",
      "steps": [
        {
          "type": "Coordination/Compute",
          "do": [
            {
              "$if": {
                "cond": {
                  "$eq": [
                    {
                      "$event": "/event/to"
                    },
                    {
                      "$document": "/nodeName"
                    }
                  ]
                },
                "then": [
                  {
                    "$appendChange": {
                      "op": "replace",
                      "path": "/observed",
                      "val": {
                        "$add": [
                          {
                            "$document": "/observed"
                          },
                          1
                        ]
                      }
                    }
                  },
                  {
                    "$if": {
                      "cond": {
                        "$ne": [
                          {
                            "$event": "/event/next"
                          },
                          "stop"
                        ]
                      },
                      "then": [
                        {
                          "$appendEvent": {
                            "type": "Coordination/Event",
                            "kind": "Tutorial/Graph Token",
                            "to": {
                              "$event": "/event/next"
                            },
                            "next": "stop"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            },
            {
              "$return": true
            }
          ]
        }
      ],
      "event": {
