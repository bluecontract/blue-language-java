        "edge": {
          "type": "Text",
          "schema": {
            "required": true
          }
        }
      }
    },
    "retarget": {
      "type": "Coordination/Sequential Workflow Operation",
      "channel": "owner",
      "steps": [
        {
          "type": "Coordination/Compute",
          "do": [
            {
              "$appendChange": {
                "op": "replace",
                "path": {
                  "$pointerJoin": [
                    "peers",
                    {
                      "$binding": "event/message/request/edge"
                    }
                  ]
                },
                "val": {
                  "$binding": "event/message/request/source"
                }
              }
            },
            {
              "$return": true
            }
          ]
        }
      ],
      "request": {
        "edge": {
          "type": "Text",
          "schema": {
            "required": true
          }
        },
        "source": {}
      }
    },
    "touch": {
      "type": "Coordination/Sequential Workflow Operation",
      "channel": "owner",
      "steps": [
        {
          "type": "Coordination/Compute",
          "do": [
            {
              "$appendChange": {
                "op": "replace",
                "path": "/touches",
                "val": {
                  "$add": [
                    {
                      "$document": "/touches"
                    },
                    1
                  ]
                }
              }
            },
            {
              "$return": true
            }
          ]
        }
      ],
      "request": {}
    },
    "emit": {
      "type": "Coordination/Sequential Workflow Operation",
      "channel": "owner",
      "steps": [
        {
          "type": "Coordination/Compute",
          "do": [
            {
              "$appendEvent": {
                "type": "Coordination/Event",
                "kind": "Tutorial/Graph Token",
                "to": {
                  "$binding": "event/message/request/to"
                },
                "next": {
                  "$binding": "event/message/request/next"
                }
              }
            },
            {
              "$return": true
            }
          ]
        }
