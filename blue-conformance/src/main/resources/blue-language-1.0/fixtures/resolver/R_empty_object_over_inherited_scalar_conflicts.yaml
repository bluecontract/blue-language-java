id: R_empty_object_over_inherited_scalar_conflicts
category: Resolution
operation: resolveVariants
description: omission and Source null inherit a scalar while an exact empty-object payload conflicts
fieldDeclaration:
  x: inherited-scalar
variants:
- name: omitted
  source: {}
  expectedValid: true
  expectedValue:
    /x: inherited-scalar
- name: source-null
  source:
    x: null
  expectedValid: true
  expectedValue:
    /x: inherited-scalar
- name: exact-empty-object
  source:
    x: {}
  expectedErrorCategory: TypeCompatibilityViolation
